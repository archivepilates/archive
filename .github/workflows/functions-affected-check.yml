name: ARCHIVE IN Functions Affected Check

on:
  pull_request:
    paths:
      - "firebase.json"
      - ".firebaserc"
      - "firebase/**"
      - "archivein/index.html"
      - "archivein/manifest.webmanifest"
      - "archivein/sw.js"
      - "archivein/private-chart/**"
      - "archivein/privateSurvey/**"
      - "archivein/method/**"
      - "docs/tasks/2026-10-22-method9-content.json"
      - "archivein/onsiteWelcome/**"
      - "core/**"
      - "core/rules/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/functions-affected-check.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "firebase.json"
      - ".firebaserc"
      - "firebase/**"
      - "archivein/index.html"
      - "archivein/manifest.webmanifest"
      - "archivein/sw.js"
      - "archivein/private-chart/**"
      - "archivein/privateSurvey/**"
      - "archivein/method/**"
      - "docs/tasks/2026-10-22-method9-content.json"
      - "archivein/onsiteWelcome/**"
      - "core/**"
      - "core/rules/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/functions-affected-check.yml"

jobs:
  affected-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Validate shared METHOD 9 cue card outputs
        run: npm run validate:method9-generated && node --test scripts/tests/method9-generated.test.mjs

      - name: Install Functions dependencies
        run: npm --prefix firebase/kangsain-functions/functions ci

      - name: Test holding browser callback serialization
        run: node --test scripts/tests/holding-reader-serialization.test.mjs

      - name: Test operations mail ingress and triage
        run: |
          node --test scripts/tests/operations-mail-triage.test.mjs
          firebase/kangsain-functions/functions/node_modules/.bin/tsx --test scripts/tests/operations-mail-*.test.ts

      - name: Detect affected codebases
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          node scripts/detect-affected-function-codebases.mjs --base "$BASE_SHA" --head HEAD --github-output

      - name: Build contracts and generated codebases
        run: npm run build:function-codebases

      - name: Validate function boundaries
        run: npm run validate:function-boundaries

      - name: Validate data source policy
        run: npm run validate:data-source-policy

      - name: Test system hardening and deploy safety
        run: npm run test:system-hardening

      - name: Test Imweb referral award guards
        run: node --test scripts/tests/imweb-referral-*.test.mjs

      - name: Test Imweb STAFF and student video access guards
        run: node --test scripts/tests/imweb-staff*.test.mjs scripts/tests/imweb-student-share*.test.mjs scripts/tests/imweb-video-access-completion.test.mjs scripts/tests/staff-common-rules-release.test.mjs scripts/tests/staff-video-recovery-rules-release.test.mjs

      - name: Test reel email-button approval and publication guards
        run: npm run test:reel-approval && npm run test:reel-layout

      - name: Test operator-confirmed lesson identity and original access windows
        run: node --test scripts/tests/lesson-share-*.test.mjs scripts/tests/lesson-261025-confirmed-identities.test.mjs scripts/tests/ui-lesson-2610*-recovery.test.mjs scripts/tests/lesson-261024-ops.test.mjs scripts/tests/lesson-261025-ops.test.mjs scripts/tests/lesson-identity-rules-release.test.mjs

      - name: Validate instructor lesson registration release
        run: node scripts/validate-instructor-lesson-registration-release.mjs

      - name: Test instructor ticket recovery evidence
        run: node --test scripts/tests/instructor-registration-recovery.test.mjs scripts/tests/instructor-ticket-response-diagnostics.test.mjs scripts/tests/instructor-eform-search-evidence.test.mjs scripts/tests/instructor-ticket-recovery-evidence.test.mjs scripts/tests/instructor-existing-ticket-adoption.test.mjs scripts/tests/instructor-ticket-intake-coverage.test.mjs

      - name: Test operator-only Team confirmation preview
        run: node --test scripts/tests/team-confirmation-test-policy.test.mjs scripts/tests/team-calendar-release.test.mjs scripts/tests/team-261121-confirmation.test.mjs

      - name: Test instructor signup identity and profile guards
        run: node --test scripts/tests/instructor-signup*.test.mjs

      - name: Test staff and member contact precedence
        run: npm run test:contact-staff-precedence

      - name: Test system health current-state evidence
        run: npm run test:system-health

      - name: Validate GCP cost regression guards
        run: npm run validate:gcp-cost-guards

      - name: Validate onsite welcome release guard
        run: npm run validate:onsite-welcome

      - name: Validate private media upload config
        run: npm run validate:private-media-upload-config

      - name: Validate private flow contract
        run: npm run validate:private-flow-contract

      - name: Test private flow state and revision contract
        run: npm run test:private-flow

      - name: Test unpaid instructor waitlist isolation
        run: firebase/kangsain-functions/functions/node_modules/.bin/tsx --test scripts/tests/instructor-lesson-waitlist.test.ts scripts/tests/instructor-lesson-team-intake.test.ts scripts/tests/instructor-lesson-schedule-roster.test.ts

      - name: Test private Notion member folder creation guards
        run: firebase/kangsain-functions/functions/node_modules/.bin/tsx --test scripts/tests/private-notion-member-parent.test.ts scripts/tests/private-notion-member-parent-runtime.test.ts

      - name: Validate live rollback guards
        run: npm run validate:live-release-rollback-guards

      - name: Validate release manifest writer
        run: npm run write:release-manifest -- --surface archivein --surface core --allow-non-main

      - name: Summary
        run: |
          {
            echo "### ARCHIVE IN Functions affected check"
            echo ""
            echo "- Codebases: ${{ steps.affected.outputs.codebases }}"
            echo "- Deploy target: ${{ steps.affected.outputs.deploy_only }}"
            echo "- All codebases affected: ${{ steps.affected.outputs.all_codebases_affected }}"
          } >> "$GITHUB_STEP_SUMMARY"
