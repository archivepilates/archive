name: CORE MCP Check
on:
  push:
    branches: [main, 'codex/mini/core-ops-mcp-*']
    paths:
      - 'services/archive-core-mcp/**'
      - 'scripts/release-core-mcp-rules.mjs'
      - 'scripts/tests/core-mcp-rules-ui.test.mjs'
      - 'core/rules/index.html'
      - 'firebase/kangsain-functions/functions/src/exports/**'
      - '.github/workflows/core-mcp-check.yml'
  pull_request:
    paths:
      - 'services/archive-core-mcp/**'
      - 'scripts/release-core-mcp-rules.mjs'
      - 'scripts/tests/core-mcp-rules-ui.test.mjs'
      - 'core/rules/index.html'
      - 'firebase/kangsain-functions/functions/src/exports/**'
      - '.github/workflows/core-mcp-check.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/archive-core-mcp/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: services/archive-core-mcp
      - run: npm test
        working-directory: services/archive-core-mcp
      - run: npm audit --omit=dev
        working-directory: services/archive-core-mcp
  rules-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/tests/core-mcp-rules-ui.test.mjs
