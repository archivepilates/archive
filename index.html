<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARCHIVE-DASH</title>
  <script>
    if (location.hostname === 'archivepilates.github.io') {
      location.replace('https://archive-pilates.web.app/dashboard/');
    }
  </script>
  <meta name="theme-color" content="#080d1a">
  <meta name="application-name" content="ARCHIVE-DASH">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ARCHIVE-DASH">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=4">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    @font-face {
      font-family: "Archive Latin";
      font-style: normal;
      font-weight: 400 900;
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff") format("woff");
      unicode-range: U+0000-00FF, U+2000-206F, U+20A0-22FF, U+25A0-25FF;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #080d1a;
      overflow: hidden;
      font-family: "Archive Latin", "Pretendard", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      position: fixed;
      inset: env(safe-area-inset-top) 0 0 0;
      background: #080d1a;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #080d1a;
    }

    .fallback {
      position: fixed;
      inset: env(safe-area-inset-top) 0 0 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      text-align: center;
      background: #080d1a;
      z-index: 0;
    }

    .fallback a {
      color: #93c5fd;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="fallback">
    <div>
      <strong>ARCHIVE-DASH</strong><br>
      <a href="/dashboard/">현황판 열기</a>
    </div>
  </div>
  <main class="app">
    <iframe
      title="ARCHIVE-DASH"
      src="/dashboard/"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
