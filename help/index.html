<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fffdfa">
<meta name="description" content="아카이브필라테스 명지점 수강과 회원 문의 안내 및 접수">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>상담 도우미 · ARCHIVE PILATES</title>
<link rel="stylesheet" href="/chatbot/chatbot.css">
<script src="/chatbot/app.js" type="module"></script>
<script src="/chatbot/intake-ui.js" type="module"></script>
<script src="/chatbot/recommendation-ui.js" type="module"></script>
</head>
<body>
<main class="help">
  <header class="top">
    <a class="brand" href="/" aria-label="아카이브 챗봇 홈">
      <img src="/favicon.png" width="36" height="36" alt="">
      <span><strong>아카이브 챗봇</strong><small>ARCHIVE PILATES · 명지점</small></span>
    </a>
    <div class="top-actions">
      <button id="reset-chat" type="button" class="icon-button" aria-label="새 대화" title="새 대화">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 1 9 9 9 9 0 0 1-6.7-3.1M3 12V5m0 7h7"/></svg>
      </button>
      <button id="start-intake" type="button" class="staff-button">직원 문의</button>
    </div>
  </header>
  <noscript><p>상담 도우미를 열려면 자바스크립트가 필요해요. <a href="/inquiry/">기존 문의 양식</a>을 이용해 주세요.</p></noscript>
  <section class="chat-workspace" aria-labelledby="chat-title">
    <h1 id="chat-title" class="sr-only">아카이브 챗봇</h1>
    <div id="conversation" role="log" aria-label="상담 대화" aria-live="polite" tabindex="0"></div>
    <div class="compose">
      <p class="suggestions-title" aria-hidden="true">추천 질문</p>
      <div id="prompts" class="quick suggestions" role="group" aria-label="추천 질문">
        <button id="start-recommendation" type="button" aria-haspopup="dialog">
          <svg class="prompt-art" width="48" height="36" viewBox="0 0 160 120" aria-hidden="true" focusable="false"><use href="/assets/categories.svg#fixed"></use></svg>
          <span>30초 수업 추천</span>
        </button>
        <button type="button" data-question="명지점 시간표 보여줘">
          <svg class="prompt-art" width="48" height="36" viewBox="0 0 160 120" aria-hidden="true" focusable="false"><use href="/assets/categories.svg#booking"></use></svg>
          <span>시간표</span>
        </button>
        <button type="button" data-question="수강료 알려줘">
          <svg class="prompt-art" width="48" height="36" viewBox="0 0 160 120" aria-hidden="true" focusable="false"><use href="/assets/categories.svg#conversion"></use></svg>
          <span>수강료</span>
        </button>
        <button type="button" data-question="수강권을 잠시 멈출 수 있나요?">
          <svg class="prompt-art" width="48" height="36" viewBox="0 0 160 120" aria-hidden="true" focusable="false"><use href="/assets/categories.svg#holding"></use></svg>
          <span>홀딩 규정</span>
        </button>
        <button type="button" data-question="내 수강권 몇 회 남았어?">
          <svg class="prompt-art" width="48" height="36" viewBox="0 0 160 120" aria-hidden="true" focusable="false"><use href="/assets/categories.svg#renewal"></use></svg>
          <span>내 수강권</span>
        </button>
      </div>
      <form id="question">
        <label class="sr-only" for="query">궁금한 내용</label>
        <div class="input-row">
          <input id="query" maxlength="160" required autocomplete="off" enterkeyhint="send" placeholder="궁금한 내용을 입력해 주세요">
          <button type="submit" class="icon-button send" aria-label="보내기" title="보내기">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.7 3.7 22 12 3.7 20.3 6 12l-2.3-8.3ZM6 12h16"/></svg>
          </button>
        </div>
      </form>
      <p class="privacy-note">이름·연락처·생년월일은 채팅에 입력하지 마세요.</p>
    </div>
  </section>

<div hidden><button id="refund-intake" type="button">환불 상담</button><button id="inline-intake" type="button">직원에게 문의하기</button></div>

<dialog id="class-recommendation" aria-labelledby="recommendation-title">
  <div class="recommendation-top">
    <h2 id="recommendation-title">30초 수업 추천</h2>
    <button class="icon-button" type="button" data-close-recommendation aria-label="수업 추천 닫기" title="수업 추천 닫기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
    </button>
  </div>
  <form aria-labelledby="recommendation-title">
    <fieldset>
      <legend>가능한 시간</legend>
      <div class="recommendation-options">
        <label><input type="radio" name="time" value="weekdayMorning" required>평일 오전</label>
        <label><input type="radio" name="time" value="weekdayAfternoon">평일 오후</label>
        <label><input type="radio" name="time" value="weekdayEvening">평일 저녁</label>
        <label><input type="radio" name="time" value="weekend">주말</label>
        <label><input type="radio" name="time" value="flexible">시간 무관</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>운동 목표</legend>
      <div class="recommendation-options">
        <label><input type="radio" name="goal" value="basics" required>기초 익히기</label>
        <label><input type="radio" name="goal" value="strength">근력·코어</label>
        <label><input type="radio" name="goal" value="routine">운동 습관 만들기</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>원하는 강도</legend>
      <div class="recommendation-options">
        <label><input type="radio" name="intensity" value="gentle" required>가볍게</label>
        <label><input type="radio" name="intensity" value="moderate">보통</label>
        <label><input type="radio" name="intensity" value="active">활동적으로</label>
      </div>
    </fieldset>
    <button type="submit">추천 수업 보기</button>
  </form>
  <section aria-labelledby="recommendation-results-title" data-recommendation-results hidden>
    <h3 id="recommendation-results-title" tabindex="-1" data-results-heading>추천 수업</h3>
    <p data-recommendation-note></p>
    <ol class="recommendation-results"></ol>
    <p data-recommendation-advice></p>
    <p class="recommendation-booking-hint">회원 앱에서 명지점 날짜·시간을 선택해 예약해 주세요.</p>
    <div class="recommendation-actions">
      <a data-recommendation-booking class="recommendation-booking" href="https://archivepilates.notion.site/studiomate">StudioMate 예약 안내</a>
      <button type="button" data-edit-recommendation>조건 바꾸기</button>
    </div>
    <a data-recommendation-source class="recommendation-source">시간표 원본</a>
  </section>
</dialog>

<section id="intake" aria-labelledby="intake-title" hidden>
  <h2 id="intake-title" tabindex="-1">직원에게 문의하기</h2>
  <p id="intake-prompt">어떤 문의를 접수할까요?</p>
  <div id="intake-choices"></div>
  <p id="intake-status" role="status"></p>
  <div class="quick">
    <button type="button" id="intake-back" hidden>이전</button>
    <button type="button" id="intake-cancel">안내로 돌아가기</button>
  </div>
</section>
<footer><a href="tel:01029244425">명지점 데스크 010-2924-4425</a><a href="/privacy.html">개인정보 수집·이용 안내</a><a href="/inquiry/">챗봇 이용이 어려울 때: 기존 문의 양식</a></footer>
</main>
</body>
</html>
