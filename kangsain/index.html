<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>아카이브IN</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="아카이브IN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="아카이브IN">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest?v=24">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=24">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=24">
  <style>
    :root {
      --ink: #171717;
      --muted: #75706a;
      --line: #e7e1dc;
      --paper: #ffffff;
      --soft: #fbf5ef;
      --brand: #e8752f;
      --brand-dark: #b9521d;
      --good: #728053;
      --bad: #a94d38;
      --wait: #a8793d;
      --shadow: 0 10px 30px rgba(30, 20, 12, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body { overflow-x: hidden; }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    .chip,
    .lecture,
    .member,
    .modal-panel {
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .app {
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      background: linear-gradient(#fff, #fff 55%, #fbf7f3);
    }

    .shell {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 72px;
      padding: 10px 0 14px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
    }

    .sync-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      overflow: hidden;
      background: transparent;
    }

    .sync-bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: 999px;
      background: var(--brand);
      opacity: 0;
      transform: translateX(-110%);
    }

    .topbar.loading .sync-bar::before {
      opacity: 1;
      animation: syncMove 1.1s ease-in-out infinite;
    }

    .logo {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .identity {
      min-width: 0;
      flex: 1;
    }

    .identity h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 850;
    }

    .identity p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ghost,
    .primary,
    .soft-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 760;
      font-size: 14px;
      white-space: nowrap;
    }

    .primary {
      color: #fff;
      background: var(--brand);
    }

    .soft-button {
      color: var(--brand-dark);
      background: var(--soft);
    }

    .ghost {
      color: var(--muted);
      background: transparent;
    }

    .login {
      display: grid;
      min-height: calc(100dvh - 60px);
      place-items: center;
      text-align: center;
    }

    .login-panel {
      width: min(420px, 100%);
    }

    .login-mark {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 18px;
      background: var(--brand);
      color: #fff;
      font-size: 28px;
      font-weight: 850;
      box-shadow: var(--shadow);
    }

    .login-brand {
      margin: 0 0 14px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.24em;
    }

    .login h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
    }

    .login p {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .email-login {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .email-login input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .email-login input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(232, 117, 47, 0.14);
    }

    .config-warning {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid #f0d2c0;
      border-radius: 8px;
      color: var(--brand-dark);
      background: #fff7f1;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
    }

    .datebar {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 12px;
      margin: 8px -16px 22px;
      padding: 14px 16px;
      border-block: 1px solid var(--line);
      background: #fbfbfa;
    }

    .datebar button {
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 24px;
    }

    .datebar strong {
      text-align: center;
      font-size: 22px;
    }

    .view-stage {
      animation: viewIn 180ms ease both;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .summary-item {
      min-width: 0;
      padding: 18px 8px;
      text-align: center;
    }

    .summary-item + .summary-item {
      border-left: 1px solid var(--line);
    }

    .summary-label {
      display: block;
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.16em;
    }

    .summary-value {
      display: block;
      margin-top: 8px;
      font-size: 32px;
      line-height: 1;
      font-weight: 850;
    }

    .summary-note {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .admin-toolbar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px;
      margin-top: 18px;
      scrollbar-width: none;
    }

    .admin-toolbar::-webkit-scrollbar {
      display: none;
    }

    .admin-filter {
      flex: 0 0 auto;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .admin-filter.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .admin-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin: 0 0 16px;
    }

    .admin-tab {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .admin-tab.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .admin-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .admin-panel h2,
    .admin-panel h3 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 850;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .admin-table th,
    .admin-table td {
      padding: 9px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .admin-table th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .admin-meter {
      display: grid;
      gap: 8px;
    }

    .admin-meter-row {
      display: grid;
      grid-template-columns: 58px 1fr 44px;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .admin-meter-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #f1ede8;
    }

    .admin-meter-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--brand);
    }

    .admin-list {
      display: grid;
      gap: 8px;
    }

    .admin-list-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .admin-list-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .admin-list-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .admin-search {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 12px;
    }

    .chat-staff-list {
      display: grid;
      align-content: start;
      gap: 6px;
      max-height: 460px;
      overflow: auto;
    }

    .chat-staff {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      white-space: nowrap;
    }

    .chat-staff.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .chat-box {
      display: grid;
      grid-template-rows: auto minmax(260px, 46dvh) auto;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .chat-head strong {
      font-size: 15px;
      font-weight: 850;
    }

    .chat-messages {
      display: grid;
      align-content: end;
      gap: 8px;
      padding: 12px;
      overflow: auto;
      background: #fbfaf8;
    }

    .chat-message {
      max-width: 82%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.42;
    }

    .chat-message.mine {
      justify-self: end;
      border-color: #f0d2c0;
      background: #fff4eb;
    }

    .chat-message small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
    }

    .chat-form input {
      min-height: 42px;
    }

    .chat-dock {
      position: fixed;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 35;
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      margin: 0;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .floating-chat {
      position: fixed;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 34;
      width: 58px;
      height: 58px;
      border-radius: 999px;
      padding: 0;
      color: #fff;
      background: var(--brand);
      box-shadow: var(--shadow);
      font-weight: 900;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .floating-chat.dragging {
      cursor: grabbing;
      transition: none;
    }

    .floating-chat .chat-icon {
      display: block;
      font-size: 25px;
      line-height: 1;
    }

    .floating-chat .badge {
      position: absolute;
      top: -4px;
      right: -3px;
      margin: 0;
    }

    .admin-staff-block {
      margin-top: 18px;
    }

    .admin-staff-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }

    .admin-staff-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 850;
    }

    .admin-staff-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .section-title {
      margin: 26px 0 12px;
      color: var(--brand);
      font-size: 17px;
      font-weight: 850;
    }

    .lecture {
      border: 1px solid #d8d1cb;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      margin-bottom: 14px;
      animation: cardIn 180ms ease both;
    }

    .lecture:has(.lecture-head:active),
    .member:has(.tiny:active) {
      box-shadow: 0 8px 22px rgba(30, 20, 12, 0.07);
    }

    .lecture-head {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 18px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .lecture.collapsed .lecture-head {
      border-bottom: 0;
    }

    .lecture.collapsed .member-list {
      display: none;
    }

    .time {
      color: var(--brand-dark);
      font-size: 20px;
      font-weight: 850;
    }

    .lecture-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 850;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 7px;
      padding: 0 8px;
      color: var(--muted);
      background: #f5f2ef;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip.group { color: var(--brand-dark); background: #fff1e7; }
    .chip.private { color: #6b5336; background: #f2ece4; }
    .chip.unknown { color: #6f6962; background: #eee9e4; }
    .chip.good { color: var(--good); background: #eef2e5; }
    .chip.bad { color: var(--bad); background: #faebe6; }
    .chip.wait { color: var(--wait); background: #fff5df; }
    .chip.done { color: #676159; background: #eee9e4; }
    .chip.attendance { padding-inline: 6px; font-size: 11px; }
    .chip.memo { color: var(--bad); background: #faeee9; }
    .chip.profile { color: #6b5336; background: #f2ece4; }
    .chip.manual { color: var(--brand-dark); background: #fff1e7; }

    .chip.pending {
      color: var(--brand-dark);
      background: #fff1e7;
      animation: pulseSoft 1s ease-in-out infinite;
    }

    .badge {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      margin-left: 5px;
      border-radius: 999px;
      padding: 0 5px;
      color: #fff;
      background: var(--bad);
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .chevron {
      color: var(--muted);
      font-size: 18px;
      font-weight: 850;
      transform: rotate(180deg);
    }

    .lecture.collapsed .chevron {
      transform: rotate(0deg);
    }

    .member-list {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .member {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .member-main {
      min-width: 0;
    }

    .member-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex-wrap: nowrap;
      justify-content: space-between;
    }

    .member-name {
      flex: 0 0 auto;
      font-size: 18px;
      font-weight: 850;
      white-space: nowrap;
    }

    .tag-field {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 8px;
      min-width: 0;
    }

    .tag-label {
      flex: 0 0 auto;
      padding-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .tag-field.no-label {
      gap: 0;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-width: 0;
    }

    .member-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tiny {
      min-height: 34px;
      border-radius: 7px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .tiny.active.good { color: #fff; background: var(--good); border-color: var(--good); }
    .tiny.active.bad { color: #fff; background: var(--bad); border-color: var(--bad); }
    .tiny:disabled { opacity: 0.45; cursor: not-allowed; }

    .loading {
      display: grid;
      place-items: center;
      min-height: 260px;
      gap: 18px;
      color: var(--muted);
    }

    .loading.only-logo {
      min-height: calc(100dvh - 64px);
    }

    .loading-brand {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .loading-logo {
      position: relative;
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      overflow: hidden;
      border: 1px solid #f0d2c0;
      border-radius: 20px;
      color: var(--brand);
      background: #fff8f3;
      font-size: 26px;
      font-weight: 900;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .loading-logo::before {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 100%;
      background: var(--brand);
      transform: translateY(100%);
      animation: logoFill 1.35s ease-in-out infinite;
      z-index: -1;
    }

    .loading-logo::after {
      content: "IN";
      position: absolute;
      color: #fff;
      opacity: 0;
      animation: logoTextFill 1.35s ease-in-out infinite;
    }

    .loading-brand span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
    }

    .skeleton {
      width: 100%;
      display: grid;
      gap: 12px;
    }

    .skeleton-line {
      height: 78px;
      border-radius: 8px;
      background: linear-gradient(90deg, #f6f2ee, #fff, #f6f2ee);
      background-size: 220% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      from { background-position: 220% 0; }
      to { background-position: -220% 0; }
    }

    .empty,
    .error {
      padding: 28px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      text-align: center;
    }

    .error {
      border-color: #f0d2c0;
      color: var(--brand-dark);
      background: #fff7f1;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: end;
      padding: 16px;
      background: rgba(20, 16, 13, 0.28);
      z-index: 20;
    }

    .modal.open { display: flex; }

    .modal.open .modal-panel {
      animation: modalUp 180ms ease both;
    }

    .modal-panel {
      width: min(560px, 100%);
      margin: 0 auto;
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head,
    .modal-body {
      padding: 16px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
    }

    textarea,

  </style>

<body>
  <div id="root" class="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="memoModal" class="modal" aria-hidden="true">

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      getRedirectResult,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signInWithPopup,
      signInWithRedirect,

      updatePassword
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js';
    import {
      collection,
      doc,
      getDoc,
      getDocs,
      getFirestore,
      limit as queryLimit,
      onSnapshot,
      orderBy,
      query,
      serverTimestamp,

      updateDoc,

    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import {
      getMessaging,
      getToken,
      isSupported
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js';

    const root = document.getElementById('root');
    const toast = document.getElementById('toast');
    const modal = document.getElementById('memoModal');
    const memoTitle = document.getElementById('memoTitle');
    const memoInput = document.getElementById('memoInput');
    const memoHistory = document.getElementById('memoHistory');
    const saveMemoButton = document.getElementById('saveMemoButton');
    const loadMemoButton = document.getElementById('loadMemoButton');
    const FLOATING_CHAT_POSITION_KEY = 'archiveInFloatingChatPosition';

    const config = window.KANGSAIN_FIREBASE_CONFIG || null;
    const appState = {
      app: null,
      auth: null,
      db: null,
      functions: null,
      user: null,
      staff: null,
      days: [],
      mode: 'instructor',
      admin: {
        staffs: [],
        views: [],
        rangeViews: [],
        memos: [],
        syncState: null,
        selectedStaffId: 'all',
        activeTab: 'overview',
        searchQuery: ''
      },
      chat: {

        selectedStaffId: '',
        messages: [],
        conversations: [],
        conversationsUnsubscribe: null,
        lastConversationsKey: '',
        lastMessagesKey: '',
        floatingPosition: readFloatingChatPosition(),
        readMarks: {},
        unsubscribe: null
      },
      selectedDate: today(),
      loading: false,
      error: '',
      activeBooking: null,
      openLectures: new Set(),

      toastTimer: null
    };

    const functionNames = {
      getHome: 'getInstructorHome',
      attendance: 'submitBookingAttendance',
      memo: 'submitMemberMemo',
      registerFcm: 'registerFcmToken'
    };

    init();

    function init() {
      if (!config || !config.apiKey) {
        renderLogin('Firebase 설정 파일이 없습니다. kangsain/firebase-config.js를 배포 환경에 추가해야 합니다.');
        return;
      }
      appState.app = initializeApp(config);
      appState.auth = getAuth(appState.app);
      appState.db = getFirestore(appState.app);
      appState.functions = getFunctions(appState.app, config.functionsRegion || 'asia-northeast3');
      getRedirectResult(appState.auth).catch((err) => {
        appState.error = friendlyError(err);
        renderLogin(appState.error);
      });
      onAuthStateChanged(appState.auth, async (user) => {
        appState.user = user;
        if (!user) {
          unsubscribeViews();
          appState.staff = null;
          appState.days = [];
          appState.mode = 'instructor';
          appState.admin = {
            staffs: [],
            views: [],
            rangeViews: [],
            memos: [],
            syncState: null,
            selectedStaffId: 'all',
            activeTab: 'overview',
            searchQuery: ''
          };
          unsubscribeChat();
          unsubscribeConversations();
          appState.chat = {
            open: false,
            selectedStaffId: '',
            messages: [],
            conversations: [],
            conversationsUnsubscribe: null,
            lastConversationsKey: '',
            lastMessagesKey: '',
            floatingPosition: readFloatingChatPosition(),
            readMarks: {},
            unsubscribe: null
          };
          renderLogin();
          return;
        }
        await loadHome();
        registerPushToken().catch(() => {});
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
        });
      }
    }

    function renderLogin(warning = '') {
      root.innerHTML = `
        <main class="login">
          <section class="login-panel">
            <div class="login-mark">IN</div>
            <div class="login-brand">ARCHIVE IN</div>
            <h1>아카이브IN</h1>

            <div class="email-login">
              <input id="phoneInput" type="tel" inputmode="numeric" autocomplete="tel" placeholder="휴대폰번호">
              <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호 또는 임시코드">
              <button id="phoneLoginButton" class="primary" type="button">로그인</button>
            </div>
            <div class="config-warning" style="${warning ? 'display:block' : ''}">${escapeHtml(warning)}</div>
            <div class="email-login" style="margin-top:18px;">
              <input id="setupPhoneInput" type="tel" inputmode="numeric" autocomplete="tel" placeholder="휴대폰번호">
              <input id="tempCodeInput" type="password" inputmode="numeric" placeholder="운영자 임시코드">
              <input id="newPinInput" type="password" inputmode="numeric" autocomplete="new-password" placeholder="새 비밀번호 6자리 이상">
              <input id="newPinConfirmInput" type="password" inputmode="numeric" autocomplete="new-password" placeholder="새 비밀번호 확인">
              <button id="setupPinButton" class="soft-button" type="button">임시코드로 비밀번호 변경</button>

      document.getElementById('phoneLoginButton')?.addEventListener('click', signInWithPhonePin);
      document.getElementById('setupPinButton')?.addEventListener('click', setupPhonePin);
      document.getElementById('pinInput')?.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') signInWithPhonePin();
      });
    }

    function renderApp() {
      if (appState.loading) {
        renderLoadingApp();
        return;
      }
      if (appState.mode === 'manager') {
        renderAdminApp();
        return;
      }
      const day = currentDay();
      root.innerHTML = `
        <main class="shell">
          <header class="topbar ${appState.loading ? 'loading' : ''}">
            <button id="homeLogoButton" class="logo" type="button" aria-label="오늘 수업으로 이동">IN</button>
            <div class="identity">
              <h1>${escapeHtml(appState.staff?.name || appState.user?.displayName || '강사')}</h1>
              <p>${appState.loading ? '동기화 확인 중' : formatSyncText(day)}</p>
            </div>
            <button id="refreshButton" class="soft-button" type="button">새로고침</button>
            <button id="logoutButton" class="ghost" type="button">로그아웃</button>
            <div class="sync-bar" aria-hidden="true"></div>
          </header>
          <nav class="datebar">
            <button id="prevDate" type="button" aria-label="이전 날짜">‹</button>

          <div class="view-stage" data-date="${escapeAttr(appState.selectedDate)}">

        </main>

        ${appState.chat.open ? renderInstructorChatDock() : ''}
      `;
      bindAppEvents();
    }

    function renderLoadingApp() {
      root.innerHTML = `
        <main class="shell">
          <section class="loading only-logo">
            <div class="loading-brand">
              <div class="loading-logo">IN</div>
            </div>
          </section>
        </main>
      `;
    }

    function renderAdminApp() {
      root.innerHTML = `
        <main class="shell">
          <header class="topbar ${appState.loading ? 'loading' : ''}">
            <button id="homeLogoButton" class="logo" type="button" aria-label="오늘 운영 화면으로 이동">IN</button>
            <div class="identity">
              <h1>아카이브IN 운영자</h1>
              <p>${appState.loading ? '동기화 확인 중' : adminSyncText()}</p>
            </div>
            <button id="refreshButton" class="soft-button" type="button">새로고침</button>
            <button id="logoutButton" class="ghost" type="button">로그아웃</button>
            <div class="sync-bar" aria-hidden="true"></div>
          </header>
          <nav class="datebar">
            <button id="prevDate" type="button" aria-label="이전 날짜">‹</button>
            <strong>${dateLabel(appState.selectedDate)}</strong>
            <button id="nextDate" type="button" aria-label="다음 날짜">›</button>
          </nav>

    function renderBody(day) {
      if (appState.error) return `<section class="error">${escapeHtml(appState.error)}</section>`;
      if (!day) return `<section class="empty">선택한 날짜의 수업이 없습니다</section>`;
      const classCounts = classTypeCounts(day.lectures || []);
      return `
        <section class="summary">
          <div class="summary-item">
            <span class="summary-label">CLASSES</span>
            <span class="summary-value">${day.summary?.totalLectures || 0}</span>
            <span class="summary-note">그룹 ${classCounts.group} · 프라이빗 ${classCounts.private}</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">MEMBERS</span>
            <span class="summary-value">${day.summary?.totalBookings || 0}</span>
            <span class="summary-note">대기 ${day.summary?.waitCount || 0}</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">ALERTS</span>
            <span class="summary-value">${day.summary?.uncheckedAttendanceCount || 0}</span>

          </div>
        </section>
        <h2 class="section-title">${dateLabel(day.date)} 수업</h2>
        ${(day.lectures || []).map(renderLecture).join('') || '<section class="empty">수업이 없습니다</section>'}
      `;
    }

    function renderAdminBody() {
      if (appState.error) return `<section class="error">${escapeHtml(appState.error)}</section>`;
      const views = currentAdminViews();
      const summary = adminSummary(views);
      return `
        ${renderAdminTabs()}

          <div class="summary-item">

      `;
    }

    function renderAdminTabs() {
      const active = appState.admin.activeTab || 'overview';
      const tabs = [
        ['overview', '현황'],
        ['analytics', '분석'],
        ['issues', '이슈'],
        ['members', '회원검색'],
        ['chat', `채팅${renderUnreadBadge(totalUnreadChats())}`]
      ];
      return `
        <nav class="admin-tabs" aria-label="운영자 메뉴">

          `).join('')}
        </nav>
      `;
    }

    function renderAdminTabBody(views) {
      const active = appState.admin.activeTab || 'overview';
      if (active === 'analytics') return `${renderAdminStaffFilters()}${renderAdminAnalytics()}`;
      if (active === 'issues') return `${renderAdminStaffFilters()}${renderAdminIssues()}`;
      if (active === 'members') return renderAdminMemberSearch();
      if (active === 'chat') return renderAdminChat();
      return `
        ${renderAdminTrend()}
        ${renderAdminStaffFilters()}
        ${views.length ? views.map(renderAdminStaffView).join('') : '<section class="empty">선택한 날짜의 수업이 없습니다</section>'}
      `;
    }

    function renderInstructorChatDock() {
      return `
        <section class="admin-panel chat-dock">
          <h2 style="margin:0 0 12px; font-size:16px;">운영자 채팅</h2>
          ${renderChatBox(appState.staff?.staffId || '', appState.staff?.name || '운영자')}
        </section>
      `;
    }

    function renderFloatingChatButton() {
      return `
        <button id="chatButton" class="floating-chat" type="button" aria-label="채팅 열기" style="${floatingChatStyle()}">
          <span class="chat-icon" aria-hidden="true">💬</span>${renderUnreadBadge(totalUnreadChats())}
        </button>
      `;
    }

    function readFloatingChatPosition() {
      try {
        const saved = JSON.parse(localStorage.getItem(FLOATING_CHAT_POSITION_KEY) || 'null');
        if (!saved || !Number.isFinite(saved.x) || !Number.isFinite(saved.y)) return null;
        return saved;
      } catch (error) {
        return null;
      }
    }

    function clampFloatingChatPosition(position, size = 58) {
      if (!position) return null;
      const margin = 8;
      const maxX = Math.max(margin, window.innerWidth - size - margin);
      const maxY = Math.max(margin, window.innerHeight - size - margin);
      return {
        x: Math.min(Math.max(margin, position.x), maxX),
        y: Math.min(Math.max(margin, position.y), maxY)
      };
    }

    function floatingChatStyle() {
      const position = clampFloatingChatPosition(appState.chat.floatingPosition);
      if (!position) return '';
      appState.chat.floatingPosition = position;
      return `left:${position.x}px;top:${position.y}px;right:auto;bottom:auto;`;
    }

    function setFloatingChatPosition(button, position) {
      const nextPosition = clampFloatingChatPosition(position, button.offsetWidth || 58);
      if (!nextPosition) return;
      appState.chat.floatingPosition = nextPosition;
      button.style.left = `${nextPosition.x}px`;
      button.style.top = `${nextPosition.y}px`;
      button.style.right = 'auto';
      button.style.bottom = 'auto';
    }

    function bindFloatingChatDrag(button) {
      if (!button) return;
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;
      let moved = false;

      button.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        pointerId = event.pointerId;
        const rect = button.getBoundingClientRect();
        startX = event.clientX;
        startY = event.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        moved = false;
        button.classList.add('dragging');
        button.setPointerCapture?.(pointerId);
      });

      button.addEventListener('pointermove', (event) => {
        if (event.pointerId !== pointerId) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        if (!moved) return;
        event.preventDefault();
        setFloatingChatPosition(button, {
          x: startLeft + dx,
          y: startTop + dy
        });
      });

      const endDrag = (event) => {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        button.classList.remove('dragging');
        button.releasePointerCapture?.(event.pointerId);
        if (!moved) return;
        button.dataset.dragged = 'true';
        localStorage.setItem(FLOATING_CHAT_POSITION_KEY, JSON.stringify(appState.chat.floatingPosition));
        setTimeout(() => {
          delete button.dataset.dragged;
        }, 0);
      };

      button.addEventListener('pointerup', endDrag);
      button.addEventListener('pointercancel', endDrag);
    }

    function renderAdminChat() {
      const staffs = appState.admin.staffs || [];
      const selected = selectedChatStaffId();
      return `
        <section class="admin-panel">
          <h2>강사 1:1 채팅</h2>
          <div class="chat-layout">

      return `
        <article class="lecture ${isOpen ? '' : 'collapsed'}">
          <button class="lecture-head" type="button" data-toggle-lecture="${escapeAttr(lecture.lectureId)}" aria-expanded="${isOpen ? 'true' : 'false'}">

                ${renderOptionalChip(lecture.roomName || lecture.divisionName)}
                <span class="chip">${lecture.bookingCount || 0}명</span>
                ${lecture.waitCount ? `<span class="chip wait">대기 ${lecture.waitCount}</span>` : ''}

      const ticketName = showTicket ? privateTicketLabel(booking.ticketName) : '';

          <div class="member-main">
            <div class="member-row">
              <span class="member-name">${escapeHtml(booking.memberName || '회원')}</span>
              <span class="chip ${statusClass(booking)}">${statusLabel(booking)}</span>
            </div>
            ${renderTagField('', tagGroups.fixed)}
            ${renderTagField('강사', tagGroups.manual)}
            <div class="chips ${showTicket || booking.lastMemoPreview ? '' : 'hidden'}">
              ${renderOptionalChip(ticketName)}
              ${showTicket && booking.ticketRemainingCount != null ? `<span class="chip">${booking.ticketRemainingCount}회</span>` : ''}

              <button class="tiny" data-memo="${booking.bookingId}" data-member="${booking.memberId}" data-lecture="${lecture.lectureId}" data-name="${escapeAttr(booking.memberName || '')}">메모</button>
