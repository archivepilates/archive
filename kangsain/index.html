    function bindAppEvents() {
      document.getElementById('logoutButton')?.addEventListener('click', () => signOut(appState.auth));
      document.getElementById('homeLogoButton')?.addEventListener('click', goToday);
      const chatButton = document.getElementById('chatButton');
      bindFloatingChatDrag(chatButton);
      chatButton?.addEventListener('click', () => {
        if (chatButton.dataset.dragged === 'true') return;
        if (appState.mode === 'manager') {
          appState.admin.activeTab = 'chat';
          appState.chat.open = false;
          subscribeChat(selectedChatStaffId());
        } else {
          appState.chat.open = true;
          subscribeChat(appState.staff?.staffId || '');
        }
        renderApp();
      });
      root.querySelector('[data-close-chat]')?.addEventListener('click', () => {
        appState.chat.open = false;
        unsubscribeChat();
        renderApp();
      });
      document.getElementById('refreshButton')?.addEventListener('click', loadHome);
      document.getElementById('prevDate')?.addEventListener('click', () => shiftDate(-1));
      document.getElementById('nextDate')?.addEventListener('click', () => shiftDate(1));
      root.querySelectorAll('[data-admin-tab]').forEach((button) => {
        button.addEventListener('click', () => {
          appState.admin.activeTab = button.dataset.adminTab || 'overview';
          if (appState.admin.activeTab === 'chat') subscribeChat(selectedChatStaffId());
          else if (appState.mode === 'manager') unsubscribeChat();
          renderApp();
        });
      });
      root.querySelectorAll('[data-chat-staff]').forEach((button) => {
        button.addEventListener('click', () => {
          appState.chat.selectedStaffId = button.dataset.chatStaff || '';
          subscribeChat(appState.chat.selectedStaffId);
          renderApp();
        });
      });
      root.querySelectorAll('[data-chat-form]').forEach((form) => {
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          sendChatMessage(form.dataset.chatForm, form.querySelector('input')?.value || '');
        });
      });
      root.querySelectorAll('[data-admin-staff]').forEach((button) => {
        button.addEventListener('click', () => {
          appState.admin.selectedStaffId = button.dataset.adminStaff || 'all';
          renderApp();
        });
      });
      const adminSearchInput = document.getElementById('adminSearchInput');
      adminSearchInput?.addEventListener('input', (event) => {
        appState.admin.searchQuery = event.target.value.trim();
        const results = document.getElementById('adminSearchResults');
        if (results) results.innerHTML = renderAdminSearchResults();
      });
      root.querySelectorAll('[data-toggle-lecture]').forEach((button) => {
        button.addEventListener('click', () => toggleLecture(button.dataset.toggleLecture));
      });
      root.querySelectorAll('[data-attendance]').forEach((button) => {
        button.addEventListener('click', () => updateAttendance(button.dataset.attendance, button.dataset.status));
      });
      root.querySelectorAll('[data-memo]').forEach((button) => {
        button.addEventListener('click', () => openMemo({
          bookingId: button.dataset.memo,
          memberId: button.dataset.member,
          lectureId: button.dataset.lecture,
          memberName: button.dataset.name
        }));
      });
    }

    async function signIn() {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ hd: 'archivepilates.com' });
      try {
        await signInWithPopup(appState.auth, provider);
      } catch (err) {
        if (err && err.code === 'auth/popup-blocked') {
          await signInWithRedirect(appState.auth, provider);
          return;
        }
        throw err;
      }
    }

    async function signInWithEmail() {
      const email = document.getElementById('emailInput')?.value.trim();
      const password = document.getElementById('passwordInput')?.value;
      if (!email || !password) {
        appState.error = '이메일과 비밀번호를 입력하세요';
        renderLogin(appState.error);
        return;
      }
      try {
        await signInWithEmailAndPassword(appState.auth, email, password);
      } catch (err) {
        appState.error = friendlyError(err);
        renderLogin(appState.error);
      }
    }

    async function signInWithPhonePin() {
      const phone = document.getElementById('phoneInput')?.value.trim();
      const pin = document.getElementById('pinInput')?.value.trim();
      if (!phone || !pin) {
        appState.error = '휴대폰번호와 비밀번호를 입력하세요';
        renderLogin(appState.error);
        return;
      }
      try {
        await signInWithEmailAndPassword(appState.auth, phoneLoginEmail(phone), pin);
      } catch (err) {
        appState.error = friendlyError(err);
        renderLogin(appState.error);
      }
    }

    async function setupPhonePin() {
      const phone = document.getElementById('setupPhoneInput')?.value.trim();
      const tempCode = document.getElementById('tempCodeInput')?.value.trim();
      const pin = document.getElementById('newPinInput')?.value.trim();
      const confirm = document.getElementById('newPinConfirmInput')?.value.trim();
      if (!phone || !tempCode || !pin || pin !== confirm) {
        appState.error = '휴대폰번호, 임시코드, 새 비밀번호 확인을 입력하세요';
        renderLogin(appState.error);
        return;
      }
      try {
        const userCredential = await signInWithEmailAndPassword(appState.auth, phoneLoginEmail(phone), tempCode);
        await updatePassword(userCredential.user, pin);
        showToast('비밀번호가 변경됐습니다');
      } catch (err) {
        appState.error = friendlyError(err);
        renderLogin(appState.error);
      }
    }

    function phoneLoginEmail(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      if (!digits) throw new Error('휴대폰번호를 입력하세요');
      return `p${digits}@archivepilates.com`;
    }

    async function loadHome() {
      appState.loading = true;
      appState.error = '';
      renderApp();
      try {
        const tokenResult = await appState.user.getIdTokenResult(true);
        const role = tokenResult.claims.role || '';
        const manager = role === 'owner' || role === 'manager';
        appState.mode = manager ? 'manager' : 'instructor';
        const result = manager ? await loadAdminHomeFromFirestore(tokenResult) : await loadHomeFromFirestore(tokenResult);
        appState.staff = result.staff || { name: result.staffId || '' };
        subscribeConversations();
        if (manager) {
          appState.days = [];
          appState.admin = result.admin || appState.admin;
          if (!appState.chat.selectedStaffId) appState.chat.selectedStaffId = appState.admin.staffs?.[0]?.staffId || '';
          subscribeAdminViews();
          if (appState.admin.activeTab === 'chat') subscribeChat(selectedChatStaffId());
        } else {
          appState.days = result.days || [];
          subscribeInstructorViews(result.staffId);
        }
        appState.loading = false;
      } catch (err) {
        appState.loading = false;
        appState.error = friendlyError(err);
      }
      renderApp();
    }

    async function loadHomeFromFirestore(token) {
      const staffId = token.claims.staffId || '';
      if (!staffId) throw new Error('강사 권한이 아직 연결되지 않았습니다');

      const staffSnap = await getDoc(doc(appState.db, 'staffs', String(staffId)));
      if (!staffSnap.exists()) throw new Error('강사 정보를 찾을 수 없습니다');
      const staff = staffSnap.data();

      const dates = Array.from({ length: 14 }, (_, index) => addDays(today(), index));
      const viewSnaps = await Promise.all(
        dates.map((date) => getDoc(doc(appState.db, 'instructorViews', `${staffId}_${date}`)))
      );
      const days = viewSnaps.filter((snap) => snap.exists()).map((snap) => snap.data());
      return {
        staffId,
        staff: { staffId, name: staff.name, role: staff.role, studioId: staff.studioId },
        days
      };
    }

    async function loadAdminHomeFromFirestore(token) {
      const staffId = token.claims.staffId || '';
      const studioId = token.claims.studioId || '';
      if (!staffId || !studioId) throw new Error('운영자 권한이 아직 연결되지 않았습니다');

      const rangeDates = Array.from({ length: 28 }, (_, index) => addDays(appState.selectedDate, index - 27));
      const [staffSnap, staffListSnap, viewSnaps, memoSnap, syncSnap] = await Promise.all([
        getDoc(doc(appState.db, 'staffs', String(staffId))),
        getDocs(query(
          collection(appState.db, 'staffs'),
          where('studioId', '==', String(studioId)),
          where('active', '==', true)
        )),
        Promise.all(rangeDates.map((date) => getDocs(query(
          collection(appState.db, 'instructorViews'),
          where('studioId', '==', String(studioId)),
          where('date', '==', date)
        )))),
        getDocs(query(
          collection(appState.db, 'memberMemos'),
          where('studioId', '==', String(studioId)),
          queryLimit(300)
        )),
        getDoc(doc(appState.db, 'syncStates', `lecturesRange_${studioId}`))
      ]);
      if (!staffSnap.exists()) throw new Error('운영자 정보를 찾을 수 없습니다');
      const staff = staffSnap.data();
      const staffs = staffListSnap.docs
        .map((docSnap) => docSnap.data())
        .filter((item) => item.role !== 'viewer' && !String(item.staffId || '').startsWith('operator_'))
        .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
      const rangeViews = viewSnaps.flatMap((snap) => snap.docs.map((docSnap) => docSnap.data()))
        .filter((view) => (view.summary?.totalLectures || 0) > 0)
        .sort((a, b) => staffName(a.staffId, staffs).localeCompare(staffName(b.staffId, staffs), 'ko'));
      const views = rangeViews.filter((view) => view.date === appState.selectedDate);
      return {
        staffId,
        staff: { staffId, name: staff.name, role: staff.role, studioId: staff.studioId },
        admin: {
          staffs,
          views,
          rangeViews,
          memos: memoSnap.docs.map((docSnap) => docSnap.data()),
          syncState: syncSnap.exists() ? syncSnap.data() : null,
          selectedStaffId: appState.admin.selectedStaffId || 'all',
          activeTab: appState.admin.activeTab || 'overview',
          searchQuery: appState.admin.searchQuery || ''
        }
      };
    }

    function subscribeInstructorViews(staffId) {
      unsubscribeViews();
      const dates = Array.from({ length: 14 }, (_, index) => addDays(today(), index));
      appState.viewUnsubscribers = dates.map((date) => onSnapshot(
        doc(appState.db, 'instructorViews', `${staffId}_${date}`),
        (snap) => {
          if (!snap.exists()) return;
          upsertDay(snap.data());
          if (!appState.loading) renderApp();
        },
        () => {}
      ));
    }

    function subscribeAdminViews() {
      unsubscribeViews();
      const studioId = appState.staff?.studioId;
      if (!studioId) return;
      appState.viewUnsubscribers = [onSnapshot(
        query(
          collection(appState.db, 'instructorViews'),
          where('studioId', '==', String(studioId)),
          where('date', '==', appState.selectedDate)
        ),
        (snap) => {
          appState.admin.views = snap.docs
            .map((docSnap) => docSnap.data())
            .filter((view) => (view.summary?.totalLectures || 0) > 0)
            .sort((a, b) => staffName(a.staffId).localeCompare(staffName(b.staffId), 'ko'));
          const otherRangeViews = (appState.admin.rangeViews || []).filter((view) => view.date !== appState.selectedDate);
          appState.admin.rangeViews = [...otherRangeViews, ...appState.admin.views]
            .sort((a, b) => String(a.date).localeCompare(String(b.date)) || staffName(a.staffId).localeCompare(staffName(b.staffId), 'ko'));
          if (!appState.loading) renderApp();
        },
        () => {}
      )];
    }

    function unsubscribeViews() {
      appState.viewUnsubscribers.forEach((unsubscribe) => unsubscribe());
      appState.viewUnsubscribers = [];
    }

    function subscribeConversations() {
      if (!appState.staff?.studioId || appState.chat.conversationsUnsubscribe) return;
      const filters = [
        where('studioId', '==', appState.staff.studioId)
      ];
      if (appState.mode !== 'manager') filters.push(where('threadStaffId', '==', appState.staff.staffId));
      appState.chat.conversationsUnsubscribe = onSnapshot(
        query(collection(appState.db, 'conversations'), ...filters),
        (snap) => {
          const nextConversations = snap.docs.map((docSnap) => docSnap.data());
          const nextKey = conversationSnapshotKey(nextConversations);
          if (nextKey === appState.chat.lastConversationsKey) return;
          appState.chat.conversations = nextConversations;
          appState.chat.lastConversationsKey = nextKey;
          const activeThread = selectedChatStaffId();
          if ((appState.chat.open || appState.admin.activeTab === 'chat') && shouldMarkConversationRead(activeThread)) {
            markConversationRead(activeThread).catch(() => {});
          }
          if (!appState.loading) renderApp();
        },
        () => {}
      );
    }

    function unsubscribeConversations() {
      if (typeof appState.chat.conversationsUnsubscribe === 'function') appState.chat.conversationsUnsubscribe();
      appState.chat.conversationsUnsubscribe = null;
      appState.chat.conversations = [];
      appState.chat.lastConversationsKey = '';
    }

    function selectedChatStaffId() {
      return appState.mode === 'manager'
        ? appState.chat.selectedStaffId || appState.admin.staffs?.[0]?.staffId || ''
        : appState.staff?.staffId || '';
    }

    function conversationId(threadStaffId) {
      return `staff_${threadStaffId}`;
    }

    function subscribeChat(threadStaffId) {
      if (!threadStaffId) return;
      const convId = conversationId(threadStaffId);
      if (shouldMarkConversationRead(threadStaffId)) markConversationRead(threadStaffId).catch(() => {});
      if (appState.chat.unsubscribe && appState.chat.currentConvId === convId) return;
      unsubscribeChat();
      appState.chat.currentConvId = convId;
      appState.chat.messages = [];
      appState.chat.unsubscribe = onSnapshot(
        query(
          collection(appState.db, 'conversations', convId, 'messages'),
          orderBy('createdAt', 'asc'),
          queryLimit(80)
        ),
        (snap) => {
          const nextMessages = snap.docs.map((docSnap) => docSnap.data());
          const nextKey = messageSnapshotKey(nextMessages);
          if (nextKey === appState.chat.lastMessagesKey) return;
          appState.chat.messages = nextMessages;
          appState.chat.lastMessagesKey = nextKey;
          if (!appState.loading && (appState.chat.open || appState.admin.activeTab === 'chat')) {
            if (shouldMarkConversationRead(threadStaffId)) markConversationRead(threadStaffId).catch(() => {});
            renderApp();
            scrollChatToBottom();
          }
        },
        () => {}
      );
    }

    async function markConversationRead(threadStaffId) {
      const conv = conversationForStaff(threadStaffId);
      if (!conv || !shouldMarkConversationRead(threadStaffId)) return;
      const field = appState.mode === 'manager' ? 'managerReadAt' : 'staffReadAt';
      const lastMessage = timestampMillis(conv.lastMessageAt || conv.updatedAt);
      const markKey = `${field}_${threadStaffId}_${lastMessage}`;
      if (appState.chat.readMarks[markKey]) return;
      appState.chat.readMarks[markKey] = true;
      try {
        await updateDoc(doc(appState.db, 'conversations', conversationId(threadStaffId)), {
          [field]: serverTimestamp()
        });
      } catch (error) {
        delete appState.chat.readMarks[markKey];
        throw error;
      }
    }

    function unsubscribeChat() {
      if (typeof appState.chat.unsubscribe === 'function') appState.chat.unsubscribe();
      appState.chat.unsubscribe = null;
      appState.chat.currentConvId = '';
      appState.chat.messages = [];
      appState.chat.lastMessagesKey = '';
    }

    async function sendChatMessage(threadStaffId, content) {
      const text = String(content || '').trim();
      if (!threadStaffId || !text) return;
      const convId = conversationId(threadStaffId);
      const staffNameForThread = staffName(threadStaffId);
      const now = serverTimestamp();
      const convRef = doc(appState.db, 'conversations', convId);
      const messageRef = doc(collection(convRef, 'messages'));
      const input = document.getElementById('chatInput');
      if (input) input.value = '';
      appState.chat.messages = [
        ...appState.chat.messages,
        {
          messageId: messageRef.id,
          senderStaffId: appState.staff?.staffId || '',
          senderName: appState.staff?.name || '',
          content: text,
          createdAt: new Date().toISOString()
        }
      ];
      renderApp();
      scrollChatToBottom();
      try {
        await setDoc(convRef, {
          conversationId: convId,
          studioId: appState.staff?.studioId || '',
          threadStaffId,
          threadStaffName: staffNameForThread,
          updatedAt: now,
          lastMessageAt: now,
          lastMessage: text.slice(0, 120),
          lastSenderStaffId: appState.staff?.staffId || '',
          lastSenderName: appState.staff?.name || ''
        }, { merge: true });
        await setDoc(messageRef, {
          messageId: messageRef.id,
          conversationId: convId,
          studioId: appState.staff?.studioId || '',
          threadStaffId,
          threadStaffName: staffNameForThread,
          senderStaffId: appState.staff?.staffId || '',
          senderName: appState.staff?.name || '',
          senderRole: appState.staff?.role || '',
          content: text,
          createdAt: now
        });
      } catch (err) {
        showToast(`채팅 전송 실패: ${friendlyError(err)}`);
        subscribeChat(threadStaffId);
      }
    }

    function scrollChatToBottom() {
      requestAnimationFrame(() => {
        const box = document.getElementById('chatMessages');
        if (box) box.scrollTop = box.scrollHeight;
      });
    }

    function upsertDay(day) {
      const index = appState.days.findIndex((item) => item.date === day.date);
      if (index >= 0) appState.days.splice(index, 1, day);
      else appState.days.push(day);
      appState.days.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }

    async function updateAttendance(bookingId, attendanceStatus) {
      if (!bookingId || !attendanceStatus) return;
      const booking = findBooking(bookingId);
      const context = findBookingContext(bookingId);
      if (!booking || !context || !canUpdateAttendance(context.lecture, booking)) return;
      optimisticAttendance(bookingId, attendanceStatus);
      renderApp();
      try {
        await updateDoc(doc(appState.db, 'bookings', bookingId), {
          attendanceStatus,
          syncStatus: 'pending',
          lastChangedBy: appState.user.uid,
          updatedAt: serverTimestamp()
        });
        await enqueueWriteJob('bookingAttendanceUpdate', {
          bookingId,
          attendanceStatus
        });
        showToast(`${statusLabel({ ...booking, attendanceStatus })} 처리 요청됨`);
      } catch (err) {
        appState.error = friendlyError(err);
        showToast('출결 변경 실패');
        await loadHome();
      }
    }

    function optimisticAttendance(bookingId, attendanceStatus) {
      appState.days.forEach((day) => {
        (day.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (booking.bookingId === bookingId) {
              booking.attendanceStatus = attendanceStatus;
              booking.syncStatus = 'pending';
            }
          });
        });
      });
      (appState.admin.views || []).forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (booking.bookingId === bookingId) {
              booking.attendanceStatus = attendanceStatus;
              booking.syncStatus = 'pending';
            }
          });
        });
      });
    }

    function openMemo(input) {
      appState.activeBooking = input;
      memoTitle.textContent = `${input.memberName || '회원'} 메모`;
      memoInput.value = '';
      memoHistory.innerHTML = '';
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    async function saveMemo() {
      const active = appState.activeBooking;
      const content = memoInput.value.trim();
      if (!active || !content) return;
      saveMemoButton.disabled = true;
      try {
        const booking = findBooking(active.bookingId);
        const memoRef = doc(collection(appState.db, 'memberMemos'));
        await setDoc(memoRef, {
          memoId: memoRef.id,
          studioId: booking?.studioId || appState.staff?.studioId || '',
          memberId: active.memberId,
          memberName: booking?.memberName || active.memberName || '',
          lectureId: active.lectureId,
          bookingId: active.bookingId,
          lectureDate: booking?.lectureDate || appState.selectedDate,
          staffId: appState.staff?.staffId || '',
          staffName: appState.staff?.name || '',
          memoType: 'member_note',
          visibility: 'staff_and_manager',
          syncStatus: 'pending',
          createdByUid: appState.user.uid,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          content
        });
        await updateDoc(doc(appState.db, 'bookings', active.bookingId), {
          lastMemoPreview: content.slice(0, 60),
          lastMemoAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        await enqueueWriteJob('memberMemoCreate', {
          memberId: active.memberId,
          content
        });
        modal.classList.remove('open');
        showToast('메모 저장 요청됨');
        await loadHome();
      } catch (err) {
        memoHistory.innerHTML = `<div class="error">${escapeHtml(friendlyError(err))}</div>`;
        showToast('메모 저장 실패');
      } finally {
        saveMemoButton.disabled = false;
      }
    }

    function appendQuickMemo(text) {
      const current = memoInput.value.trim();
      memoInput.value = current ? `${current}, ${text}` : text;
      memoInput.focus();
    }

    async function enqueueWriteJob(type, payload) {
      const jobRef = doc(collection(appState.db, 'writeQueue'));
      const now = serverTimestamp();
      await setDoc(jobRef, {
        jobId: jobRef.id,
        studioId: appState.staff?.studioId || '',
        type,
        status: 'pending',
        attempts: 0,
        maxAttempts: 5,
        nextRunAt: now,
        createdByUid: appState.user.uid,
        payload,
        lastError: null,
        createdAt: now,
        updatedAt: now
      });
    }

    function findBooking(bookingId) {
      return findBookingContext(bookingId)?.booking || null;
    }

    function findBookingContext(bookingId) {
      for (const day of appState.days) {
        for (const lecture of day.lectures || []) {
          const booking = (lecture.bookings || []).find((item) => item.bookingId === bookingId);
          if (booking) return { day, lecture, booking };
        }
      }
      for (const view of appState.admin.views || []) {
        for (const lecture of view.lectures || []) {
          const booking = (lecture.bookings || []).find((item) => item.bookingId === bookingId);
          if (booking) return { day: view, lecture, booking };
        }
      }
      return null;
    }

    async function loadMemoHistory() {
      const active = appState.activeBooking;
      if (!active?.memberId) return;
      memoHistory.innerHTML = '<div class="memo">불러오는 중</div>';
      try {
        const snap = await getDocs(query(
          collection(appState.db, 'memberMemos'),
          where('studioId', '==', appState.staff?.studioId || ''),
          where('memberId', '==', active.memberId),
          where('visibility', '==', 'staff_and_manager'),
          orderBy('createdAt', 'desc'),
          queryLimit(20)
        ));
        const memos = snap.docs.map((docSnap) => docSnap.data());
        memoHistory.innerHTML = memos.map((memo) => {
          const title = [memo.staffName, memo.lectureDate || dateTimeLabel(memo.createdAt)].filter(Boolean).join(' ');
          return `<div class="memo"><strong>${escapeHtml(title)}</strong>${escapeHtml(memo.content || '')}</div>`;
        }).join('') || '<div class="memo">메모가 없습니다</div>';
      } catch (err) {
        memoHistory.innerHTML = `<div class="error">${escapeHtml(friendlyError(err))}</div>`;
      }
    }

    async function registerPushToken() {
      if (!config.vapidKey || !(await isSupported())) return;
      const registration = await navigator.serviceWorker.ready;
      const messaging = getMessaging(appState.app);
      const token = await getToken(messaging, {
        vapidKey: config.vapidKey,
        serviceWorkerRegistration: registration
      });
      if (!token) return;
      const fn = httpsCallable(appState.functions, functionNames.registerFcm);
      await fn({
        token,
        platform: 'web',
        deviceLabel: navigator.userAgent.slice(0, 80)
      });
    }

    function shiftDate(amount) {
      appState.selectedDate = addDays(appState.selectedDate, amount);
      appState.openLectures.clear();
      if (appState.mode === 'manager') {
        loadHome();
        return;
      }
      renderApp();
    }

    function goToday() {
      appState.selectedDate = today();
      appState.openLectures.clear();
      if (appState.mode === 'manager') {
        loadHome();
        return;
      }
      renderApp();
    }

    function toggleLecture(lectureId) {
      if (!lectureId) return;
      if (appState.openLectures.has(lectureId)) appState.openLectures.delete(lectureId);
      else appState.openLectures.add(lectureId);
      renderApp();
    }

    function currentDay() {
      return appState.days.find((day) => day.date === appState.selectedDate) || null;
    }

    function currentAdminViews() {
      const selected = appState.admin.selectedStaffId || 'all';
      const views = appState.admin.views || [];
      return selected === 'all' ? views : views.filter((view) => view.staffId === selected);
    }

    function conversationForStaff(staffId) {
      return (appState.chat.conversations || []).find((conv) => conv.threadStaffId === staffId) || null;
    }

    function conversationSnapshotKey(conversations) {
      return (conversations || [])
        .map((conv) => [
          conv.conversationId || '',
          conv.threadStaffId || '',
          timestampMillis(conv.lastMessageAt || conv.updatedAt),
          timestampMillis(conv.managerReadAt),
          timestampMillis(conv.staffReadAt),
          conv.lastSenderStaffId || ''
        ].join(':'))
        .sort()
        .join('|');
    }

    function messageSnapshotKey(messages) {
      return (messages || [])
        .map((message) => [
          message.messageId || '',
          timestampMillis(message.createdAt),
          message.senderStaffId || '',
          message.content || ''
        ].join(':'))
        .join('|');
    }

    function shouldMarkConversationRead(threadStaffId) {
      const conv = conversationForStaff(threadStaffId);
      if (!conv || conv.lastSenderStaffId === appState.staff?.staffId) return false;
      const lastMessage = timestampMillis(conv.lastMessageAt || conv.updatedAt);
      const readAt = timestampMillis(appState.mode === 'manager' ? conv.managerReadAt : conv.staffReadAt);
      return Boolean(lastMessage && lastMessage > readAt);
    }

    function unreadForStaff(staffId) {
      const conv = conversationForStaff(staffId);
      if (!conv || conv.lastSenderStaffId === appState.staff?.staffId) return 0;
      const lastMessage = timestampMillis(conv.lastMessageAt || conv.updatedAt);
      const readAt = timestampMillis(appState.mode === 'manager' ? conv.managerReadAt : conv.staffReadAt);
      return lastMessage && lastMessage > readAt ? 1 : 0;
    }

    function totalUnreadChats() {
      if (appState.mode === 'manager') {
        return (appState.admin.staffs || []).reduce((count, staff) => count + unreadForStaff(staff.staffId), 0);
      }
      return unreadForStaff(appState.staff?.staffId || '');
    }

    function adminSummary(views) {
      return views.reduce((summary, view) => {
        const lectures = view.lectures || [];
        const counts = classTypeCounts(lectures);
        const capacity = lectures.reduce((total, lecture) => total + Math.max(0, Number(lecture.capacity || 0)), 0);
        const bookings = lectures.flatMap((lecture) => lecture.bookings || []);
        const reserved = bookings.filter((booking) => booking.appStatus === 'reserved');
        const attended = reserved.filter((booking) => booking.attendanceStatus === 'attended');
        summary.activeStaffs += lectures.length ? 1 : 0;
        summary.totalLectures += view.summary?.totalLectures || lectures.length;
        summary.groupLectures += counts.group;
        summary.privateLectures += counts.private;
        summary.reserved += view.summary?.reservedCount || 0;
        summary.wait += view.summary?.waitCount || 0;
        summary.unchecked += view.summary?.uncheckedAttendanceCount || 0;
        summary.capacity += capacity;
        summary.attended += attended.length;
        return summary;
      }, {
        activeStaffs: 0,
        totalLectures: 0,
        groupLectures: 0,
        privateLectures: 0,
        reserved: 0,
        wait: 0,
        unchecked: 0,
        capacity: 0,
        attended: 0
      });
    }

    function adminViewsByRange(daysBack) {
      const start = addDays(appState.selectedDate, -daysBack);
      const end = appState.selectedDate;
      const selected = appState.admin.selectedStaffId || 'all';
      return (appState.admin.rangeViews || []).filter((view) =>
        view.date >= start &&
        view.date <= end &&
        (selected === 'all' || view.staffId === selected)
      );
    }

    function renderMetricRow(label, value, max) {
      const width = max ? Math.max(6, Math.round((value / max) * 100)) : 0;
      return `
        <div class="admin-meter-row">
          <span>${escapeHtml(label)}</span>
          <div class="admin-meter-track"><div class="admin-meter-fill" style="width:${width}%"></div></div>
          <strong>${value}</strong>
        </div>
      `;
    }

    function renderRateRow(label, summary) {
      const reservationRate = safeRate(summary.reserved, summary.capacity);
      const attendanceRate = safeRate(summary.attended, summary.reserved);
      return `
        <tr>
          <td>${escapeHtml(label)}</td>
          <td>${percentText(reservationRate)}</td>
          <td>${percentText(attendanceRate)}</td>
          <td>${summary.unchecked}</td>
        </tr>
      `;
    }

    function instructorStats(views) {
      const map = new Map();
      views.forEach((view) => {
        const row = map.get(view.staffId) || {
          staffId: view.staffId,
          name: staffName(view.staffId),
          classes: 0,
          capacity: 0,
          reserved: 0,
          attended: 0
        };
        (view.lectures || []).forEach((lecture) => {
          row.classes += 1;
          row.capacity += Math.max(0, Number(lecture.capacity || 0));
          const reserved = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved');
          row.reserved += reserved.length;
          row.attended += reserved.filter((booking) => booking.attendanceStatus === 'attended').length;
        });
        map.set(view.staffId, row);
      });
      return [...map.values()]
        .map((row) => ({
          ...row,
          reservationRate: safeRate(row.reserved, row.capacity),
          attendanceRate: safeRate(row.attended, row.reserved)
        }))
        .sort((a, b) => a.reservationRate - b.reservationRate || b.classes - a.classes);
    }

    function lowClassIssues(views) {
      return views.flatMap((view) => (view.lectures || []).map((lecture) => {
        const reserved = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved').length;
        const capacity = Math.max(0, Number(lecture.capacity || 0));
        return {
          view,
          lecture,
          staffName: staffName(view.staffId),
          reserved,
          capacity,
          reservationRate: safeRate(reserved, capacity)
        };
      }))
        .filter((item) => item.capacity >= 3 && (item.reserved <= 1 || item.reservationRate < 0.4))
        .sort((a, b) => a.reservationRate - b.reservationRate || String(a.view.date).localeCompare(String(b.view.date)));
    }

    function renderLowClassItem(item) {
      return `
        <div class="admin-list-item">
          <strong>${escapeHtml(item.view.date)} ${escapeHtml(lectureTimeText(item.lecture))} ${escapeHtml(item.lecture.title || '수업')}</strong>
          <p>${escapeHtml(item.staffName)} · 예약 ${item.reserved}/${item.capacity} · 예약률 ${percentText(item.reservationRate)}</p>
        </div>
      `;
    }

    function adminIssues(views) {
      const lectureIssues = [];
      const memberMap = new Map();
      views.forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          const bookings = lecture.bookings || [];
          const reserved = bookings.filter((booking) => booking.appStatus === 'reserved');
          if (!reserved.length) {
            lectureIssues.push({
              type: '예약0',
              view,
              lecture,
              body: `${staffName(view.staffId)} · ${lectureTimeText(lecture)} · ${lecture.title || '수업'}`
            });
          }
          const unchecked = reserved.filter((booking) => booking.attendanceStatus === 'unchecked');
          if (isLectureDone(lecture) && unchecked.length) {
            lectureIssues.push({
              type: '출석미체크',
              view,
              lecture,
              body: `${staffName(view.staffId)} · ${lectureTimeText(lecture)} · ${unchecked.length}명`
            });
          }
          reserved.forEach((booking) => {
            const tags = (booking.tags || []).filter((tag) =>
              ['warning', 'danger'].includes(tag.level) ||
              tag.source === 'auto_memo' ||
              tag.source === 'manual'
            );
            if (!tags.length) return;
            const key = booking.memberId || booking.memberName;
            const current = memberMap.get(key) || { booking, view, lecture, tags: [] };
            current.tags.push(...tags);
            memberMap.set(key, current);
          });
        });
      });
      return {
        lectures: lectureIssues.slice(0, 30),
        members: [...memberMap.values()].slice(0, 30)
      };
    }

    function renderIssueItem(item) {
      return `
        <div class="admin-list-item">
          <strong>${escapeHtml(item.type)}</strong>
          <p>${escapeHtml(item.body)}</p>
        </div>
      `;
    }

    function renderMemberIssueItem(item) {
      const labels = uniqueValues(item.tags.map((tag) => tag.label || tag.tagId)).slice(0, 6);
      return `
        <div class="admin-list-item">
          <strong>${escapeHtml(item.booking.memberName || '회원')}</strong>
          <p>${escapeHtml(staffName(item.view.staffId))} · ${escapeHtml(lectureTimeText(item.lecture))} · ${labels.map((label) => `#${label}`).join(' ')}</p>
        </div>
      `;
    }

    function searchAdminMembers(queryText) {
      const needle = normalizeSearch(queryText);
      const map = new Map();
      (appState.admin.rangeViews || []).forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (!booking.memberId && !booking.memberName) return;
            const key = booking.memberId || booking.memberName;
            const row = map.get(key) || {
              memberId: booking.memberId,
              memberName: booking.memberName,
              tags: [],
              bookings: [],
              memos: []
            };
            row.bookings.push({ view, lecture, booking });
            row.tags.push(...(booking.tags || []));
            map.set(key, row);
          });
        });
      });
      (appState.admin.memos || []).forEach((memo) => {
        const key = memo.memberId || memo.memberName;
        if (!key) return;
        const row = map.get(key) || {
          memberId: memo.memberId,
          memberName: memo.memberName,
          tags: [],
          bookings: [],
          memos: []
        };
        row.memberName = row.memberName || memo.memberName;
        row.memos.push(memo);
        map.set(key, row);
      });
      return [...map.values()]
        .filter((row) => normalizeSearch([
          row.memberName,
          row.tags.map((tag) => tag.label || tag.tagId).join(' '),
          row.bookings.map((item) => item.booking.lastMemoPreview || '').join(' '),
          row.memos.map((memo) => memo.content || '').join(' ')
        ].join(' ')).includes(needle))
        .sort((a, b) => String(a.memberName || '').localeCompare(String(b.memberName || ''), 'ko'));
    }

    function renderMemberSearchItem(row) {
      const recent = row.bookings.slice(-5).reverse();
      const attended = row.bookings.filter((item) => item.booking.attendanceStatus === 'attended').length;
      const absent = row.bookings.filter((item) => ['absent', 'late_cancel'].includes(item.booking.attendanceStatus)).length;
      const tags = uniqueValues(row.tags.map((tag) => tag.label || tag.tagId)).slice(0, 8);
      const memo = row.memos[0]?.content || recent.find((item) => item.booking.lastMemoPreview)?.booking.lastMemoPreview || '';
      return `
        <div class="admin-list-item">
          <strong>${escapeHtml(row.memberName || '회원')}</strong>
          <p>최근 4주 출석 ${attended} · 결석 ${absent} · 예약기록 ${row.bookings.length}</p>
          <div class="chips">${tags.map((tag) => `<span class="chip">${escapeHtml(tag)}</span>`).join('')}</div>
          ${memo ? `<p style="margin-top:8px;">${escapeHtml(memo).slice(0, 120)}</p>` : ''}
          ${recent.length ? `<p style="margin-top:8px;">${recent.map((item) => `${item.view.date} ${lectureTimeText(item.lecture)} ${staffName(item.view.staffId)}`).join(' / ')}</p>` : ''}
        </div>
      `;
    }

    function safeRate(value, total) {
      return total > 0 ? value / total : 0;
    }

    function percentText(value) {
      return `${Math.round((Number(value) || 0) * 100)}%`;
    }

    function uniqueValues(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function normalizeSearch(value) {
      return String(value || '').replace(/\s/g, '').toLowerCase();
    }

    function staffName(staffId, staffs = appState.admin.staffs || []) {
      const staff = staffs.find((item) => item.staffId === staffId);
      return staff?.name || staffId || '강사';
    }

    function adminSyncText() {
      const state = appState.admin.syncState;
      const last = dateTimeLabel(state?.lastSuccessAt);
      return last ? `전체 운영 현황 · ${last} 갱신` : '전체 운영 현황';
    }

    function formatSyncText(day) {
      if (!day) return '수업 없음';
      return `예약 ${day.summary?.reservedCount || 0} · 미체크 ${day.summary?.uncheckedAttendanceCount || 0}`;
    }

    function today() {
      const now = new Date();
      return new Date(now.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function addDays(date, amount) {
      const base = new Date(`${date}T00:00:00+09:00`);
      base.setDate(base.getDate() + amount);
      return new Date(base.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function dateLabel(date) {
      const base = new Date(`${date}T00:00:00+09:00`);
      return `${base.getMonth() + 1}/${base.getDate()} (${['일', '월', '화', '수', '목', '금', '토'][base.getDay()]})`;
    }

    function lessonLabel(type) {
      if (type === 'private') return '프라이빗';
      if (type === 'semi_private') return '세미';
      if (type === 'unknown') return '구분확인';
      return '그룹';
    }

    function renderOptionalChip(value) {
      const text = String(value || '').trim();
      return text ? `<span class="chip">${escapeHtml(text)}</span>` : '';
    }

    function privateTicketLabel(value) {
      return String(value || '')
        .trim()
        .replace(/^프라이빗\s*/i, '')
        .trim();
    }

    function renderTagChip(tag) {
      const className = [
        tag.level === 'warning' ? 'wait' : tag.level === 'danger' ? 'bad' : tag.level === 'positive' ? 'good' : '',
        tag.source === 'auto_attendance' ? 'attendance' : '',
        tag.source === 'auto_memo' ? 'memo' : '',
        tag.source === 'auto_profile' ? 'profile' : '',
        tag.source === 'manual' ? 'manual' : ''
      ].filter(Boolean).join(' ');
      const dateLabel = tag.source === 'auto_profile' ? '등록일' : '메모일자';
      const title = [tag.sourceDate ? `${dateLabel} ${tag.sourceDate}` : '', tag.sourceMemoId ? `메모 ${tag.sourceMemoId}` : ''].filter(Boolean).join(' · ');
      return `<span class="chip ${className}" title="${escapeAttr(title)}">${escapeHtml(tag.label || tag.tagId)}</span>`;
    }

    function renderTagField(label, tags) {
      if (!tags.length) return '';
      return `
        <div class="tag-field ${label ? '' : 'no-label'}">
          ${label ? `<span class="tag-label">${escapeHtml(label)}</span>` : ''}
          <div class="tag-list">${tags.map(renderTagChip).join('')}</div>
        </div>
      `;
    }

    function memberTagGroups(tags) {
      const visible = tags.filter((tag) => {
        const label = tag.label || '';
        if (/^30일 결석 0회$/.test(label)) return false;
        return ['auto_attendance', 'auto_memo', 'auto_profile', 'manual'].includes(tag.source) || /^30일 출석/.test(label) || /^30일 결석/.test(label);
      });
      return {
        fixed: visible.filter((tag) => tag.source !== 'manual'),
        manual: visible.filter((tag) => tag.source === 'manual')
      };
    }

    function isLectureDone(lecture) {
      const end = timestampToDate(lecture?.endAt) || timestampToDate(lecture?.startAt);
      return Boolean(end && end.getTime() <= Date.now());
    }

    function canUpdateAttendance(lecture, booking) {
      if (booking?.appStatus !== 'reserved') return false;
      const start = timestampToDate(lecture?.startAt);
      return Boolean(start && start.getTime() <= Date.now());
    }

    function resolvedLessonType(lecture) {
      if (['group', 'private', 'semi_private'].includes(lecture.lessonType)) return lecture.lessonType;
      return 'unknown';
    }

    function classTypeCounts(lectures) {
      return lectures.reduce((counts, lecture) => {
        const type = resolvedLessonType(lecture);
        if (type === 'private' || type === 'semi_private') counts.private += 1;
        else if (type === 'group') counts.group += 1;
        return counts;
      }, { group: 0, private: 0 });
    }

    function lectureTimeText(lecture) {
      const start = timestampToDate(lecture.startAt);
      const end = timestampToDate(lecture.endAt);
      if (!start) return (lecture.timeText || '').split(' ')[0] || '';
      const hhmm = (date) => new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
      return end ? `${hhmm(start)}-${hhmm(end)}` : hhmm(start);
    }

    function timestampToDate(value) {
      if (!value) return null;
      if (typeof value.toDate === 'function') return value.toDate();
      if (typeof value === 'string') {
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }
      const seconds = value.seconds ?? value._seconds;
      if (seconds != null) return new Date(Number(seconds) * 1000);
      return null;
    }

    function timestampMillis(value) {
      return timestampToDate(value)?.getTime() || 0;
    }

    function dateTimeLabel(value) {
      const date = timestampToDate(value);
      if (!date) return '';
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
    }

    function statusLabel(booking) {
      if (booking.appStatus === 'wait') return '대기';
      if (booking.appStatus === 'cancel' || booking.appStatus === 'wait_cancel') return '취소';
      if (booking.attendanceStatus === 'attended') return '출석';
      if (booking.attendanceStatus === 'absent') return '결석';
      if (booking.attendanceStatus === 'late_cancel') return '결석';
      return '예약';
    }

    function statusShort(booking) {
      return statusLabel(booking).slice(0, 1);
    }

    function statusClass(booking) {
      if (booking.syncStatus === 'pending') return 'pending';
      if (booking.appStatus === 'wait') return 'wait';
      if (booking.attendanceStatus === 'attended') return 'good';
      if (booking.attendanceStatus === 'absent' || booking.attendanceStatus === 'late_cancel') return 'bad';
      return '';
    }

    function showToast(message) {
      if (!toast || !message) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(appState.toastTimer);
      appState.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function friendlyError(err) {
      if (err?.code === 'auth/invalid-credential') return '이메일 또는 비밀번호가 맞지 않습니다';
      if (err?.code === 'auth/too-many-requests') return '로그인 시도가 많습니다. 잠시 후 다시 시도하세요';
      return err?.message?.replace(/^Firebase: /, '') || '처리 중 오류가 발생했습니다';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('\n', ' ');
    }

    document.querySelectorAll('[data-close-modal]').forEach((button) => {
      button.addEventListener('click', () => {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      });
    });
    saveMemoButton.addEventListener('click', saveMemo);
    loadMemoButton.addEventListener('click', loadMemoHistory);
    document.querySelectorAll('[data-quick-memo]').forEach((button) => {
      button.addEventListener('click', () => appendQuickMemo(button.dataset.quickMemo || ''));
    });
  </script>
</body>
</html>
