<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>페이지를 찾을 수 없습니다 | ARCHIVE PILATES</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: calc(32px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
      background: #faf8f5;
      color: #181512;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }
    main {
      width: min(100%, 560px);
      border: 1px solid #ded7cf;
      background: #fffdfa;
      padding: 32px 24px;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #9a3324;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; line-height: 1.2; letter-spacing: 0; }
    p { margin: 0 0 22px; color: #5f5851; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      background: #181512;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ARCHIVE PILATES</p>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나 현재 사용할 수 없는 페이지입니다. 공식 홈페이지로 이동해 주세요.</p>
    <a href="/">홈으로 돌아가기</a>
  </main>
</body>
</html>
