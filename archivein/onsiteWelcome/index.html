<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#e9251d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ARCHIVE 웰컴">
  <meta name="application-name" content="ARCHIVE 웰컴">
  <link rel="icon" type="image/png" sizes="32x32" href="/onsiteWelcome/icons/favicon-32.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/onsiteWelcome/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/onsiteWelcome/site.webmanifest">
  <title>ARCHIVE PILATES 현장 웰컴</title>
  <style>
    :root { color-scheme:light; --ink:#181512; --muted:#716960; --line:#e5ddd4; --bg:#f7f2ec; --paper:#fffdfa; --accent:#b73d32; --good:#2f6f68; --bad:#96352c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(560px,100%); margin:0 auto; padding:18px 14px 36px; }
    header { display:grid; grid-template-columns:1fr 48px; gap:14px; align-items:start; padding:12px 2px 18px; border-bottom:1px solid rgba(24,21,18,.08); }
    img { width:48px; height:48px; border-radius:50%; object-fit:contain; }
    .eyebrow { font-size:12px; font-weight:900; color:var(--accent); }
    h1 { margin:6px 0 8px; font-size:26px; line-height:1.18; letter-spacing:0; }
    p { margin:0; color:var(--muted); font-size:14px; line-height:1.65; word-break:keep-all; }
    form, .panel { display:grid; gap:12px; margin-top:14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:15px; }
    label { display:grid; gap:7px; color:#3b352f; font-size:13px; font-weight:800; }
    input { width:100%; min-height:48px; border:1px solid var(--line); border-radius:8px; padding:10px 11px; background:#fff; color:var(--ink); font:inherit; font-size:17px; }
    input:focus { outline:2px solid rgba(183,61,50,.18); border-color:var(--accent); }
    button { min-height:50px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:900; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .folder-link { display:flex; align-items:center; justify-content:center; min-height:46px; margin-top:10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); text-decoration:none; font-size:14px; font-weight:900; }
    .folder-link:focus-visible { outline:2px solid rgba(183,61,50,.24); outline-offset:2px; }
    .progress { height:9px; border-radius:999px; overflow:hidden; background:#eee6dd; }
    .bar { height:100%; width:0; background:var(--accent); transition:width .25s ease; }
    .status { font-size:14px; line-height:1.6; color:var(--muted); white-space:pre-wrap; }
    .result { display:grid; gap:8px; }
    .row { display:grid; grid-template-columns:82px 1fr; gap:10px; padding-top:8px; border-top:1px solid rgba(24,21,18,.08); font-size:14px; }
    .row b { color:#403933; }
    .send { background:#181512; }
    .send:disabled { background:#8c8278; }
    .steps { display:grid; gap:7px; }
    .step { display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
    .dot { width:12px; height:12px; border-radius:50%; border:1px solid #c8bdb2; background:#fff; }
    .step.done { color:var(--good); font-weight:800; }
    .step.done .dot { border-color:var(--good); background:var(--good); }
    .step.active { color:var(--accent); font-weight:900; }
    .step.active .dot { border-color:var(--accent); background:var(--accent); }
    .history { display:grid; gap:8px; }
    .history-card { position:relative; }
    .history-item { width:100%; min-height:0; display:grid; gap:3px; padding:11px 42px 11px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); text-align:left; font-size:13px; font-weight:700; }
    .history-item small { color:var(--muted); font-size:12px; font-weight:500; }
    .discard-history { position:absolute; top:7px; right:7px; width:30px; min-height:30px; border:1px solid rgba(150,53,44,.2); border-radius:999px; background:#fff7f4; color:var(--bad); font-size:15px; line-height:1; }
    .message { margin-top:14px; border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:14px; line-height:1.7; word-break:keep-all; }
    .message.good { border-color:#bcd7d2; background:#f2faf8; color:var(--good); }
    .message.bad { border-color:#f0c9c1; background:#fff7f4; color:var(--bad); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">ARCHIVE PILATES</div>
        <h1>현장 웰컴 즉시발송</h1>
        <p>회원님의 가입서 작성 링크를 준비합니다. 휴대폰 번호와 성함을 확인한 뒤, 안내에 따라 가입서 링크를 발송해 주세요.</p>
      </div>
      <img src="../logo120.png" alt="ARCHIVE PILATES">
    </header>

    <form id="requestForm">
      <label>휴대폰 번호
        <input name="phone" inputmode="tel" autocomplete="tel" placeholder="01012345678" required>
      </label>
      <label>회원명 확인용
        <input name="memberName" autocomplete="name" placeholder="동명이인 방지용, 선택 입력">
      </label>
      <button type="submit">가입서 링크 준비</button>
      <a class="folder-link" href="https://drive.google.com/drive/folders/1jpW73Io8GOkrURxoUoWZ2257mWKqEe8X" target="_blank" rel="noreferrer">서명완료 가입서 PDF 폴더</a>
    </form>

    <section id="panel" class="panel" hidden>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="status" class="status">요청 준비 중</div>
      <div id="steps" class="steps"></div>
      <div id="result" class="result"></div>
      <button id="sendButton" class="send" type="button" hidden>웰컴 알림톡 전송</button>
    </section>
    <section class="panel">
      <div class="status"><b>보낸 이력</b><br>이 브라우저에서 만든 현장 웰컴 요청을 표시합니다.</div>
      <div id="history" class="history"></div>
    </section>
    <section id="message" class="message" hidden></section>
  </main>

  <script>
    const form = document.getElementById('requestForm');
    const panel = document.getElementById('panel');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const stepsEl = document.getElementById('steps');
    const message = document.getElementById('message');
    const bar = document.getElementById('bar');
    const button = form.querySelector('button');
    const sendButton = document.getElementById('sendButton');
    const historyEl = document.getElementById('history');
    let pollTimer = null;
    let current = null;
    renderHistory();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      hideMessage();
      resultEl.innerHTML = '';
      try {
        const payload = {
          phone: form.elements.phone.value.trim(),
          memberName: form.elements.memberName.value.trim()
        };
        current = await requestJson('../api/onsiteWelcomeRequest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        rememberRequest({
          requestId: current.requestId,
          accessToken: current.accessToken,
          phone: payload.phone,
          memberName: payload.memberName,
          createdAt: new Date().toISOString()
        });
        panel.hidden = false;
        setStatus({ progressPercent: 5, progressLabel: '현장 웰컴 요청 접수', status: 'pending' });
        startPolling();
      } catch (err) {
        showMessage(err.message || '요청을 만들지 못했습니다.', true);
        button.disabled = false;
      }
    });

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(loadStatus, 2500);
      loadStatus();
    }

    async function loadStatus() {
      if (!current?.requestId || !current?.accessToken) return;
      try {
        const data = await requestJson(`../api/onsiteWelcomeRequest?id=${encodeURIComponent(current.requestId)}&token=${encodeURIComponent(current.accessToken)}`);
        setStatus(data.request);
        updateHistoryItem(data.request);
        if (shouldStopPolling(data.request)) {
          clearInterval(pollTimer);
          button.disabled = false;
        }
      } catch (err) {
        clearInterval(pollTimer);
        button.disabled = false;
        showMessage(err.message || '상태를 확인하지 못했습니다.', true);
      }
    }

    function setStatus(request) {
      const percent = Math.max(0, Math.min(100, Number(request.progressPercent || 0)));
      bar.style.width = `${percent}%`;
      statusEl.textContent = displayProgressLabel(request.progressLabel || statusLabel(request.status));
      if (request.lastError) showMessage(request.lastError, true);
      const terminalError = ['error', 'cancelled'].includes(request.status);
      const visibleStages = terminalError ? [] : (request.stages || []);
      renderStages(normalizeStages({ ...request, stages: visibleStages }));
      const sendVisible = ['lookup_ready', 'ready'].includes(request.status) && Boolean(request.signupUrl);
      sendButton.hidden = !sendVisible;
      sendButton.disabled = request.status === 'ready' || !request.canSendAlimtalk;
      sendButton.textContent = request.hasAlimtalkSentHistory ? '웰컴 알림톡 발송 완료' : '웰컴 알림톡 전송';
      if (request.signupUrl) {
        resultEl.innerHTML = [
          row('회원', request.lookup?.memberName || request.memberNameHint || '-'),
          row('수강권', request.lookup?.ticketName || '-'),
          row('가입서', `<a href="${escapeAttr(request.signupUrl)}" target="_blank" rel="noreferrer">회원가입서 열기</a>`)
        ].join('');
        if (request.status === 'lookup_ready') showMessage('가입서 링크가 준비되었습니다. 알림톡 전송 요청 버튼을 눌러주세요.');
      }
    }

    sendButton.addEventListener('click', async () => {
      if (!current?.requestId || !current?.accessToken) return;
      await sendAlimtalk(current, sendButton);
    });

    async function sendAlimtalk(row, triggerButton) {
      if (!row?.requestId || !row?.accessToken) return;
      if (triggerButton) triggerButton.disabled = true;
      hideMessage();
      try {
        const data = await requestJson('../api/onsiteWelcomeRequest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'send', requestId: row.requestId, accessToken: row.accessToken })
        });
        current = { ...row, ...current, requestId: row.requestId, accessToken: row.accessToken };
        setStatus(data.request);
        updateHistoryItem(data.request);
        if (data.request.status === 'sent') {
          showMessage('웰컴 알림톡 발송이 완료되었습니다.');
        } else if (!data.request.lastError) {
          showMessage('알림톡 전송을 처리했습니다.');
        }
        if (!shouldStopPolling(data.request)) startPolling();
      } catch (err) {
        showMessage(err.message || '알림톡 전송 요청에 실패했습니다.', true);
        if (triggerButton) triggerButton.disabled = false;
      }
    }

    function shouldStopPolling(request) {
      if (['error', 'cancelled'].includes(request.status)) return true;
      if (['lookup_ready', 'ready'].includes(request.status)) return true;
      if (request.status !== 'sent') return false;
      const contractStatus = String(request.contractStatus || '');
      const syncStatus = String(request.studioMateSyncStatus || '');
      if (contractStatus !== 'submitted') return false;
      return !['pending', 'processing', 'syncing'].includes(syncStatus);
    }

    function renderStages(stages) {
      stepsEl.innerHTML = stages.map((step) => `
        <div class="step ${escapeAttr(step.state || 'pending')}"><span class="dot"></span><span>${escapeHtml(step.label)}</span></div>
      `).join('');
    }

    function normalizeStages(request) {
      const stages = Array.isArray(request.stages) ? request.stages.map((stage) => ({ ...stage })) : [];
      const syncStatus = String(request.studioMateSyncStatus || '').trim();
      const deferred = ['pending_excel_reconcile', 'manual_required', 'skipped'].includes(syncStatus);
      if (!deferred) return stages;
      return stages.map((stage) => {
        if (stage.key === 'studiomate_syncing') return { ...stage, label: '정기 반영 대기', state: 'pending' };
        if (stage.key === 'studiomate_synced') return { ...stage, label: '스튜디오메이트 확인 대기', state: 'pending' };
        return stage;
      });
    }

    function row(label, value) {
      return `<div class="row"><b>${escapeHtml(label)}</b><span>${value}</span></div>`;
    }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.ok === false) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    function statusLabel(status) {
      return status === 'running' ? '가입서 준비 중' : status === 'lookup_ready' ? '가입서 준비 완료' : status === 'ready' ? '알림톡 전송 요청 완료' : status === 'sent' ? '웰컴 알림톡 발송 완료' : status === 'error' ? '처리 실패' : '대기 중';
    }

    function rememberRequest(item) {
      const rows = historyRows().filter((row) => row.requestId !== item.requestId);
      rows.unshift(item);
      localStorage.setItem('archiveOnsiteWelcomeHistory', JSON.stringify(rows.slice(0, 20)));
      renderHistory();
    }

    function updateHistoryItem(request) {
      const rows = historyRows();
      const index = rows.findIndex((row) => row.requestId === request.requestId);
      if (index < 0) return;
      rows[index] = {
        ...rows[index],
        status: request.status,
        progressLabel: request.progressLabel,
        signupUrl: request.signupUrl,
        alimtalkSendId: request.alimtalkSendId || '',
        contractStatus: request.contractStatus || '',
        hasAlimtalkSentHistory: Boolean(request.hasAlimtalkSentHistory),
        canSendAlimtalk: Boolean(request.canSendAlimtalk),
        memberName: request.lookup?.memberName || rows[index].memberName
      };
      localStorage.setItem('archiveOnsiteWelcomeHistory', JSON.stringify(rows.slice(0, 20)));
      renderHistory();
    }

    function historyRows() {
      try {
        return JSON.parse(localStorage.getItem('archiveOnsiteWelcomeHistory') || '[]').filter((row) => row.requestId && row.accessToken);
      } catch (_) {
        return [];
      }
    }

    function renderHistory() {
      const rows = historyRows();
      historyEl.innerHTML = rows.length ? rows.map((row) => `
        <div class="history-card">
          <button class="history-item" type="button" data-request="${escapeAttr(row.requestId)}">
            <span>${escapeHtml(row.memberName || row.memberNameHint || '회원명 미확인')} · ${escapeHtml(phoneLast4(row.phone))}</span>
            <small>${escapeHtml(displayProgressLabel(row.progressLabel || statusLabel(row.status || 'pending')))}</small>
          </button>
          <button class="discard-history" type="button" aria-label="이력 폐기" data-discard="${escapeAttr(row.requestId)}">X</button>
        </div>
      `).join('') : '<div class="status">아직 이 브라우저에서 만든 요청이 없습니다.</div>';
      historyEl.querySelectorAll('[data-request]').forEach((item) => {
        item.addEventListener('click', () => {
          const row = rows.find((entry) => entry.requestId === item.dataset.request);
          if (!row) return;
          current = row;
          panel.hidden = false;
          startPolling();
        });
      });
      historyEl.querySelectorAll('[data-discard]').forEach((item) => {
        item.addEventListener('click', async () => {
          const row = rows.find((entry) => entry.requestId === item.dataset.discard);
          if (!row) return;
          if (!confirm('이 현장 웰컴 이력을 폐기할까요?')) return;
          item.disabled = true;
          hideMessage();
          try {
            await requestJson('../api/onsiteWelcomeRequest', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'discard', requestId: row.requestId, accessToken: row.accessToken })
            });
            forgetRequest(row.requestId);
            if (current?.requestId === row.requestId) {
              clearInterval(pollTimer);
              current = null;
              panel.hidden = true;
              button.disabled = false;
            }
            showMessage('잘못 생성된 현장 웰컴 이력을 폐기했습니다.');
          } catch (err) {
            showMessage(err.message || '이력 폐기에 실패했습니다.', true);
            item.disabled = false;
          }
        });
      });
    }

    function forgetRequest(requestId) {
      const rows = historyRows().filter((row) => row.requestId !== requestId);
      localStorage.setItem('archiveOnsiteWelcomeHistory', JSON.stringify(rows.slice(0, 20)));
      renderHistory();
    }

    function phoneLast4(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      return digits ? `끝자리 ${digits.slice(-4)}` : '번호 미확인';
    }

    function displayProgressLabel(label) {
      return String(label || '')
        .replace(/StudioMate 회원 검색 시작/g, '가입서 준비 중')
        .replace(/StudioMate 단건 조회 실패/g, '가입서 준비 실패')
        .replace(/StudioMate 조회 중/g, '가입서 준비 중')
        .replace(/StudioMate/g, '가입서');
    }

    function showMessage(text, warn = false) {
      message.hidden = false;
      message.className = `message ${warn ? 'bad' : 'good'}`;
      message.textContent = text;
    }

    function hideMessage() {
      message.hidden = true;
      message.textContent = '';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char] || char);
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }
  </script>
</body>
</html>
