<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCHIVE PILATES Private Template Samples</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f2;
      --surface: #fffdfa;
      --line: #ded8d0;
      --text: #201d19;
      --muted: #6f675f;
      --soft: #ece7df;
      --accent: #4f5b4a;
      --accent-weak: #e5eadf;
      --danger: #8b4a3b;
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 20px 16px 52px; }
    header { padding: 18px 0 14px; border-bottom: 1px solid var(--line); }
    .brand { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 0; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 750; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; line-height: 1.35; letter-spacing: 0; }
    h3 { margin: 0; color: var(--muted); font-size: 13px; font-weight: 800; }
    p { margin: 0; }
    a { color: inherit; }
    .meta { display: grid; gap: 8px; margin-top: 16px; color: var(--muted); font-size: 14px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .tab { display: inline-flex; align-items: center; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 800; text-decoration: none; }
    .tab.active { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); }
    .summary, .reference-card, section.field, .panel, .sample-note {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .summary { display: grid; gap: 8px; margin: 18px 0; padding: 14px; }
    .summary dl { display: grid; gap: 8px; margin: 0; }
    .summary div { display: grid; gap: 3px; }
    .summary dt, .label { color: var(--muted); font-size: 12px; font-weight: 800; }
    .summary dd, .value { margin: 0; font-size: 14px; word-break: keep-all; overflow-wrap: anywhere; }
    .reference-panel { display: grid; gap: 12px; margin: 18px 0; }
    .reference-card { display: grid; gap: 10px; padding: 14px; }
    .reference-card p, .sample-note { color: var(--muted); font-size: 14px; word-break: keep-all; overflow-wrap: anywhere; }
    .reference-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .reference-list li { padding: 8px 10px; border-radius: var(--radius); background: color-mix(in srgb, var(--surface) 70%, var(--soft)); font-size: 13px; word-break: keep-all; overflow-wrap: anywhere; }
    .template-badge { display: inline-flex; align-items: center; width: fit-content; min-height: 30px; padding: 5px 9px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); font-size: 12px; font-weight: 800; }
    section.field { margin-top: 18px; padding: 16px; }
    .field-help { margin: -4px 0 10px; color: var(--muted); font-size: 13px; word-break: keep-all; overflow-wrap: anywhere; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice { min-height: 44px; display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 14px; }
    .choice input { width: 16px; height: 16px; accent-color: var(--accent); }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-weak); }
    select, textarea, input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; font-size: 15px; }
    select { min-height: 48px; }
    textarea { min-height: 104px; resize: vertical; }
    .panel { display: grid; gap: 7px; padding: 15px 16px; margin-top: 12px; }
    .grid { display: grid; gap: 10px; }
    .sample-note { margin-top: 18px; padding: 14px; }
    .actions { position: sticky; bottom: 0; margin: 24px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(12px); }
    button { width: 100%; min-height: 48px; border: 0; border-radius: var(--radius); background: var(--text); color: white; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
    @media (min-width: 640px) {
      main { padding: 28px 22px 60px; }
      .summary dl, .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">ARCHIVE PILATES</p>
      <h1 id="title">프라이빗 목적별 설문 샘플</h1>
      <div class="meta" id="meta">운영 규칙 확인용 샘플 화면입니다. 실제 저장/발송은 되지 않습니다.</div>
    </header>
    <nav class="tabs" aria-label="샘플 화면">
      <a class="tab" data-tab="member" href="?view=member">회원 사전설문</a>
      <a class="tab" data-tab="teacher-pre" href="?view=teacher-pre">강사 수업 전</a>
      <a class="tab" data-tab="teacher-post" href="?view=teacher-post">강사 수업 후</a>
    </nav>
    <div id="app"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const view = params.get("view") || "member";
    const app = document.getElementById("app");
    const title = document.getElementById("title");
    const meta = document.getElementById("meta");
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === view));

    const template = {
      code: "posture",
      label: "체형교정/정렬",
      reason: "목표: 체형교정과 골반 정렬 · 관심 부위: 골반과 흉곽",
      reviewDue: false,
    };
    const intake = {
      purposeTemplateCode: "posture",
      purposeTemplateLabel: "체형교정/정렬",
      goal: "골반 정렬과 좌우 밸런스를 개선하고 싶어요.",
      focusArea: "골반과 흉곽 정렬",
      exerciseLevel: "필라테스 경험 있음",
      expectationOrImportantFactor: "자세가 안정되는 느낌",
      concernOrDifficulty: "오래 앉아 있으면 허리와 목/어깨가 긴장됩니다.",
      lifestyleOrPreviousIssue: "업무 중 앉아 있는 시간이 길고 오른쪽 고관절이 뻐근합니다.",
      painOrMedicalNote: "통증은 아니지만 허리 부담이 올라오면 강도를 조절하고 싶습니다.",
    };
    const previousRecord = {
      sessionLabel: "12회차",
      lessonTime: "2026. 6. 6. 오후 7:00",
      goals: ["자세/정렬", "골반/하지 정렬"],
      focusAreas: ["골반", "흉곽"],
      changes: ["정렬 인지 향상", "좌우 밸런스 개선"],
      nextDirection: "같은 흐름 유지",
      nextMemo: "다음 수업에서는 오른쪽 고관절 움직임을 먼저 확인하고 하체 정렬로 연결합니다.",
    };
    const sets = {
      planBasis: ["회원 기본 템플릿대로 진행", "지난 수업 흐름 이어서 진행", "오늘 컨디션에 맞춰 일부 조정", "새로운 목표로 변경"],
      preCondition: ["특이사항 없음", "피로감 있어 강도 조절 필요", "불편감 확인 후 진행 필요", "호흡/긴장 먼저 체크 필요", "좌우 차이 확인 필요", "가동범위 확인 필요"],
      goals: ["자세/정렬", "골반/하지 정렬", "흉곽/호흡", "목/어깨 긴장 완화", "허리 안정화", "밸런스/컨트롤"],
      focusAreas: ["흉곽", "허리", "골반", "복부/코어", "고관절", "하체"],
      equipment: ["기본 계획대로", "리포머", "캐딜락", "체어", "바렐", "매트", "소도구", "현장 컨디션 보고 결정"],
      intensity: ["기본 강도 유지", "낮게 시작", "보통", "점진 상승", "컨디션 보고 조절"],
      preChecks: ["오늘 볼 정렬", "좌우 차이", "호흡/흉곽", "골반/척추 포인트", "보상 움직임 가능성"],
      sessionType: ["일반 진행 회차", "컨디션 조절 회차", "목표 전환 회차", "리뷰 회차"],
      planProgress: ["계획대로 진행", "일부 조정하여 진행", "회복 중심으로 전환", "강도 낮춰 진행", "강도 소폭 상승", "기구/구성 변경"],
      condition: ["편안하게 진행", "보통", "피로감 있어 조절", "불편감 확인하며 진행", "집중 유지가 다소 어려움", "적극적으로 잘 따라옴"],
      painChange: ["특이 없음", "기존 불편감 유지", "부담 감소", "부담 증가로 주의 필요", "새로운 불편감 체크 필요"],
      changes: ["정렬 인지 향상", "골반 중립 유지 향상", "흉곽 움직임 개선", "좌우 밸런스 개선", "하지 정렬 개선", "불필요한 긴장 감소", "큰 변화보다 유지에 집중"],
      observations: ["정렬 수정 반응이 빨라짐", "보상 움직임이 줄어듦", "좌우 차이가 아직 남아있음", "컨트롤이 흔들리는 구간 있음"],
      responses: ["편안하게 따라옴", "특정 동작에서 자신감이 생김", "강도는 적절했다고 표현", "조금 더 천천히 진행하면 좋음", "피로감 있어 회복 중심 필요", "다음에도 같은 흐름을 이어가면 좋음", "별도 표현 없음"],
      nextDirection: ["같은 흐름 유지", "강도 소폭 상승", "호흡/정렬 다시 체크", "회복 중심으로 진행", "불편감 확인 후 진행", "특정 부위 집중", "전신 연결로 확장", "직접 작성"],
    };

    if (view === "teacher-pre") renderTeacherPre();
    else if (view === "teacher-post") renderTeacherPost();
    else renderMemberSurvey();

    function renderMemberSurvey() {
      title.textContent = "회원 최초 프라이빗 사전설문 샘플";
      meta.textContent = "회원이 수업 전 받게 되는 질문 흐름 예시입니다.";
      app.innerHTML = `
        <div class="sample-note">이 화면은 샘플입니다. 실제 회원 설문은 링크별 토큰으로 열리고 제출 후 강사용 참고 카드와 템플릿 자동 분류에 반영됩니다.</div>
        <section class="panel"><div class="label">회원명</div><div class="value">김아카이브</div></section>
        <div class="grid">
          ${choiceField("프라이빗 수업 목적 템플릿을 선택해주세요", ["체형교정/정렬", "다이어트/체력", "통증/회복", "산전·산후/컨디션"], intake.purposeTemplateLabel)}
          ${textField("선택한 목적 안에서 가장 개선하고 싶은 점은 무엇인가요?", intake.goal)}
          ${textField("가장 신경 쓰이는 부위나 움직임은 무엇인가요?", intake.focusArea)}
          ${choiceField("운동 경험은 어느 정도인가요?", ["처음", "조금 있음", "꾸준히 해본 적 있음", "오랜만에 다시 시작"], "꾸준히 해본 적 있음")}
          ${textField("수업에서 중요하게 생각하는 요소는 무엇인가요?", intake.expectationOrImportantFactor)}
          ${textField("운동할 때 어렵거나 걱정되는 점이 있나요?", intake.concernOrDifficulty)}
          ${textField("생활 습관이나 이전 이슈 중 강사가 알아야 할 내용이 있나요?", intake.lifestyleOrPreviousIssue)}
          ${textField("통증, 병력, 주의해야 할 움직임이 있나요?", intake.painOrMedicalNote)}
        </div>
        <div class="actions"><button type="button" onclick="sampleOnly()">사전설문 제출 샘플</button></div>`;
    }

    function renderTeacherPre() {
      title.textContent = "강사용 수업 전 계획 샘플";
      meta.textContent = "현재 프라이빗 차트 수업 전 화면과 같은 구조의 샘플입니다.";
      app.innerHTML = `${referenceHtml()}${summaryHtml()}<form>
        ${selectField("회원 목적 템플릿", ["체형교정/정렬", "다이어트/체력", "통증/회복", "산전·산후/컨디션"], template.label, "최초 사전설문 기준 자동 분류입니다. 오늘 수업 목적이 다르면 강사가 수정할 수 있습니다.")}
        ${radioField("오늘 수업 계획 기준", sets.planBasis, "지난 수업 흐름 이어서 진행")}
        ${radioField("오늘 컨디션 체크", sets.preCondition, "호흡/긴장 먼저 체크 필요")}
        ${checkField("오늘 핵심 목표", sets.goals, ["자세/정렬", "골반/하지 정렬"], "최대 2개만 선택해 주세요.")}
        ${checkField("오늘 주요 부위", sets.focusAreas, ["골반", "흉곽"], "최대 2개만 선택해 주세요.")}
        ${checkField("오늘 기구 계획", sets.equipment, ["기본 계획대로", "리포머"], "최대 3개만 선택해 주세요.")}
        ${radioField("오늘 강도 계획", sets.intensity, "기본 강도 유지")}
        ${checkField("템플릿별 수업 전 체크", sets.preChecks, ["좌우 차이", "골반/척추 포인트"], "최대 2개만 선택해 주세요.")}
        ${textareaField("수업 전 강사 메모", "오른쪽 고관절 움직임을 먼저 확인하고 흉곽 호흡으로 연결합니다.")}
        <div class="actions"><button type="button" onclick="sampleOnly()">수업 전 계획 제출 샘플</button></div>
      </form>`;
    }

    function renderTeacherPost() {
      title.textContent = "강사용 수업 후 기록 샘플";
      meta.textContent = "현재 프라이빗 차트 수업 후 화면과 같은 구조의 샘플입니다.";
      app.innerHTML = `${referenceHtml()}${summaryHtml()}<form>
        ${selectField("회원 목적 템플릿", ["체형교정/정렬", "다이어트/체력", "통증/회복", "산전·산후/컨디션"], template.label, "오늘 수업 목적이 달랐다면 강사가 수정할 수 있습니다.")}
        ${radioField("오늘 회차 유형", sets.sessionType, "일반 진행 회차")}
        ${radioField("계획 대비 진행 상태", sets.planProgress, "계획대로 진행")}
        ${radioField("오늘 몸 상태 / 수업 반응", sets.condition, "편안하게 진행")}
        ${radioField("불편감 흐름", sets.painChange, "특이 없음")}
        ${checkField("오늘 관찰된 핵심 변화", sets.changes, ["정렬 인지 향상", "좌우 밸런스 개선"], "최대 2개만 선택해 주세요.")}
        ${checkField("추가 움직임 관찰", sets.observations, ["정렬 수정 반응이 빨라짐"], "최대 1개만 선택해 주세요.")}
        ${radioField("회원 체감 / 반응", sets.responses, "편안하게 따라옴")}
        ${radioField("다음 수업 방향", sets.nextDirection, "같은 흐름 유지")}
        ${textareaField("다음 수업 방향 상세 메모", "다음 수업에서는 오른쪽 고관절 움직임을 먼저 확인하고 하체 정렬로 연결합니다.")}
        ${textareaField("강사용 내부 메모", "회원에게 노출하지 않을 내부 참고 메모 예시입니다.")}
        <section class="panel"><h2>수업 사진·영상</h2><p class="value">실제 화면에서는 여기에서 사진/영상을 선택하면 Google Drive 회차 폴더에 업로드되고 회원 리포트에 자동 포함됩니다.</p></section>
        <div class="actions"><button type="button" onclick="sampleOnly()">수업 후 기록 제출 샘플</button></div>
      </form>`;
    }

    function referenceHtml() {
      return `<div class="reference-panel">
        <article class="reference-card">
          <span class="template-badge">${template.label} · 자동 분류</span>
          <h2>강사용 참고</h2>
          <p>회원 사전설문과 지난 회차 기록을 참고해 오늘 수업을 설계해 주세요. 필요하면 템플릿 선택을 바꿔 제출할 수 있습니다.</p>
        </article>
        <article class="reference-card">
          <h3>회원 최초 사전설문 요약</h3>
          <ul class="reference-list">
            <li><strong>목적 템플릿</strong> · ${escapeHtml(intake.purposeTemplateLabel)}</li>
            <li><strong>목표</strong> · ${escapeHtml(intake.goal)}</li>
            <li><strong>관심 부위</strong> · ${escapeHtml(intake.focusArea)}</li>
            <li><strong>운동 수준</strong> · ${escapeHtml(intake.exerciseLevel)}</li>
            <li><strong>고민/어려움</strong> · ${escapeHtml(intake.concernOrDifficulty)}</li>
            <li><strong>주의</strong> · 주의 내용 있음. 강사용 원본에서 상세 확인</li>
          </ul>
        </article>
        <article class="reference-card">
          <h3>지난 회차 수업 리포트</h3>
          <ul class="reference-list">
            <li><strong>회차</strong> · ${previousRecord.sessionLabel}</li>
            <li><strong>수업일</strong> · ${previousRecord.lessonTime}</li>
            <li><strong>목표</strong> · ${previousRecord.goals.join(", ")}</li>
            <li><strong>변화</strong> · ${previousRecord.changes.join(", ")}</li>
            <li><strong>다음 방향</strong> · ${previousRecord.nextMemo}</li>
          </ul>
        </article>
      </div>`;
    }

    function summaryHtml() {
      return `<div class="summary"><h2>사전설문 요약</h2><dl>
        <div><dt>목적 템플릿</dt><dd>${escapeHtml(intake.purposeTemplateLabel)}</dd></div>
        <div><dt>목표</dt><dd>${escapeHtml(intake.goal)}</dd></div>
        <div><dt>신경 부위</dt><dd>${escapeHtml(intake.focusArea)}</dd></div>
        <div><dt>운동 수준</dt><dd>${escapeHtml(intake.exerciseLevel)}</dd></div>
        <div><dt>주의</dt><dd>상세 내용은 강사용 기록에서 확인</dd></div>
      </dl></div>`;
    }

    function textField(label, value) {
      return `<section class="panel"><label class="label">${escapeHtml(label)}</label><input type="text" value="${escapeAttr(value)}"></section>`;
    }
    function choiceField(label, options, selected) {
      return `<section class="panel"><h2>${escapeHtml(label)}</h2><div class="choices">${options.map((option) => choice("radio", label, option, option === selected)).join("")}</div></section>`;
    }
    function selectField(label, options, selected, help) {
      return `<section class="field"><label><h2>${escapeHtml(label)}</h2></label>${help ? `<p class="field-help">${escapeHtml(help)}</p>` : ""}<select>${options.map((option) => `<option ${option === selected ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select></section>`;
    }
    function radioField(label, options, selected) {
      return `<section class="field"><h2>${escapeHtml(label)}</h2><div class="choices">${options.map((option) => choice("radio", label, option, option === selected)).join("")}</div></section>`;
    }
    function checkField(label, options, selected, help) {
      return `<section class="field"><h2>${escapeHtml(label)}</h2>${help ? `<p class="field-help">${escapeHtml(help)}</p>` : ""}<div class="choices">${options.map((option) => choice("checkbox", label, option, selected.includes(option))).join("")}</div></section>`;
    }
    function textareaField(label, value) {
      return `<section class="field"><label><h2>${escapeHtml(label)}</h2></label><textarea>${escapeHtml(value)}</textarea></section>`;
    }
    function choice(type, name, value, checked) {
      return `<label class="choice"><input type="${type}" name="${escapeAttr(name)}" value="${escapeAttr(value)}" ${checked ? "checked" : ""}><span>${escapeHtml(value)}</span></label>`;
    }
    function sampleOnly() {
      alert("샘플 화면입니다. 실제 저장/발송은 되지 않습니다.");
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }
    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
