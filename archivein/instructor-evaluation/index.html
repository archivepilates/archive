<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f2ec">
  <title>ARCHIVE PILATES 강사 테스트</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171412;
      --muted: #736a60;
      --soft: #948a80;
      --line: #e5ddd3;
      --bg: #f7f2ec;
      --paper: #fffdfa;
      --accent: #b73d32;
      --accent-soft: #fff0ec;
      --good: #2f6f68;
      --bad: #96352c;
      --shadow: 0 22px 60px rgba(67, 55, 45, .12);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: clip;
      background:
        linear-gradient(180deg, rgba(255,253,250,.88), rgba(247,242,236,.94)),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea { font: inherit; }
    button { min-height: 48px; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .58; }
    main {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 44px) max(14px, env(safe-area-inset-left)) 42px max(14px, env(safe-area-inset-right));
    }
    .start-view,
    .exam-view {
      display: grid;
      gap: 18px;
    }
    .hero {
      display: grid;
      gap: 18px;
      margin-bottom: 18px;
      padding: clamp(22px, 4vw, 38px);
      border: 1px solid rgba(229, 221, 211, .9);
      border-radius: 8px;
      background: rgba(255, 253, 250, .86);
      box-shadow: var(--shadow);
    }
    .brand-row {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand-mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 950;
      letter-spacing: 0;
    }
    .timer {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 0 14px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
    }
    .timer strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .timer.danger {
      border-color: rgba(150, 53, 44, .25);
      background: #fff7f4;
      color: var(--bad);
    }
    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.08;
      letter-spacing: 0;
    }
    .lead {
      max-width: 64ch;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.72;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .layout {
      display: grid;
      gap: 14px;
    }
    .start-card {
      display: grid;
      gap: 16px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: clamp(16px, 3vw, 24px);
      box-shadow: 0 14px 40px rgba(67, 55, 45, .08);
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.08rem;
      line-height: 1.35;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 0 10px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 850;
    }
    .identity-form {
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 7px;
      color: #3c352f;
      font-size: .9rem;
      font-weight: 900;
    }
    input, textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 12px 13px;
      line-height: 1.45;
    }
    input { min-height: 50px; }
    textarea { min-height: 118px; resize: vertical; }
    input:focus, textarea:focus {
      outline: 2px solid rgba(183, 61, 50, .18);
      border-color: rgba(183, 61, 50, .65);
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 950;
    }
    .secondary {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
    }
    .quiz-form {
      display: grid;
      gap: 12px;
    }
    .exam-shell {
      display: grid;
      gap: 14px;
      width: min(820px, 100%);
      margin: 0 auto;
    }
    .exam-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(229, 221, 211, .9);
      border-radius: 8px;
      background: rgba(255, 253, 250, .94);
      padding: 12px;
      box-shadow: 0 16px 42px rgba(67, 55, 45, .1);
      backdrop-filter: blur(16px);
    }
    .exam-heading {
      min-width: 0;
    }
    .exam-heading h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.6vw, 1.75rem);
      line-height: 1.25;
    }
    .exam-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 800;
      line-height: 1.4;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .question {
      display: grid;
      width: 100%;
      min-width: 0;
      gap: 12px;
      border: 1px solid rgba(229, 221, 211, .95);
      border-radius: 8px;
      background: #fff;
      padding: 16px;
    }
    .question-title {
      margin: 0;
      font-size: .98rem;
      font-weight: 950;
      line-height: 1.55;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .question-meta {
      color: var(--soft);
      font-size: .78rem;
      font-weight: 850;
    }
    .options {
      display: grid;
      min-width: 0;
      gap: 8px;
    }
    .option {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdfa;
      padding: 11px;
      font-weight: 800;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .option span {
      min-width: 0;
    }
    .option input {
      width: 18px;
      min-height: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--accent);
    }
    .sticky-actions {
      position: sticky;
      bottom: 0;
      z-index: 4;
      display: grid;
      gap: 9px;
      margin: 4px 0 -14px;
      padding: 14px;
      background: linear-gradient(to top, var(--paper) 86%, rgba(255,253,250,0));
    }
    .status {
      min-height: 24px;
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 850;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }
    .result {
      display: grid;
      gap: 12px;
      border-color: rgba(47, 111, 104, .24);
      background: #f4fbf8;
    }
    .score {
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 950;
      line-height: 1;
      color: var(--good);
    }
    .score.bad { color: var(--bad); }
    .hidden { display: none !important; }
    @media (min-width: 760px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
      .start-card {
        width: min(560px, 100%);
        margin: 0 auto;
      }
    }
    @media (min-width: 768px) and (max-width: 1180px) {
      main {
        width: min(860px, 100%);
        padding-top: clamp(22px, 5vw, 54px);
      }
      .hero {
        padding: 30px;
      }
      .exam-shell {
        width: min(760px, 100%);
      }
      .question {
        padding: 18px;
      }
      .option {
        min-height: 50px;
        align-items: center;
      }
    }
    @media (max-width: 520px) {
      main { padding-inline: 10px; }
      .hero, .panel { padding: 16px; }
      .brand-row { align-items: flex-start; }
      .timer { padding-inline: 10px; font-size: .82rem; }
      .exam-header {
        align-items: flex-start;
        flex-direction: column;
      }
      .question {
        gap: 10px;
        padding: 14px;
      }
      .option {
        grid-template-columns: 20px minmax(0, 1fr);
        gap: 9px;
        padding: 10px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="start-view" id="startView">
      <section class="hero">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">AP</div>
          <div class="timer" aria-hidden="true"><span>제한시간</span><strong>20:00</strong></div>
        </div>
        <div>
          <p class="eyebrow">ARCHIVE PILATES</p>
          <h1>강사 테스트</h1>
        </div>
        <p class="lead">시험 시작 버튼을 누르면 20분 제한시간이 시작됩니다. 이름과 연락처를 정확히 입력한 뒤 조용한 환경에서 응시해 주세요.</p>
        <div class="meta">
          <span class="chip">총 22문항</span>
          <span class="chip">20분 제한</span>
          <span class="chip">제출 후 수정 불가</span>
        </div>
      </section>

      <div class="layout">
        <section class="panel start-card" id="identityPanel">
          <div>
            <h2>응시자 정보</h2>
            <p class="status">이름과 연락처는 강사 인사기록 카드 생성에 사용됩니다.</p>
          </div>
          <form class="identity-form" id="identityForm">
            <label>이름
              <input name="name" autocomplete="name" placeholder="홍길동" required>
            </label>
            <label>휴대폰 번호
              <input name="phone" inputmode="tel" autocomplete="tel" placeholder="01012345678" required>
            </label>
            <button class="primary" type="submit" id="startButton">시험 시작</button>
          </form>
        </section>
      </div>
    </section>

    <section class="exam-view hidden" id="examView">
      <div class="exam-shell">
        <header class="exam-header">
          <div class="exam-heading">
            <h1 id="quizTitle">강사 테스트</h1>
            <p class="status" id="quizStatus">타이머가 시작되었습니다. 모든 문항을 작성한 뒤 제출해 주세요.</p>
          </div>
          <div class="timer" id="timer" aria-live="polite"><span>남은 시간</span><strong>20:00</strong></div>
        </header>
        <form class="quiz-form" id="quizForm"></form>
        <section class="panel result hidden" id="resultPanel" aria-live="polite">
          <h2>제출 완료</h2>
          <div class="score" id="resultScore">0점</div>
          <p class="status" id="resultText">결과가 기록되었습니다.</p>
        </section>
      </div>
    </section>
  </main>

  <script>
    const API_URL = new URL('../api/instructorApplicantEvaluation', window.location.href).toString();
    const TIME_LIMIT_SECONDS = 20 * 60;
    const identityForm = document.getElementById('identityForm');
    const quizForm = document.getElementById('quizForm');
    const startView = document.getElementById('startView');
    const examView = document.getElementById('examView');
    const quizTitle = document.getElementById('quizTitle');
    const quizStatus = document.getElementById('quizStatus');
    const startButton = document.getElementById('startButton');
    const timer = document.getElementById('timer');
    const resultPanel = document.getElementById('resultPanel');
    const resultScore = document.getElementById('resultScore');
    const resultText = document.getElementById('resultText');
    let session = null;
    let quiz = null;
    let timerId = null;

    identityForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      startButton.disabled = true;
      setStatus('시험 세션을 준비하고 있습니다.');
      try {
        const formData = new FormData(identityForm);
        const response = await callApi({
          action: 'start',
          name: formData.get('name'),
          phone: formData.get('phone')
        });
        session = response;
        quiz = response.quiz;
        renderQuiz(quiz);
        startView.classList.add('hidden');
        examView.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'auto' });
        setStatus('타이머가 시작되었습니다. 모든 문항을 작성한 뒤 제출해 주세요.', 'good');
        startTimer(new Date(response.startedAt).getTime(), response.timeLimitSeconds || TIME_LIMIT_SECONDS);
      } catch (error) {
        startButton.disabled = false;
        setStatus(error.message || '시험을 시작하지 못했습니다.', 'bad');
      }
    });

    quizForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!session || !quiz) return;
      const submitButton = quizForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      setStatus('답안을 제출하고 있습니다.');
      try {
        const answers = collectAnswers();
        const response = await callApi({
          action: 'submit',
          sessionId: session.sessionId,
          sessionToken: session.sessionToken,
          answers
        });
        clearInterval(timerId);
        quizForm.classList.add('hidden');
        resultPanel.classList.remove('hidden');
        resultScore.textContent = `${Math.round(Number(response.scorePercent || 0))}점`;
        resultScore.classList.toggle('bad', response.status !== 'passed');
        const elapsed = formatElapsed(Number(response.elapsedSeconds || 0));
        resultText.textContent = response.timeExpired
          ? `제출은 기록되었지만 제한시간을 초과했습니다. 소요시간: ${elapsed}`
          : `제출이 완료되었습니다. 소요시간: ${elapsed}`;
        setStatus('강사 인사기록 카드에 결과가 저장되었습니다.', 'good');
      } catch (error) {
        submitButton.disabled = false;
        setStatus(error.message || '제출하지 못했습니다.', 'bad');
      }
    });

    function renderQuiz(data) {
      quizTitle.textContent = '강사 테스트';
      quizForm.innerHTML = data.questions.map((question, index) => renderQuestion(question, index)).join('') + `
        <div class="sticky-actions">
          <button class="primary" type="submit">답안 제출</button>
          <p class="status">제출 후에는 답안을 수정할 수 없습니다.</p>
        </div>
      `;
    }

    function renderQuestion(question, index) {
      const number = index + 1;
      const pointText = question.points ? `${question.points}점` : '검토 문항';
      if (question.type === 'single_choice') {
        return `
          <section class="question">
            <p class="question-title" id="${escapeAttr(question.questionId)}-title">${escapeHtml(question.title)}</p>
            <div class="question-meta">${pointText}</div>
            <div class="options" role="radiogroup" aria-labelledby="${escapeAttr(question.questionId)}-title">
              ${(question.options || []).map((option) => `
                <label class="option">
                  <input type="radio" name="${escapeAttr(question.questionId)}" value="${escapeAttr(option.optionId)}" required>
                  <span>${escapeHtml(option.label)}</span>
                </label>
              `).join('')}
            </div>
          </section>
        `;
      }
      const tag = question.type === 'short_text' ? 'textarea' : 'input';
      const input = tag === 'textarea'
        ? `<textarea name="${escapeAttr(question.questionId)}" placeholder="필요하면 답안을 입력해 주세요"></textarea>`
        : `<input name="${escapeAttr(question.questionId)}" placeholder="필요하면 입력해 주세요">`;
      return `
        <section class="question">
          <p class="question-title">${escapeHtml(question.title)}</p>
          <div class="question-meta">${number}번 · ${pointText}</div>
          ${input}
        </section>
      `;
    }

    function collectAnswers() {
      const answers = {};
      for (const question of quiz.questions || []) {
        const field = quizForm.elements[question.questionId];
        if (!field) continue;
        if (field instanceof RadioNodeList) answers[question.questionId] = field.value;
        else answers[question.questionId] = field.value;
      }
      return answers;
    }

    async function callApi(payload) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || '요청 처리에 실패했습니다.');
      return data;
    }

    function startTimer(startedAtMs, limitSeconds) {
      clearInterval(timerId);
      const tick = () => {
        const elapsed = Math.max(0, Math.floor((Date.now() - startedAtMs) / 1000));
        const remaining = Math.max(0, limitSeconds - elapsed);
        timer.querySelector('strong').textContent = formatClock(remaining);
        timer.classList.toggle('danger', remaining <= 180);
        if (remaining === 0) setStatus('제한시간이 종료되었습니다. 제출하면 시간초과로 기록됩니다.', 'bad');
      };
      tick();
      timerId = setInterval(tick, 1000);
    }

    function setStatus(text, tone = '') {
      quizStatus.textContent = text;
      quizStatus.className = `status ${tone}`.trim();
    }

    function formatClock(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function formatElapsed(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}분 ${seconds}초`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
</html>
