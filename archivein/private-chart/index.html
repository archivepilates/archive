<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCHIVE PILATES Private Chart</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f2;
      --surface: #fffdfa;
      --line: #ded8d0;
      --text: #201d19;
      --muted: #6f675f;
      --soft: #ece7df;
      --accent: #4f5b4a;
      --accent-weak: #e5eadf;
      --danger: #8b4a3b;
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    .meta {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .workflow-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 16px;
    }

    .workflow-step {
      min-width: 0;
      padding: 8px 4px;
      color: var(--muted);
      border-top: 2px solid var(--line);
      font-size: 11px;
      font-weight: 750;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .workflow-step.done {
      color: var(--accent);
      border-color: var(--accent);
    }

    .workflow-step.active {
      color: var(--text);
      border-color: var(--text);
    }

    .summary {
      display: grid;
      gap: 8px;
      margin: 18px 0;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .summary dl {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .summary div {
      display: grid;
      gap: 3px;
    }

    .summary dt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary dd {
      margin: 0;
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .previous-report {
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .previous-report p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .previous-report a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .field-group {
      min-width: 0;
      margin: 18px 0 0;
      padding: 18px 0 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .field-group legend {
      width: 100%;
      margin: 0 0 12px;
      padding: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
    }

    .field-group:focus {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    .grid {
      display: grid;
      gap: 8px;
    }

    .optional-details {
      margin-top: 18px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .optional-details > summary {
      min-height: 48px;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
    }

    .optional-details[open] {
      padding-bottom: 14px;
    }

    .optional-details section:first-of-type {
      margin-top: 0;
    }

    .daily-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .daily-card {
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 14px;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-decoration: none;
    }

    .daily-card strong,
    .daily-card span {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .daily-card span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .daily-status {
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .daily-status.done {
      background: var(--accent-weak);
      color: var(--accent);
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text);
    }

    .choice input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .choice:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-weak);
    }

    .other-answer {
      width: 100%;
      display: grid;
      gap: 6px;
      margin-top: 2px;
    }

    .other-answer[hidden] {
      display: none;
    }

    .other-answer textarea {
      min-height: 86px;
      background: #fff;
    }

    .purpose-groups {
      display: grid;
      gap: 12px;
    }

    .purpose-group {
      padding: 12px;
      background: color-mix(in srgb, var(--surface) 82%, var(--bg));
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .purpose-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
      word-break: keep-all;
    }

    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    .report-panel {
      display: grid;
      gap: 12px;
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .report-panel h2 {
      margin-bottom: 0;
    }

    .report-panel p {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .report-frame {
      width: 100%;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }

    .report-edit {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 72%, var(--bg));
    }

    .report-edit label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .report-edit textarea {
      min-height: 90px;
      background: #fff;
      color: var(--text);
      font-weight: 500;
    }

    .report-edit .report-next-direction {
      min-height: 128px;
    }

    .media-upload-panel {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .media-upload-panel h2 {
      margin-bottom: 0;
    }

    .media-upload-panel p,
    .media-file {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .media-upload-content {
      display: grid;
      gap: 12px;
      padding-bottom: 14px;
    }

    .media-input {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--accent-weak);
    }

    .media-input:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .media-input input {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .media-list {
      display: grid;
      gap: 8px;
    }

    .media-file {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .media-file a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    progress {
      width: 100%;
      height: 8px;
      accent-color: var(--accent);
    }

    .button-row {
      display: grid;
      gap: 8px;
    }

    .secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .locked-note {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--accent-weak);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .actions {
      position: sticky;
      bottom: 0;
      margin: 24px 0 0;
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: var(--radius);
      background: var(--text);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 640px) {
      main {
        padding: 28px 22px 56px;
      }

      .summary dl {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">ARCHIVE PILATES</p>
      <h1 id="title">프라이빗 오늘 기록</h1>
      <div class="meta" id="meta">차트 정보를 불러오는 중입니다.</div>
      <div class="workflow-steps" id="workflowSteps" aria-label="프라이빗 기록 진행 단계"></div>
    </header>

    <div class="summary" id="summary" aria-live="polite"></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div id="dailyPanel" class="daily-list hidden"></div>

    <form id="form" class="hidden">
      <div id="sections"></div>
      <div id="mediaPanel" class="hidden"></div>
      <div class="actions">
        <button type="submit" id="submitButton">제출</button>
      </div>
    </form>
    <div id="reportPanel" class="report-panel hidden" aria-live="polite"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = {
      requestId: params.get("r") || "",
      token: params.get("t") || "",
      view: params.get("view") || "",
      date: params.get("date") || "",
      mode: "post",
      focus: params.get("focus") || "",
      mediaFocusHandled: false,
      reportFocusHandled: false,
      loading: false,
      uploading: 0,
      data: null,
    };
    const apiBase = window.location.pathname.startsWith("/archivein/")
      ? "/archivein/api/privateChart"
      : "/api/privateChart";

    const sets = {
      goals: ["코어 안정성", "골반 정렬", "흉곽/호흡", "목 긴장 완화", "어깨 긴장 완화", "허리 안정화", "하지 정렬", "유연성", "체력/근지구력", "밸런스", "통증 관리"],
      focusAreas: ["목", "어깨", "흉곽", "허리", "골반", "복부", "둔부", "고관절", "하체", "발/발목", "전신"],
      equipment: ["리포머", "캐딜락", "체어", "바렐", "매트", "소도구", "미정"],
      cautions: ["통증 확인 필요", "강도 낮게 시작", "호흡 먼저 체크", "좌우 차이 확인", "피로도 확인", "관절 가동범위 확인", "특별 주의 없음"],
      changes: ["정렬 인지 향상", "호흡 연결 개선", "코어 연결감 향상", "불필요한 긴장 감소", "좌우 차이 남아있음", "가동범위 향상", "불편감 완화", "강도 적절", "피로 누적", "컨트롤 보완 필요", "편안하게 수업 진행", "큰 변화보다 유지에 집중"],
    };

    const postFields = [
      { type: "multi", key: "focusAreas", label: "진행 부위", options: sets.focusAreas, required: true },
      { type: "multi", key: "changes", label: "확인한 변화", options: sets.changes, required: true },
      { type: "text", key: "nextDirection", label: "다음 방향", required: true, placeholder: "다음 수업에서 이어갈 방향을 한두 문장으로 적어주세요.", help: "작성한 뜻을 바꾸지 않고 회원 리포트에 그대로 반영합니다." },
    ];

    const optionalPostFields = [
      { type: "single", key: "condition", label: "오늘 몸 상태", options: ["편안하게 시작", "보통", "피로감 있어 조절", "불편감 확인 필요", "집중 유지 어려움"] },
      { type: "multi", key: "equipment", label: "사용 기구", options: sets.equipment },
      { type: "multi", key: "cautions", label: "주의사항", options: sets.cautions },
      { type: "text", key: "homework", label: "홈워크", placeholder: "숙제가 있을 때만 입력해 주세요. 예: 자기 전 3분 흉곽 호흡, 벽 기대어 어깨 긴장 풀기", help: "작성한 내용은 회원 리포트의 홈워크 섹션에 표시됩니다." },
    ];

    const title = document.getElementById("title");
    const meta = document.getElementById("meta");
    const workflowSteps = document.getElementById("workflowSteps");
    const summary = document.getElementById("summary");
    const form = document.getElementById("form");
    const dailyPanel = document.getElementById("dailyPanel");
    const sections = document.getElementById("sections");
    const mediaPanel = document.getElementById("mediaPanel");
    const reportPanel = document.getElementById("reportPanel");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    boot();

    async function boot() {
      try {
        if (!state.requestId || !state.token) throw new Error("차트 링크 정보가 부족합니다.");
        if (state.view === "today") {
          const res = await fetch(`${apiBase}?view=today&r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&date=${encodeURIComponent(state.date)}`);
          const data = await res.json();
          if (!res.ok || data.ok === false) throw new Error(data.error || "오늘 기록 목록을 불러오지 못했습니다.");
          renderDaily(data);
          return;
        }
        const res = await fetch(`${apiBase}?r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&mode=${state.mode}`);
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "차트 정보를 불러오지 못했습니다.");
        }
        render(data);
      } catch (error) {
        meta.textContent = "";
        summary.innerHTML = "";
        setStatus(error.message || String(error), true);
      }
    }

    function renderDaily(data) {
      title.textContent = "오늘의 프라이빗 기록";
      meta.innerHTML = `<span>${escapeHtml(data.staffName || "강사")} · ${escapeHtml(data.date || "")}</span><span>전체 ${Number(data.total || 0)}건 · 전달 완료 ${Number(data.completed || 0)}건</span>`;
      workflowSteps.innerHTML = "";
      summary.innerHTML = "";
      const labels = { recording: "기록 필요", preparing: "리포트 준비", review: "확인 필요", delivered: "전달 완료" };
      dailyPanel.innerHTML = (data.items || []).length
        ? data.items.map((item) => `<a class="daily-card" href="${escapeAttr(dailyItemUrl(item))}"><span><strong>${escapeHtml(item.memberName || "회원")} · ${Number(item.sessionNumber || 0)}회차</strong><span>${escapeHtml(item.lessonTime || "")}</span></span><span class="daily-status ${item.status === "delivered" ? "done" : ""}">${escapeHtml(labels[item.status] || "확인")}</span></a>`).join("")
        : `<div class="summary"><p>오늘 작성할 프라이빗 기록이 없습니다.</p></div>`;
      dailyPanel.classList.remove("hidden");
    }

    function dailyItemUrl(item) {
      const url = String(item.postUrl || "#");
      if (item.status !== "review" || url === "#") return url;
      return `${url}${url.includes("?") ? "&" : "?"}focus=report`;
    }

    function render(data) {
      state.data = data;
      title.textContent = "프라이빗 오늘 기록";
      submitButton.textContent = "기록 저장 · 리포트 확인";
      meta.innerHTML = [
        `<span>${escapeHtml(data.memberName || "-")}님 · ${Number(data.sessionNumber || 1)}회차</span>`,
        `<span>${escapeHtml(data.lessonTime || data.lessonDate || "-")} · 담당 ${escapeHtml(data.staffName || "미정")}</span>`,
      ].join("");
      renderWorkflowSteps(data);
      summary.innerHTML = [
        intakeHtml(data.intakeSummary),
        previousReportHtml(data.previousReport),
      ].filter(Boolean).join("");
      sections.innerHTML = postFields.map(fieldHtml).join("") + `<details class="optional-details"><summary data-testid="optional-record-toggle">선택 기록</summary>${optionalPostFields.map(fieldHtml).join("")}</details>`;
      renderMediaPanel(data);
      applyExistingAnswers(data);
      syncOtherAnswers();
      syncOptionalDetails(data);
      renderReportPanel(data);
      applyLockedState(data);
      form.classList.remove("hidden");
      if (!form.dataset.submitBound) {
        form.addEventListener("submit", submit);
        form.dataset.submitBound = "1";
      }
      if (!form.dataset.otherAnswerBound) {
        form.addEventListener("change", syncOtherAnswers);
        form.dataset.otherAnswerBound = "1";
      }
      focusMediaUploadPanelIfRequested();
      focusReportPanelIfRequested();
    }

    function syncOptionalDetails(data) {
      const details = sections.querySelector(".optional-details");
      if (!details) return;
      const answers = data.existingAnswers?.post || {};
      const count = optionalPostFields.filter((field) => {
        const value = answers[field.key];
        return Array.isArray(value) ? value.length > 0 : Boolean(String(value || "").trim());
      }).length;
      const summaryNode = details.querySelector("summary");
      if (summaryNode) summaryNode.textContent = count ? `선택 기록 · ${count}개 입력됨` : "선택 기록";
      if (count) details.open = true;
    }

    function applyExistingAnswers(data) {
      const answers = data.existingAnswers?.post;
      if (!answers || typeof answers !== "object") return;
      for (const [key, value] of Object.entries(answers)) {
        const values = (Array.isArray(value) ? value.map(String) : [String(value ?? "")]).flatMap((item) => expandLegacyChoiceValue(key, item));
        const field = form.elements[key];
        if (!field) continue;
        if (field instanceof RadioNodeList) {
          values.forEach((item) => {
            const input = Array.from(field).find((node) => node.value === item || (isStoredOtherValue(item) && isOtherChoice(node.value)));
            if (input) {
              input.checked = true;
              if (isStoredOtherValue(item)) setOtherAnswerText(key, item);
            }
          });
          if ("value" in field && values.length === 1 && !isStoredOtherValue(values[0])) field.value = values[0];
          continue;
        }
        if (field instanceof HTMLTextAreaElement || field instanceof HTMLInputElement) {
          field.value = values[0] || "";
        }
      }
    }

    function applyLockedState(data) {
      const lockedNote = document.getElementById("lockedNote");
      if (lockedNote) lockedNote.remove();
      form.querySelectorAll("input, textarea").forEach((input) => {
        input.disabled = Boolean(data.locked);
      });
      if (data.locked) {
        submitButton.disabled = true;
        submitButton.textContent = "회원 리포트 발송 완료";
        const note = document.createElement("p");
        note.id = "lockedNote";
        note.className = "locked-note";
        note.textContent = "회원 리포트 알림톡 발송이 완료되어 기록을 수정할 수 없습니다.";
        sections.after(note);
      } else {
        submitButton.textContent = data.postStatus === "submitted"
          ? "기록 수정 · 리포트 다시 확인"
          : "기록 저장 · 리포트 확인";
      }
      syncInteractionState();
    }

    function renderReportPanel(data) {
      if (data.mode !== "post") {
        reportPanel.classList.add("hidden");
        reportPanel.innerHTML = "";
        return;
      }
      const report = data.report || {};
      const status = String(report.status || "");
      const sent = Boolean(report.sent) || status === "sent";
      const approved = ["approved", "queued"].includes(status);
      const processing = status === "processing";
      const ready = Boolean(report.url);
      const submitted = data.postStatus === "submitted" || Boolean(report.postSubmitted);
      if (!submitted) {
        reportPanel.classList.add("hidden");
        reportPanel.innerHTML = "";
        return;
      }
      const canEditReport = ready && !sent && report.canEdit !== false;
      const previewUrl = ready ? cacheBustedUrl(report.canonicalUrl || report.url) : "";
      const message = ready
        ? sent
          ? "회원 리포트 알림톡 발송이 완료되었습니다. 발송 후에는 기록을 수정할 수 없습니다."
          : processing
            ? "회원 리포트 알림톡을 발송하고 있습니다. 처리 결과가 확인될 때까지 잠시 기다려 주세요."
          : approved
            ? "승인이 반영되었습니다. 발송 전 수정하면 기존 발송 후보를 보류하고 다시 승인해 주세요."
            : "오늘 기록이 반영된 최종 리포트입니다. 문장을 확인한 뒤 한 번에 발송해 주세요."
        : submitted
          ? "리포트를 자동으로 준비하고 있습니다. 지연될 때만 다시 생성을 눌러 주세요."
          : "수업 후 기록 제출 후 회원용 리포트가 생성됩니다.";
      reportPanel.classList.remove("hidden");
      reportPanel.innerHTML = `
        <h2>회원용 리포트</h2>
        <p>${escapeHtml(message)}</p>
        ${canEditReport ? reportEditHtml(report) : ""}
        ${ready ? `<iframe class="report-frame" title="회원용 리포트 미리보기" src="${escapeAttr(previewUrl)}"></iframe>` : ""}
        <div class="button-row">
          ${!ready ? `<button type="button" data-convert-report ${sent || processing ? "disabled" : ""}>리포트 생성 다시 시도</button>` : ""}
          ${ready ? `<button class="secondary" type="button" data-open-report>리포트 새 창으로 보기</button>` : `<button class="secondary" type="button" data-refresh-report>리포트 상태 새로고침</button>`}
          ${ready ? `<button type="button" data-approve-report>${sent ? "발송 완료" : processing ? "발송 처리 중" : approved ? "발송 대기 중" : "검토 완료 · 회원에게 발송"}</button>` : ""}
        </div>`;
      const convertButton = reportPanel.querySelector("[data-convert-report]");
      if (convertButton && !sent) convertButton.addEventListener("click", convertReport);
      const openButton = reportPanel.querySelector("[data-open-report]");
      if (openButton) openButton.addEventListener("click", () => window.open(report.url, "_blank", "noopener"));
      const refreshButton = reportPanel.querySelector("[data-refresh-report]");
      if (refreshButton) refreshButton.addEventListener("click", refreshReport);
      const approveButton = reportPanel.querySelector("[data-approve-report]");
      if (approveButton) approveButton.addEventListener("click", approveReport);
      reportPanel.querySelectorAll("#reportSummaryEdit, #reportNextDirectionEdit").forEach((input) => {
        input.addEventListener("input", syncInteractionState);
      });
      syncInteractionState();
    }

    function reportEditHtml(report) {
      return `<div class="report-edit">
        <label>오늘의 핵심
          <textarea id="reportSummaryEdit" maxlength="900" placeholder="회원에게 보이는 리포트 첫 문장입니다.">${escapeHtml(report.summary || "")}</textarea>
        </label>
        <label>다음 수업 방향
          <textarea id="reportNextDirectionEdit" class="report-next-direction" maxlength="1200" placeholder="회원에게 보이는 다음 수업 방향입니다.">${escapeHtml(report.nextDirection || "")}</textarea>
        </label>
      </div>`;
    }

    function reportTextChanged() {
      const report = state.data?.report || {};
      const summaryInput = reportPanel.querySelector("#reportSummaryEdit");
      const nextInput = reportPanel.querySelector("#reportNextDirectionEdit");
      if (!summaryInput && !nextInput) return false;
      return (
        String(summaryInput?.value || "").trim() !== String(report.summary || "").trim() ||
        String(nextInput?.value || "").trim() !== String(report.nextDirection || "").trim()
      );
    }

    function syncInteractionState() {
      const report = state.data?.report || {};
      const status = String(report.status || "");
      const sent = Boolean(state.data?.locked || report.sent || status === "sent");
      const processing = status === "processing";
      const awaitingSend = ["approved", "queued"].includes(status);
      const busy = state.loading || state.uploading > 0;
      submitButton.disabled = sent || busy;
      const mediaInput = mediaPanel.querySelector("#mediaFiles");
      if (mediaInput) mediaInput.disabled = sent || processing || busy;
      reportPanel.querySelectorAll("#reportSummaryEdit, #reportNextDirectionEdit").forEach((input) => {
        input.disabled = sent || processing || busy;
      });
      const convertButton = reportPanel.querySelector("[data-convert-report]");
      if (convertButton) convertButton.disabled = sent || processing || busy;
      const approveButton = reportPanel.querySelector("[data-approve-report]");
      if (!approveButton) return;
      const changed = reportTextChanged();
      approveButton.disabled = sent || processing || busy || (awaitingSend && !changed);
      approveButton.textContent = sent
        ? "발송 완료"
        : processing
          ? "발송 처리 중"
          : state.uploading > 0
            ? "첨부 완료 대기"
            : awaitingSend
              ? changed ? "수정 저장 · 다시 승인" : "발송 대기 중"
              : "검토 완료 · 회원에게 발송";
    }

    function renderMediaPanel(data) {
      if (data.mode !== "post") {
        mediaPanel.classList.add("hidden");
        mediaPanel.innerHTML = "";
        return;
      }
      const files = Array.isArray(data.media?.files) ? data.media.files : [];
      mediaPanel.classList.remove("hidden");
      mediaPanel.innerHTML = `
        <details class="optional-details" ${state.focus === "media" ? "open" : ""}>
          <summary>사진·영상 첨부</summary>
          <div class="media-upload-content">
            <p>회원 리포트에 넣을 파일만 선택해 주세요.</p>
            <label class="media-input">
              <span>사진/영상 선택</span>
              <input type="file" id="mediaFiles" accept="image/*,video/*" multiple ${data.locked ? "disabled" : ""}>
            </label>
            <div id="mediaUploadQueue" class="media-list"></div>
            <div class="media-list">
              ${files.length ? files.map(mediaFileHtml).join("") : `<div class="media-file">아직 업로드된 사진/영상이 없습니다.</div>`}
            </div>
            ${data.media?.sessionFolderUrl ? `<a href="${escapeAttr(data.media.sessionFolderUrl)}" target="_blank" rel="noopener">Drive 폴더 열기</a>` : ""}
          </div>
        </details>
      `;
      const input = mediaPanel.querySelector("#mediaFiles");
      if (input) input.addEventListener("change", handleMediaFiles);
    }

    function focusMediaUploadPanelIfRequested() {
      if (state.mediaFocusHandled || state.mode !== "post" || state.focus !== "media") return;
      state.mediaFocusHandled = true;
      requestAnimationFrame(() => {
        mediaPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        const selector = mediaPanel.querySelector("#mediaFiles");
        if (selector) selector.focus({ preventScroll: true });
        setStatus("사진/영상 선택 버튼을 눌러 휴대폰 앨범에서 파일을 선택해 주세요.", false);
      });
    }

    function focusReportPanelIfRequested() {
      if (state.reportFocusHandled || state.focus !== "report" || reportPanel.classList.contains("hidden")) return;
      state.reportFocusHandled = true;
      requestAnimationFrame(() => {
        reportPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        const heading = reportPanel.querySelector("h2");
        if (heading) {
          heading.tabIndex = -1;
          heading.focus({ preventScroll: true });
        }
      });
    }

    function mediaFileHtml(file) {
      const kind = String(file.mimeType || "").startsWith("video/") ? "영상" : "사진";
      return `<div class="media-file"><strong>${escapeHtml(kind)} · ${escapeHtml(file.fileName || "파일")}</strong>` +
        `<span>${formatBytes(Number(file.size || 0))} · 리포트 자동 포함</span>` +
        `<a href="${escapeAttr(file.driveUrl || file.previewUrl || "#")}" target="_blank" rel="noopener">Drive에서 보기</a></div>`;
    }

    async function handleMediaFiles(event) {
      const files = Array.from(event.target.files || []);
      event.target.value = "";
      if (!files.length) return;
      for (const file of files) {
        try {
          await uploadMediaFile(file);
        } catch (error) {
          setStatus(error.message || String(error), true);
        }
      }
      await refreshReport();
    }

    async function uploadMediaFile(file) {
      const queue = mediaPanel.querySelector("#mediaUploadQueue");
      const item = document.createElement("div");
      item.className = "media-file";
      item.innerHTML = `<strong>${escapeHtml(file.name)}</strong><span>업로드 준비 중</span><progress max="100" value="0"></progress>`;
      queue.prepend(item);
      const label = item.querySelector("span");
      const progress = item.querySelector("progress");
      state.uploading += 1;
      submitButton.disabled = true;
      syncInteractionState();
      try {
        if (!/^image\/|^video\//.test(file.type || "")) throw new Error("사진 또는 영상 파일만 업로드할 수 있습니다.");
        const init = await postJson({
          action: "initMediaUpload",
          requestId: state.requestId,
          token: state.token,
          fileName: file.name,
          mimeType: file.type,
          size: file.size,
        });
        const chunkSize = Number(init.chunkSize || 16 * 1024 * 1024);
        if (init.directUpload?.uploadUrl) {
          try {
            await uploadMediaFileDirect(file, init, chunkSize, label, progress);
            label.textContent = "업로드 완료 · 리포트 자동 포함";
            return;
          } catch (error) {
            if (progress.value > 0) throw error;
            label.textContent = "직접 업로드 실패 · 안전 경로로 재시도 중";
          }
        }
        await uploadMediaFileViaFunction(file, init, chunkSize, label, progress);
        label.textContent = "업로드 완료 · 리포트 자동 포함";
      } catch (error) {
        label.textContent = error.message || String(error);
        item.classList.add("error");
        throw error;
      } finally {
        state.uploading = Math.max(0, state.uploading - 1);
        if (!state.loading && state.uploading === 0 && !state.data?.locked) {
          submitButton.disabled = false;
        }
        syncInteractionState();
      }
    }

    async function uploadMediaFileDirect(file, init, chunkSize, label, progress) {
      let offset = 0;
      let finalDriveFile = null;
      while (offset < file.size) {
        const endExclusive = Math.min(offset + chunkSize, file.size);
        const chunk = file.slice(offset, endExclusive);
        const response = await fetch(init.directUpload.uploadUrl, {
          method: "PUT",
          headers: {
            "Content-Type": file.type,
            "Content-Range": `bytes ${offset}-${endExclusive - 1}/${file.size}`,
          },
          body: chunk,
        });
        if (response.status === 308) {
          const range = response.headers.get("range") || "";
          const match = range.match(/bytes=0-(\d+)/i);
          offset = match ? Number(match[1]) + 1 : endExclusive;
          progress.value = Math.round((offset / file.size) * 100);
          label.textContent = `Drive 직접 업로드 중 ${progress.value}%`;
          continue;
        }
        const text = await response.text();
        const json = text ? JSON.parse(text) : {};
        if (!response.ok || !json.id) {
          throw new Error(json?.error?.message || `Drive 직접 업로드 실패 ${response.status}`);
        }
        finalDriveFile = json;
        offset = file.size;
        progress.value = 100;
      }
      await postJson({
        action: "completeMediaUpload",
        requestId: state.requestId,
        token: state.token,
        uploadId: init.uploadId,
        driveFile: finalDriveFile,
      });
    }

    async function uploadMediaFileViaFunction(file, init, chunkSize, label, progress) {
        let offset = 0;
        while (offset < file.size) {
          const endExclusive = Math.min(offset + chunkSize, file.size);
          const chunk = file.slice(offset, endExclusive);
          const chunkBase64 = await blobToBase64(chunk);
          const result = await postJson({
            action: "uploadMediaChunk",
            requestId: state.requestId,
            token: state.token,
            uploadId: init.uploadId,
            start: offset,
            end: endExclusive - 1,
            total: file.size,
            chunkBase64,
          });
          offset = Number(result.bytesUploaded || endExclusive);
          progress.value = Math.round((offset / file.size) * 100);
          label.textContent = `업로드 중 ${progress.value}%`;
        }
    }

    function intakeHtml(intake) {
      if (!intake) return `<h2>사전설문 요약</h2><p>연결된 사전설문이 없습니다.</p>`;
      const rows = [
        ["목표", intake.goal],
        ["신경 부위", intake.focusArea],
        ["운동 수준", intake.exerciseLevel],
        ["기대/중요 요소", intake.expectationOrImportantFactor],
        ["생활/이전 이슈", intake.lifestyleOrPreviousIssue],
        ["주의", intake.painOrMedicalNote ? "상세 내용은 강사용 기록에서 확인" : "특별 주의 내용 없음"],
      ];
      return `<h2>사전설문 요약</h2><dl>${rows.map(([k, v]) => `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v || "-")}</dd></div>`).join("")}</dl>`;
    }

    function previousReportHtml(report) {
      if (!report) {
        return `<div class="previous-report"><h2>직전회차 리포트</h2><p>아직 연결된 직전회차 리포트가 없습니다.</p></div>`;
      }
      const lessonText = [report.sessionNumber ? `${Number(report.sessionNumber)}회차` : "", report.lessonTime || report.lessonDate || ""].filter(Boolean).join(" · ");
      const rows = [
        ["회차", lessonText || "-"],
        ["오늘의 핵심", report.summary || "-"],
        ["다음 수업 방향", report.nextDirection || "-"],
        ["홈워크", report.homework || "-"],
      ];
      return `<div class="previous-report"><h2>직전회차 리포트 참고</h2><dl>${rows.map(([k, v]) => `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v || "-")}</dd></div>`).join("")}</dl>${report.url ? `<p><a href="${escapeAttr(report.url)}" target="_blank" rel="noopener">직전 리포트 열기</a></p>` : ""}</div>`;
    }

    function renderWorkflowSteps(data) {
      const report = data.report || {};
      const reportStatus = String(report.status || report.approval?.status || "");
      const sent = Boolean(report.sent) || reportStatus === "sent";
      const reportReady = Boolean(report.url);
      const postSubmitted = data.postStatus === "submitted" || Boolean(report.postSubmitted);
      const activeIndex = sent ? 2 : reportReady || postSubmitted ? 1 : 0;
      const labels = ["오늘 기록", "확인 후 발송", "전달 완료"];
      workflowSteps.innerHTML = labels
        .map((label, index) => `<span class="workflow-step ${index < activeIndex ? "done" : index === activeIndex ? "active" : ""}">${escapeHtml(label)}</span>`)
        .join("");
    }

    function fieldHtml(field) {
      if (field.type === "text") {
        const required = field.required ? "required" : "";
        const placeholder = field.placeholder || "필요할 때만 입력";
        const helpText = field.help || (field.required ? "회원 리포트의 다음 수업 방향 원문으로 사용됩니다." : "");
        const help = helpText ? `<p class="field-help">${escapeHtml(helpText)}</p>` : "";
        return `<section data-field-key="${escapeAttr(field.key)}"><label for="${field.key}"><h2>${escapeHtml(field.label)}</h2></label>${help}<textarea id="${field.key}" name="${field.key}" ${required} aria-describedby="status" placeholder="${escapeAttr(placeholder)}"></textarea></section>`;
      }
      if (field.type === "groupedMulti") {
        const groups = field.groups.map((group) => `
          <div class="purpose-group">
            <p class="purpose-title">${escapeHtml(group.label)}</p>
            <div class="choices">${group.options.map((option) => choiceInputHtml(field.key, "checkbox", option)).join("")}</div>
          </div>`).join("");
        return `<fieldset class="field-group" data-field-key="${escapeAttr(field.key)}" tabindex="-1" aria-describedby="status"><legend>${escapeHtml(field.label)}</legend><div class="purpose-groups">${groups}
          <div class="purpose-group">
            <p class="purpose-title">기타</p>
            <div class="choices">${choiceInputHtml(field.key, "checkbox", "기타")}</div>
            ${otherAnswerHtml(field.key)}
          </div>
        </div></fieldset>`;
      }
      const inputType = field.type === "single" ? "radio" : "checkbox";
      return `<fieldset class="field-group" data-field-key="${escapeAttr(field.key)}" tabindex="-1" aria-describedby="status"><legend>${escapeHtml(field.label)}</legend><div class="choices">${withOtherChoice(field.options).map((option) => choiceInputHtml(field.key, inputType, option)).join("")}</div>${otherAnswerHtml(field.key)}</fieldset>`;
    }

    function choiceInputHtml(fieldKey, inputType, option) {
      return `
        <label class="choice">
          <input type="${inputType}" name="${fieldKey}" value="${escapeAttr(option)}" ${isOtherChoice(option) ? 'data-other-trigger="1"' : ''}>
          <span>${escapeHtml(option)}</span>
        </label>`;
    }

    function otherAnswerHtml(fieldKey) {
      return `<div class="other-answer" data-other-for="${escapeAttr(fieldKey)}" hidden><textarea name="${escapeAttr(fieldKey)}Other" maxlength="500" placeholder="기타 내용을 적어주세요"></textarea></div>`;
    }

    function withOtherChoice(options) {
      const values = Array.isArray(options) ? options.map(String) : [];
      return [...values.filter((value) => !isOtherChoice(value)), "기타"];
    }

    function isOtherChoice(value) {
      return String(value || "").trim() === "기타";
    }

    function isStoredOtherValue(value) {
      const text = String(value || "").trim();
      return text === "기타" || text.startsWith("기타:");
    }

    function setOtherAnswerText(fieldKey, value) {
      const textarea = form.elements[`${fieldKey}Other`];
      if (!textarea) return;
      textarea.value = String(value || "").replace(/^기타:?\s*/, "");
    }

    function expandLegacyChoiceValue(fieldKey, value) {
      if (fieldKey === "focusAreas" && value === "목/어깨") return ["목", "어깨"];
      if (fieldKey === "goals" && value === "목/어깨 긴장 완화") return ["목 긴장 완화", "어깨 긴장 완화"];
      return [value];
    }

    function normalizeChoiceValue(fieldKey, value) {
      if (!isOtherChoice(value)) return value;
      const text = String(form.elements[`${fieldKey}Other`]?.value || "").trim();
      return text ? `기타: ${text}` : "기타";
    }

    function syncOtherAnswers() {
      form.querySelectorAll("[data-other-for]").forEach((wrap) => {
        const fieldKey = wrap.getAttribute("data-other-for");
        const selected = Boolean(form.querySelector(`input[name="${fieldKey}"][data-other-trigger="1"]:checked`));
        wrap.hidden = !selected;
        if (!selected) {
          const textarea = wrap.querySelector("textarea");
          if (textarea) textarea.value = "";
        }
      });
    }

    function validateOtherAnswers(fields) {
      for (const field of fields) {
        if (field.type === "text") continue;
        const selected = form.querySelector(`input[name="${field.key}"][data-other-trigger="1"]:checked`);
        const text = String(form.elements[`${field.key}Other`]?.value || "").trim();
        if (selected && !text) throw fieldValidationError(`${field.label}의 기타 내용을 적어주세요.`, field.key);
      }
    }

    async function submit(event) {
      event.preventDefault();
      if (state.loading) return;
      if (state.data?.locked) {
        setStatus("회원 리포트 알림톡 발송이 완료되어 기록을 수정할 수 없습니다.", true);
        return;
      }
      state.loading = true;
      submitButton.disabled = true;
      syncInteractionState();
      setStatus("제출 중입니다.", false);
      try {
        if (state.uploading > 0) throw new Error("사진/영상 업로드가 끝난 뒤 제출해 주세요.");
        const activeFields = [...postFields, ...optionalPostFields];
        validateOtherAnswers(activeFields);
        const answers = readAnswers(new FormData(form), activeFields);
        validateRequiredAnswers(answers, activeFields);
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, mode: state.mode, answers }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "제출에 실패했습니다.");
        setStatus("기록을 저장했습니다. 아래 리포트를 확인해 주세요.", false);
        submitButton.textContent = "제출 완료";
        await refreshReport();
        if (!state.data?.locked) {
          submitButton.disabled = false;
          submitButton.textContent = "기록 수정 · 리포트 다시 확인";
        }
        reportPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        state.loading = false;
        syncInteractionState();
      } catch (error) {
        state.loading = false;
        submitButton.disabled = false;
        setStatus(error.message || String(error), true);
        focusInvalidField(error.fieldKey);
        syncInteractionState();
      }
    }

    async function refreshReport() {
      const res = await fetch(`${apiBase}?r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&mode=${state.mode}`);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "리포트 상태를 불러오지 못했습니다.");
      state.data = data;
      renderWorkflowSteps(data);
      renderMediaPanel(data);
      renderReportPanel(data);
      applyLockedState(data);
      syncInteractionState();
      focusReportPanelIfRequested();
      return data;
    }

    async function postJson(payload) {
      const res = await fetch(apiBase, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "요청 처리에 실패했습니다.");
      return data;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || "").split(",")[1] || "");
        reader.onerror = () => reject(reader.error || new Error("파일을 읽지 못했습니다."));
        reader.readAsDataURL(blob);
      });
    }

    function formatBytes(value) {
      if (!value) return "크기 미상";
      if (value < 1024 * 1024) return `${Math.round(value / 1024)}KB`;
      return `${(value / 1024 / 1024).toFixed(1)}MB`;
    }

    async function convertReport() {
      if (state.loading) return;
      if (state.uploading > 0) {
        setStatus("사진/영상 업로드가 끝난 뒤 리포트를 다시 생성해 주세요.", true);
        return;
      }
      state.loading = true;
      syncInteractionState();
      setStatus("회원용 리포트 변환 요청 중입니다.", false);
      const button = reportPanel.querySelector("[data-convert-report]");
      if (button) button.disabled = true;
      try {
        const reportEdit = currentReportEditPayload();
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, action: "convertReport", ...reportEdit }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "리포트 변환 요청에 실패했습니다.");
        setStatus(data.message || "리포트 변환 요청이 등록되었습니다.", false);
        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;
        syncInteractionState();
      }
    }

    async function approveReport() {
      if (state.loading) return;
      if (state.uploading > 0) {
        setStatus("사진/영상 업로드가 끝난 뒤 회원 발송을 진행해 주세요.", true);
        return;
      }
      const currentStatus = String(state.data?.report?.status || "");
      if (["approved", "queued"].includes(currentStatus) && !reportTextChanged()) {
        setStatus("이미 발송 대기 중입니다. 문장을 수정한 경우에만 다시 승인할 수 있습니다.", false);
        return;
      }
      state.loading = true;
      syncInteractionState();
      setStatus("발송 승인 처리 중입니다.", false);
      const button = reportPanel.querySelector("[data-approve-report]");
      if (button) button.disabled = true;
      try {
        const { summary, nextDirection } = currentReportEditPayload({ requireFields: true });
        if (reportTextChanged()) {
          await postJson({
            requestId: state.requestId,
            token: state.token,
            action: "editReport",
            summary,
            nextDirection,
          });
        }
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, action: "approveReport" }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "승인 처리에 실패했습니다.");
        setStatus(data.message || "검토한 리포트를 발송 대기열에 등록했습니다.", false);
        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;
        syncInteractionState();
      }
    }

    function currentReportEditPayload(options = {}) {
      const summaryInput = reportPanel.querySelector("#reportSummaryEdit");
      const nextDirectionInput = reportPanel.querySelector("#reportNextDirectionEdit");
      if (!summaryInput && !nextDirectionInput) return {};
      const summary = String(summaryInput?.value || "").trim();
      const nextDirection = String(nextDirectionInput?.value || "").trim();
      if (options.requireFields || summary || nextDirection) {
        if (!summary) throw new Error("오늘의 핵심 문장을 입력해 주세요.");
        if (!nextDirection) throw new Error("다음 수업 방향 문장을 입력해 주세요.");
      }
      return summary || nextDirection ? { summary, nextDirection } : {};
    }

    function readAnswers(formData, activeFields = [...postFields, ...optionalPostFields]) {
      const answers = {};
      for (const field of activeFields) {
        if (field.type === "multi" || field.type === "groupedMulti") answers[field.key] = formData.getAll(field.key).map(String).map((value) => normalizeChoiceValue(field.key, value));
        if (field.type === "single") answers[field.key] = normalizeChoiceValue(field.key, String(formData.get(field.key) || ""));
        if (field.type === "text") answers[field.key] = String(formData.get(field.key) || "");
      }
      return answers;
    }

    function validateRequiredAnswers(answers, activeFields) {
      const messages = {
        focusAreas: "진행 부위를 선택해 주세요.",
        changes: "확인한 변화를 선택해 주세요.",
        nextDirection: "다음 방향을 입력해 주세요.",
      };
      for (const field of activeFields.filter((item) => item.required)) {
        const value = answers[field.key];
        const hasValue = Array.isArray(value) ? value.length > 0 : Boolean(String(value || "").trim());
        if (!hasValue) throw fieldValidationError(messages[field.key] || `${field.label}을 입력해 주세요.`, field.key);
      }
    }

    function fieldValidationError(message, fieldKey) {
      const error = new Error(message);
      error.fieldKey = fieldKey;
      return error;
    }

    function focusInvalidField(fieldKey) {
      if (!fieldKey) return;
      const target = form.querySelector(`[data-field-key="${CSS.escape(String(fieldKey))}"]`);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      const focusTarget = target.matches("fieldset") ? target : target.querySelector("textarea, input") || target;
      focusTarget.focus({ preventScroll: true });
    }

    function cacheBustedUrl(url) {
      if (!url) return "";
      const joiner = String(url).includes("?") ? "&" : "?";
      return `${url}${joiner}preview=${Date.now()}`;
    }

    function setStatus(message, error) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(error));
      statusEl.setAttribute("role", error ? "alert" : "status");
      statusEl.setAttribute("aria-live", error ? "assertive" : "polite");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
