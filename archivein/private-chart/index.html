<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCHIVE PILATES Private Chart</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f2;
      --surface: #fffdfa;
      --line: #ded8d0;
      --text: #201d19;
      --muted: #6f675f;
      --soft: #ece7df;
      --accent: #4f5b4a;
      --accent-weak: #e5eadf;
      --danger: #8b4a3b;
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    .meta {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .workflow-steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 16px;
    }

    .workflow-step {
      min-width: 0;
      padding: 8px 4px;
      color: var(--muted);
      border-top: 2px solid var(--line);
      font-size: 11px;
      font-weight: 750;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .workflow-step.done {
      color: var(--accent);
      border-color: var(--accent);
    }

    .workflow-step.active {
      color: var(--text);
      border-color: var(--text);
    }

    .summary {
      display: grid;
      gap: 8px;
      margin: 18px 0;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .summary dl {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .summary div {
      display: grid;
      gap: 3px;
    }

    .summary dt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary dd {
      margin: 0;
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .previous-report {
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .previous-report p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .previous-report a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .grid {
      display: grid;
      gap: 8px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text);
    }

    .choice input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .choice:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-weak);
    }

    .other-answer {
      width: 100%;
      display: grid;
      gap: 6px;
      margin-top: 2px;
    }

    .other-answer[hidden] {
      display: none;
    }

    .other-answer textarea {
      min-height: 86px;
      background: #fff;
    }

    .purpose-groups {
      display: grid;
      gap: 12px;
    }

    .purpose-group {
      padding: 12px;
      background: color-mix(in srgb, var(--surface) 82%, var(--bg));
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .purpose-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
      word-break: keep-all;
    }

    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    .report-panel {
      display: grid;
      gap: 12px;
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .report-panel h2 {
      margin-bottom: 0;
    }

    .report-panel p {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .report-frame {
      width: 100%;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }

    .report-edit {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 72%, var(--bg));
    }

    .report-edit label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .report-edit textarea {
      min-height: 90px;
      background: #fff;
      color: var(--text);
      font-weight: 500;
    }

    .report-edit .report-next-direction {
      min-height: 128px;
    }

    .media-upload-panel {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .media-upload-panel h2 {
      margin-bottom: 0;
    }

    .media-upload-panel p,
    .media-file {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .media-input {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--accent-weak);
    }

    .media-input input {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .media-list {
      display: grid;
      gap: 8px;
    }

    .media-file {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .media-file a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    progress {
      width: 100%;
      height: 8px;
      accent-color: var(--accent);
    }

    .button-row {
      display: grid;
      gap: 8px;
    }

    .secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .locked-note {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--accent-weak);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .actions {
      position: sticky;
      bottom: 0;
      margin: 24px 0 0;
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: var(--radius);
      background: var(--text);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 640px) {
      main {
        padding: 28px 22px 56px;
      }

      .summary dl {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">ARCHIVE PILATES</p>
      <h1 id="title">프라이빗 차트 작성</h1>
      <div class="meta" id="meta">차트 정보를 불러오는 중입니다.</div>
      <div class="workflow-steps" id="workflowSteps" aria-label="프라이빗 기록 진행 단계"></div>
    </header>

    <div class="summary" id="summary" aria-live="polite"></div>

    <form id="form" class="hidden">
      <div id="sections"></div>
      <div id="mediaPanel" class="media-upload-panel hidden"></div>
      <p class="status" id="status"></p>
      <div class="actions">
        <button type="submit" id="submitButton">제출</button>
      </div>
      <div id="reportPanel" class="report-panel hidden" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = {
      requestId: params.get("r") || "",
      token: params.get("t") || "",
      mode: params.get("mode") === "post" ? "post" : "pre",
      focus: params.get("focus") || "",
      mediaFocusHandled: false,
      loading: false,
      uploading: 0,
      data: null,
    };
    const apiBase = window.location.pathname.startsWith("/archivein/")
      ? "/archivein/api/privateChart"
      : "/api/privateChart";

    const sets = {
      goals: ["코어 안정성", "골반 정렬", "흉곽/호흡", "목 긴장 완화", "어깨 긴장 완화", "허리 안정화", "하지 정렬", "유연성", "체력/근지구력", "밸런스", "통증 관리"],
      focusAreas: ["목", "어깨", "흉곽", "허리", "골반", "복부", "둔부", "고관절", "하체", "발/발목", "전신"],
      equipment: ["리포머", "캐딜락", "체어", "바렐", "매트", "소도구", "미정"],
      cautions: ["통증 확인 필요", "강도 낮게 시작", "호흡 먼저 체크", "좌우 차이 확인", "피로도 확인", "관절 가동범위 확인", "특별 주의 없음"],
      changes: ["정렬 인지 향상", "호흡 연결 개선", "코어 연결감 향상", "불필요한 긴장 감소", "좌우 차이 남아있음", "가동범위 향상", "불편감 완화", "강도 적절", "피로 누적", "컨트롤 보완 필요", "편안하게 수업 진행", "큰 변화보다 유지에 집중"],
    };

    const preFields = [
      { type: "multi", key: "goals", label: "오늘의 수업 목표", options: sets.goals, required: true },
      { type: "multi", key: "focusAreas", label: "집중 부위", options: sets.focusAreas, required: true },
      { type: "multi", key: "equipment", label: "예정 기구", options: sets.equipment },
      { type: "multi", key: "cautions", label: "수업 전 체크", options: sets.cautions },
      { type: "text", key: "memo", label: "계획 메모" },
    ];

    const postFields = [
      { type: "single", key: "attendance", label: "출결", options: ["출석", "지각", "당일 취소", "결석"], required: true },
      { type: "single", key: "condition", label: "오늘 몸 상태", options: ["편안하게 시작", "보통", "피로감 있어 조절", "불편감 확인 필요", "집중 유지 어려움"], required: true },
      { type: "single", key: "painChange", label: "불편감 흐름", options: ["특이 없음", "기존 불편감 유지", "부담 감소", "부담 증가로 주의", "새 불편감 체크"] },
      { type: "multi", key: "focusAreas", label: "진행 부위", options: sets.focusAreas },
      { type: "multi", key: "equipment", label: "사용 기구", options: sets.equipment },
      { type: "multi", key: "changes", label: "오늘 확인한 변화", options: sets.changes, required: true },
      { type: "text", key: "summaryKeywords", label: "오늘의 핵심 키워드", placeholder: "회원 리포트의 오늘의 핵심 문장에 꼭 들어가야 할 키워드를 적어주세요. 예: 흉곽 움직임, 코어 연결", help: "작성하면 회원 리포트의 오늘의 핵심 문장에 자연스럽게 반영됩니다." },
      { type: "text", key: "nextDirectionKeywords", label: "다음 수업 방향 키워드", placeholder: "회원 리포트의 다음 수업 방향 문장에 꼭 들어가야 할 키워드를 적어주세요. 예: 호흡-흉곽 연계, 고관절 안정화", help: "작성하면 회원 리포트의 다음 수업 방향 문장에 자연스럽게 반영됩니다." },
      { type: "text", key: "homework", label: "홈워크", placeholder: "숙제가 있을 때만 입력해 주세요. 예: 자기 전 3분 흉곽 호흡, 벽 기대어 어깨 긴장 풀기", help: "작성한 내용은 회원 리포트의 홈워크 섹션에 표시됩니다." },
      { type: "text", key: "nextMemo", label: "다음 수업 준비 메모", placeholder: "필요한 경우에만 내부 참고사항을 적어주세요.", help: "회원에게는 노출되지 않습니다." },
    ];

    const title = document.getElementById("title");
    const meta = document.getElementById("meta");
    const workflowSteps = document.getElementById("workflowSteps");
    const summary = document.getElementById("summary");
    const form = document.getElementById("form");
    const sections = document.getElementById("sections");
    const mediaPanel = document.getElementById("mediaPanel");
    const reportPanel = document.getElementById("reportPanel");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    boot();

    async function boot() {
      try {
        if (!state.requestId || !state.token) throw new Error("차트 링크 정보가 부족합니다.");
        const res = await fetch(`${apiBase}?r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&mode=${state.mode}`);
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "차트 정보를 불러오지 못했습니다.");
        }
        render(data);
      } catch (error) {
        meta.textContent = "";
        summary.innerHTML = "";
        setStatus(error.message || String(error), true);
      }
    }

    function render(data) {
      state.data = data;
      const isPost = data.mode === "post";
      title.textContent = isPost ? "수업 후 기록" : "수업 전 계획";
      submitButton.textContent = isPost ? "수업 후 기록 제출" : "수업 전 계획 제출";
      meta.innerHTML = [
        `<span>${escapeHtml(data.memberName || "-")}님 · ${Number(data.sessionNumber || 1)}회차</span>`,
        `<span>${escapeHtml(data.lessonTime || data.lessonDate || "-")} · 담당 ${escapeHtml(data.staffName || "미정")}</span>`,
      ].join("");
      renderWorkflowSteps(data);
      summary.innerHTML = [
        intakeHtml(data.intakeSummary),
        isPost ? "" : previousReportHtml(data.previousReport),
      ].filter(Boolean).join("");
      sections.innerHTML = (isPost ? postFields : preFields).map(fieldHtml).join("");
      renderMediaPanel(data);
      applyExistingAnswers(data);
      syncOtherAnswers();
      applyLockedState(data);
      renderReportPanel(data);
      form.classList.remove("hidden");
      form.addEventListener("submit", submit);
      if (!form.dataset.otherAnswerBound) {
        form.addEventListener("change", syncOtherAnswers);
        form.dataset.otherAnswerBound = "1";
      }
      focusMediaUploadPanelIfRequested();
    }

    function applyExistingAnswers(data) {
      const answers = data.mode === "post" ? data.existingAnswers?.post : data.existingAnswers?.pre;
      if (!answers || typeof answers !== "object") return;
      for (const [key, value] of Object.entries(answers)) {
        const values = (Array.isArray(value) ? value.map(String) : [String(value ?? "")]).flatMap((item) => expandLegacyChoiceValue(key, item));
        const field = form.elements[key];
        if (!field) continue;
        if (field instanceof RadioNodeList) {
          values.forEach((item) => {
            const input = Array.from(field).find((node) => node.value === item || (isStoredOtherValue(item) && isOtherChoice(node.value)));
            if (input) {
              input.checked = true;
              if (isStoredOtherValue(item)) setOtherAnswerText(key, item);
            }
          });
          if ("value" in field && values.length === 1 && !isStoredOtherValue(values[0])) field.value = values[0];
          continue;
        }
        if (field instanceof HTMLTextAreaElement || field instanceof HTMLInputElement) {
          field.value = values[0] || "";
        }
      }
    }

    function applyLockedState(data) {
      if (!data.locked) return;
      form.querySelectorAll("input, textarea").forEach((input) => {
        input.disabled = true;
      });
      submitButton.disabled = true;
      submitButton.textContent = "회원 리포트 발송 완료";
      const note = document.createElement("p");
      note.className = "locked-note";
      note.textContent = "회원 리포트 알림톡 발송이 완료되어 기록을 수정할 수 없습니다.";
      sections.after(note);
    }

    function renderReportPanel(data) {
      if (data.mode !== "post") {
        reportPanel.classList.add("hidden");
        reportPanel.innerHTML = "";
        return;
      }
      const report = data.report || {};
      const status = String(report.status || report.approval?.status || "");
      const sent = Boolean(report.sent) || status === "sent";
      const approved = ["approved", "queued"].includes(status);
      const ready = Boolean(report.url);
      const submitted = data.postStatus === "submitted" || Boolean(report.postSubmitted);
      const canEditReport = ready && !sent && report.canEdit !== false;
      const previewUrl = ready ? cacheBustedUrl(report.canonicalUrl || report.url) : "";
      const message = ready
        ? sent
          ? "회원 리포트 알림톡 발송이 완료되었습니다. 발송 후에는 기록을 수정할 수 없습니다."
          : approved
            ? "승인이 반영되었습니다. 발송 전 수정하면 기존 발송 후보를 보류하고 다시 승인해 주세요."
            : "수업 전/후 기록이 반영된 최종 리포트입니다. 내용을 확인한 뒤 발송 승인해 주세요."
        : submitted
          ? "리포트를 자동으로 준비하고 있습니다. 지연될 때만 다시 생성을 눌러 주세요."
          : "수업 후 기록 제출 후 회원용 리포트가 생성됩니다.";
      reportPanel.classList.remove("hidden");
      reportPanel.innerHTML = `
        <h2>회원용 리포트</h2>
        <p>${escapeHtml(message)}</p>
        ${ready ? `<iframe class="report-frame" title="회원용 리포트 미리보기" src="${escapeAttr(previewUrl)}"></iframe>` : ""}
        ${canEditReport ? reportEditHtml(report) : ""}
        <div class="button-row">
          ${submitted ? `<button class="${ready ? "secondary" : ""}" type="button" data-convert-report ${sent ? "disabled" : ""}>${ready ? "수정 내용으로 리포트 재생성" : "리포트 생성 다시 시도"}</button>` : ""}

    async function handleMediaFiles(event) {

      event.target.value = "";

      for (const file of files) {
        try {
          await uploadMediaFile(file);

    async function uploadMediaFile(file) {
      const queue = mediaPanel.querySelector("#mediaUploadQueue");
      const item = document.createElement("div");
      item.className = "media-file";
      item.innerHTML = `<strong>${escapeHtml(file.name)}</strong><span>업로드 준비 중</span><progress max="100" value="0"></progress>`;
      queue.prepend(item);
      const label = item.querySelector("span");
      const progress = item.querySelector("progress");
      state.uploading += 1;
      submitButton.disabled = true;
      try {
        if (!/^image\/|^video\//.test(file.type || "")) throw new Error("사진 또는 영상 파일만 업로드할 수 있습니다.");
        const init = await postJson({
          action: "initMediaUpload",
          requestId: state.requestId,
          token: state.token,
          fileName: file.name,
          mimeType: file.type,
          size: file.size,
        });
        const chunkSize = Number(init.chunkSize || 16 * 1024 * 1024);
        if (init.directUpload?.uploadUrl) {
          try {
            await uploadMediaFileDirect(file, init, chunkSize, label, progress);
            label.textContent = "업로드 완료 · 리포트 자동 포함";
            return;
          } catch (error) {
            if (progress.value > 0) throw error;
            label.textContent = "직접 업로드 실패 · 안전 경로로 재시도 중";
          }
        }
        await uploadMediaFileViaFunction(file, init, chunkSize, label, progress);
        label.textContent = "업로드 완료 · 리포트 자동 포함";
      } catch (error) {
        label.textContent = error.message || String(error);
        item.classList.add("error");
        throw error;
      } finally {
        state.uploading = Math.max(0, state.uploading - 1);
        if (!state.loading && state.uploading === 0 && !state.data?.locked) {
          submitButton.disabled = false;
        }
      }
    }

    async function uploadMediaFileDirect(file, init, chunkSize, label, progress) {
      let offset = 0;
      let finalDriveFile = null;
      while (offset < file.size) {
        const endExclusive = Math.min(offset + chunkSize, file.size);
        const chunk = file.slice(offset, endExclusive);
        const response = await fetch(init.directUpload.uploadUrl, {
          method: "PUT",
          headers: {
            "Content-Type": file.type,
            "Content-Range": `bytes ${offset}-${endExclusive - 1}/${file.size}`,
          },
          body: chunk,
        });
        if (response.status === 308) {
          const range = response.headers.get("range") || "";
          const match = range.match(/bytes=0-(\d+)/i);
          offset = match ? Number(match[1]) + 1 : endExclusive;
          progress.value = Math.round((offset / file.size) * 100);
          label.textContent = `Drive 직접 업로드 중 ${progress.value}%`;
          continue;
        }
        const text = await response.text();
        const json = text ? JSON.parse(text) : {};
        if (!response.ok || !json.id) {
          throw new Error(json?.error?.message || `Drive 직접 업로드 실패 ${response.status}`);
        }
        finalDriveFile = json;
        offset = file.size;
        progress.value = 100;
      }
      await postJson({
        action: "completeMediaUpload",
        requestId: state.requestId,
        token: state.token,
        uploadId: init.uploadId,
        driveFile: finalDriveFile,
      });
    }

    async function uploadMediaFileViaFunction(file, init, chunkSize, label, progress) {
        let offset = 0;
        while (offset < file.size) {
          const endExclusive = Math.min(offset + chunkSize, file.size);
          const chunk = file.slice(offset, endExclusive);
          const chunkBase64 = await blobToBase64(chunk);
          const result = await postJson({
            action: "uploadMediaChunk",
            requestId: state.requestId,
            token: state.token,
            uploadId: init.uploadId,
            start: offset,
            end: endExclusive - 1,
            total: file.size,
            chunkBase64,
          });
          offset = Number(result.bytesUploaded || endExclusive);
          progress.value = Math.round((offset / file.size) * 100);
          label.textContent = `업로드 중 ${progress.value}%`;
        }
    }

    function fieldHtml(field) {
      if (field.type === "text") {
        const required = field.required ? "required" : "";
        const placeholder = field.placeholder || "필요할 때만 입력";
        const helpText = field.help || (field.required ? "회원 리포트의 다음 수업 방향 원문으로 사용됩니다." : "");
        const help = helpText ? `<p class="field-help">${escapeHtml(helpText)}</p>` : "";
        return `<section><label for="${field.key}"><h2>${escapeHtml(field.label)}</h2></label>${help}<textarea id="${field.key}" name="${field.key}" ${required} placeholder="${escapeAttr(placeholder)}"></textarea></section>`;
      }
      if (field.type === "groupedMulti") {
        const groups = field.groups.map((group) => `
          <div class="purpose-group">
            <p class="purpose-title">${escapeHtml(group.label)}</p>
            <div class="choices">${group.options.map((option) => choiceInputHtml(field.key, "checkbox", option)).join("")}</div>
          </div>`).join("");
        return `<section><h2>${escapeHtml(field.label)}</h2><div class="purpose-groups">${groups}
          <div class="purpose-group">
            <p class="purpose-title">기타</p>

        </div></section>`;
      }
      const inputType = field.type === "single" ? "radio" : "checkbox";
      return `<section><h2>${escapeHtml(field.label)}</h2><div class="choices">${withOtherChoice(field.options).map((option) => choiceInputHtml(field.key, inputType, option)).join("")}</div>${otherAnswerHtml(field.key)}</section>`;
    }

    function choiceInputHtml(fieldKey, inputType, option) {
      return `
        <label class="choice">
          <input type="${inputType}" name="${fieldKey}" value="${escapeAttr(option)}" ${isOtherChoice(option) ? 'data-other-trigger="1"' : ''}>
          <span>${escapeHtml(option)}</span>
        </label>`;
    }

    function otherAnswerHtml(fieldKey) {
      return `<div class="other-answer" data-other-for="${escapeAttr(fieldKey)}" hidden><textarea name="${escapeAttr(fieldKey)}Other" maxlength="500" placeholder="기타 내용을 적어주세요"></textarea></div>`;
    }

    function withOtherChoice(options) {
      const values = Array.isArray(options) ? options.map(String) : [];
      return [...values.filter((value) => !isOtherChoice(value)), "기타"];
    }

    function isOtherChoice(value) {
      return String(value || "").trim() === "기타";
    }

    function isStoredOtherValue(value) {
      const text = String(value || "").trim();
      return text === "기타" || text.startsWith("기타:");
    }

    function setOtherAnswerText(fieldKey, value) {
      const textarea = form.elements[`${fieldKey}Other`];
      if (!textarea) return;
      textarea.value = String(value || "").replace(/^기타:?\s*/, "");
    }

    function expandLegacyChoiceValue(fieldKey, value) {
      if (fieldKey === "focusAreas" && value === "목/어깨") return ["목", "어깨"];
      if (fieldKey === "goals" && value === "목/어깨 긴장 완화") return ["목 긴장 완화", "어깨 긴장 완화"];
      return [value];
    }

    function normalizeChoiceValue(fieldKey, value) {
      if (!isOtherChoice(value)) return value;
      const text = String(form.elements[`${fieldKey}Other`]?.value || "").trim();
      return text ? `기타: ${text}` : "기타";
    }

    function syncOtherAnswers() {
      form.querySelectorAll("[data-other-for]").forEach((wrap) => {
        const fieldKey = wrap.getAttribute("data-other-for");
        const selected = Boolean(form.querySelector(`input[name="${fieldKey}"][data-other-trigger="1"]:checked`));
        wrap.hidden = !selected;
        if (!selected) {
          const textarea = wrap.querySelector("textarea");
          if (textarea) textarea.value = "";
        }
      });
    }

    function validateOtherAnswers(fields) {
      for (const field of fields) {
        if (field.type === "text") continue;
        const selected = form.querySelector(`input[name="${field.key}"][data-other-trigger="1"]:checked`);
        const text = String(form.elements[`${field.key}Other`]?.value || "").trim();
        if (selected && !text) throw new Error(`${field.label}의 기타 내용을 적어주세요.`);
      }
    }

    async function submit(event) {
      event.preventDefault();
      if (state.loading) return;
      if (state.data?.locked) {
        setStatus("회원 리포트 알림톡 발송이 완료되어 기록을 수정할 수 없습니다.", true);
        return;
      }
      state.loading = true;
      submitButton.disabled = true;
      setStatus("제출 중입니다.", false);
      try {
        if (state.uploading > 0) throw new Error("사진/영상 업로드가 끝난 뒤 제출해 주세요.");
        const activeFields = state.mode === "post" ? postFields : preFields;
        validateOtherAnswers(activeFields);
        const answers = readAnswers(new FormData(form), activeFields);
        validateRequiredAnswers(answers, activeFields);
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, mode: state.mode, answers }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "제출에 실패했습니다.");
        setStatus(state.mode === "post" ? "수업 후 기록을 저장했습니다. 리포트를 준비합니다." : "수업 전 계획을 저장했습니다.", false);
        submitButton.textContent = "제출 완료";
        if (state.mode === "post") await refreshReport();
        state.loading = false;
      } catch (error) {
        state.loading = false;
        submitButton.disabled = false;
        setStatus(error.message || String(error), true);
      }
    }

    async function refreshReport() {
      const res = await fetch(`${apiBase}?r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&mode=${state.mode}`);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "리포트 상태를 불러오지 못했습니다.");
      state.data = data;
      renderMediaPanel(data);
      renderReportPanel(data);
      return data;
    }

    async function postJson(payload) {
      const res = await fetch(apiBase, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "요청 처리에 실패했습니다.");
      return data;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || "").split(",")[1] || "");
        reader.onerror = () => reject(reader.error || new Error("파일을 읽지 못했습니다."));
        reader.readAsDataURL(blob);
      });
    }

    function formatBytes(value) {
      if (!value) return "크기 미상";
      if (value < 1024 * 1024) return `${Math.round(value / 1024)}KB`;
      return `${(value / 1024 / 1024).toFixed(1)}MB`;
    }

    async function convertReport() {
      if (state.loading) return;
      state.loading = true;
      setStatus("회원용 리포트 변환 요청 중입니다.", false);
      const button = reportPanel.querySelector("[data-convert-report]");
      if (button) button.disabled = true;
      try {
        const reportEdit = currentReportEditPayload();
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, action: "convertReport", ...reportEdit }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "리포트 변환 요청에 실패했습니다.");
        setStatus(data.message || "리포트 변환 요청이 등록되었습니다.", false);
        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;
      }
    }

    async function approveReport() {
      if (state.loading) return;
      state.loading = true;
      setStatus("발송 승인 처리 중입니다.", false);
      const button = reportPanel.querySelector("[data-approve-report]");

        const res = await fetch(apiBase, {

          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, action: "approveReport" }),
        });

        if (!res.ok || data.ok === false) throw new Error(data.error || "승인 처리에 실패했습니다.");

        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;

    }

    async function saveReportEdit() {
      if (state.loading) return;
      state.loading = true;
      setStatus("리포트 문장을 저장 중입니다.", false);
      const button = reportPanel.querySelector("[data-save-report-edit]");
      if (button) button.disabled = true;
      try {
        const { summary, nextDirection } = currentReportEditPayload({ requireFields: true });
        const data = await postJson({
          requestId: state.requestId,
          token: state.token,
          action: "editReport",
          summary,
          nextDirection,
        });
        setStatus(data.message || "리포트 문장을 저장했습니다.", false);
        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;
      }
    }

    function currentReportEditPayload(options = {}) {
      const summaryInput = reportPanel.querySelector("#reportSummaryEdit");
      const nextDirectionInput = reportPanel.querySelector("#reportNextDirectionEdit");
      if (!summaryInput && !nextDirectionInput) return {};
      const summary = String(summaryInput?.value || "").trim();
      const nextDirection = String(nextDirectionInput?.value || "").trim();
      if (options.requireFields || summary || nextDirection) {
        if (!summary) throw new Error("오늘의 핵심 문장을 입력해 주세요.");
        if (!nextDirection) throw new Error("다음 수업 방향 문장을 입력해 주세요.");
      }
      return summary || nextDirection ? { summary, nextDirection } : {};
    }

    function readAnswers(formData, activeFields = state.mode === "post" ? postFields : preFields) {
      const answers = {};
      for (const field of activeFields) {
        if (field.type === "multi" || field.type === "groupedMulti") answers[field.key] = formData.getAll(field.key).map(String).map((value) => normalizeChoiceValue(field.key, value));
        if (field.type === "single") answers[field.key] = normalizeChoiceValue(field.key, String(formData.get(field.key) || ""));
        if (field.type === "text") answers[field.key] = String(formData.get(field.key) || "");
      }
      return answers;
    }

    function validateRequiredAnswers(answers, activeFields) {
      for (const field of activeFields.filter((item) => item.required)) {
        const value = answers[field.key];
        const hasValue = Array.isArray(value) ? value.length > 0 : Boolean(String(value || "").trim());
        if (!hasValue) throw new Error(`${field.label}을 입력해 주세요.`);
      }
    }

    function cacheBustedUrl(url) {
      if (!url) return "";
      const joiner = String(url).includes("?") ? "&" : "?";
      return `${url}${joiner}preview=${Date.now()}`;
    }

    function setStatus(message, error) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(error));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
