<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCHIVE PILATES Private Chart</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f2;
      --surface: #fffdfa;
      --line: #ded8d0;
      --text: #201d19;
      --muted: #6f675f;
      --soft: #ece7df;
      --accent: #4f5b4a;
      --accent-weak: #e5eadf;
      --danger: #8b4a3b;
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    .meta {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      display: grid;
      gap: 8px;
      margin: 18px 0;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .summary dl {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .summary div {
      display: grid;
      gap: 3px;
    }

    .summary dt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary dd {
      margin: 0;
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .grid {
      display: grid;
      gap: 8px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text);
    }

    .choice input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .choice:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-weak);
    }

    .purpose-groups {
      display: grid;
      gap: 12px;
    }

    .purpose-group {
      padding: 12px;
      background: color-mix(in srgb, var(--surface) 82%, var(--bg));
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .purpose-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
      word-break: keep-all;
    }

    .field-help {
      margin: -4px 0 10px;
      color: var(--muted);
      font-size: 13px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    select,
    textarea {
      width: 100%;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    select {
      min-height: 48px;
      resize: none;
    }

    textarea {
      min-height: 104px;
    }

    .reference-panel {
      display: grid;
      gap: 12px;
      margin: 18px 0;
    }

    .reference-card {
      display: grid;
      gap: 10px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .reference-card h2,
    .reference-card h3 {
      margin: 0;
    }

    .reference-card h3 {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .reference-card p {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .reference-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .reference-list li {
      padding: 8px 10px;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 70%, var(--soft));
      font-size: 13px;
      color: var(--text);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .template-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 30px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--accent-weak);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--danger);
    }

    .report-panel {
      display: grid;
      gap: 12px;
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .report-panel h2 {
      margin-bottom: 0;
    }

    .report-panel p {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .report-frame {
      width: 100%;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }

    .media-upload-panel {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .media-upload-panel h2 {
      margin-bottom: 0;
    }

    .media-upload-panel p,
    .media-file {
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .media-input {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--accent-weak);
    }

    .media-input input {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .media-list {
      display: grid;
      gap: 8px;
    }

    .media-file {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .media-file a {
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    progress {
      width: 100%;
      height: 8px;
      accent-color: var(--accent);
    }

    .button-row {
      display: grid;
      gap: 8px;
    }

    .secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .locked-note {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--accent-weak);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    .actions {
      position: sticky;
      bottom: 0;
      margin: 24px -16px 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: var(--radius);
      background: var(--text);
      color: white;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 640px) {
      main {
        padding: 28px 22px 56px;
      }

      .summary dl {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">ARCHIVE PILATES</p>
      <h1 id="title">프라이빗 차트 작성</h1>
      <div class="meta" id="meta">차트 정보를 불러오는 중입니다.</div>
    </header>

    <div class="summary" id="summary" aria-live="polite"></div>
    <div class="reference-panel" id="referencePanel"></div>

    <form id="form" class="hidden">
      <div id="sections"></div>
      <div id="mediaPanel" class="media-upload-panel hidden"></div>
      <p class="status" id="status"></p>
      <div class="actions">
        <button type="submit" id="submitButton">제출</button>
      </div>
      <div id="reportPanel" class="report-panel hidden" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const state = {
      requestId: params.get("r") || "",
      token: params.get("t") || "",
      mode: params.get("mode") === "post" ? "post" : "pre",
      loading: false,
      uploading: 0,
      data: null,
      formBound: false,
    };
    const apiBase = window.location.pathname.startsWith("/archivein/")
      ? "/archivein/api/privateChart"
      : "/api/privateChart";

    const sets = {
      templateCodes: ["posture", "fitness", "recovery", "condition"],
      templateLabels: {
        posture: "체형교정/정렬",
        fitness: "다이어트/체력",
        recovery: "통증/회복",
        condition: "산전·산후/컨디션",
      },
      commonFocusAreas: ["목/어깨", "흉곽", "허리", "골반", "복부/코어", "둔부", "고관절", "하체", "발/발목", "전신"],
      commonEquipment: ["기본 계획대로", "리포머", "캐딜락", "체어", "바렐", "매트", "소도구", "현장 컨디션 보고 결정"],
      planBasis: ["회원 기본 템플릿대로 진행", "지난 수업 흐름 이어서 진행", "오늘 컨디션에 맞춰 일부 조정", "새로운 목표로 변경"],
      preCondition: ["특이사항 없음", "피로감 있어 강도 조절 필요", "불편감 확인 후 진행 필요", "호흡/긴장 먼저 체크 필요", "좌우 차이 확인 필요", "가동범위 확인 필요"],
      intensity: ["기본 강도 유지", "낮게 시작", "보통", "점진 상승", "컨디션 보고 조절"],
      sessionType: ["일반 진행 회차", "컨디션 조절 회차", "목표 전환 회차", "리뷰 회차"],
      planProgress: ["계획대로 진행", "일부 조정하여 진행", "회복 중심으로 전환", "강도 낮춰 진행", "강도 소폭 상승", "기구/구성 변경"],
      bodyResponse: ["편안하게 진행", "보통", "피로감 있어 조절", "불편감 확인하며 진행", "집중 유지가 다소 어려움", "적극적으로 잘 따라옴"],
      painChange: ["특이 없음", "기존 불편감 유지", "부담 감소", "부담 증가로 주의 필요", "새로운 불편감 체크 필요"],
      nextDirection: ["같은 흐름 유지", "강도 소폭 상승", "호흡/정렬 다시 체크", "회복 중심으로 진행", "불편감 확인 후 진행", "특정 부위 집중", "전신 연결로 확장", "직접 작성"],
      templates: {
        posture: {
          goals: ["자세/정렬", "골반/하지 정렬", "흉곽/호흡", "목/어깨 긴장 완화", "허리 안정화", "밸런스/컨트롤"],
          focusAreas: ["흉곽", "허리", "골반", "복부/코어", "고관절", "하체"],
          preChecks: ["오늘 볼 정렬", "좌우 차이", "호흡/흉곽", "골반/척추 포인트", "보상 움직임 가능성"],
          changes: ["정렬 인지 향상", "골반 중립 유지 향상", "흉곽 움직임 개선", "좌우 밸런스 개선", "하지 정렬 개선", "불필요한 긴장 감소", "큰 변화보다 유지에 집중"],
          observations: ["정렬 수정 반응이 빨라짐", "보상 움직임이 줄어듦", "좌우 차이가 아직 남아있음", "컨트롤이 흔들리는 구간 있음"],
        },
        fitness: {
          goals: ["체력/근지구력", "전신 순환", "복부 활성", "하체 라인", "유산소성 흐름", "대사 활성"],
          focusAreas: ["복부/코어", "둔부", "고관절", "하체", "전신"],
          preChecks: ["오늘 강도", "순환/근지구력 목표", "컨디션", "피로도", "호흡 유지"],
          changes: ["운동 수행감 향상", "호흡 유지 안정", "근지구력 흐름 개선", "하체 정렬 개선", "코어 연결감 향상", "피로 누적", "강도 적응 확인"],
          observations: ["강도는 적절했다고 표현", "피로로 강도 조절 필요", "움직임 리듬이 좋아짐", "컨트롤 유지 시간이 늘어남"],
        },
        recovery: {
          goals: ["통증 관리", "회복/컨디션 관리", "허리 안정화", "목/어깨 긴장 완화", "가동범위 회복", "호흡 안정"],
          focusAreas: ["목/어깨", "흉곽", "허리", "골반", "고관절", "전신"],
          preChecks: ["불편감 위치", "오늘 피해야 할 동작", "가동범위", "긴장도", "무리 없는 범위"],
          changes: ["불편감 완화", "부담 증가 없이 진행", "가동범위 향상", "긴장 완화", "호흡 리듬 안정", "회복 중심 유지", "새 불편감 확인 필요"],
          observations: ["통증/불편감 확인하며 진행 필요", "강도 낮춰 진행이 적절함", "가동범위 내 움직임이 안정적임", "긴장도가 아직 남아있음"],
        },
        condition: {
          goals: ["회복/컨디션 관리", "호흡 회복", "복압 조절", "골반저근 인지", "전신 순환", "피로 회복"],
          focusAreas: ["흉곽", "골반", "복부/코어", "고관절", "하체", "전신"],
          preChecks: ["피로도", "호흡", "골반저/복압", "일상 컨디션", "순환 상태"],
          changes: ["안정감 향상", "호흡 연결 개선", "무리감 없이 진행", "순환감 개선", "컨디션 유지", "피로도 확인", "회복 흐름 확인"],
          observations: ["호흡과 움직임 연결이 좋아짐", "회복 중심 진행이 적절함", "무리감 여부를 확인하며 진행", "컨디션 보고 조절 필요"],
        },
      },
      memberResponses: ["편안하게 따라옴", "특정 동작에서 자신감이 생김", "강도는 적절했다고 표현", "조금 더 천천히 진행하면 좋음", "피로감 있어 회복 중심 필요", "다음에도 같은 흐름을 이어가면 좋음", "별도 표현 없음"],
    };

    function preFieldsFor(templateCode) {
      const template = templateFor(templateCode);
      return [
        { type: "template", key: "templateCode", label: "회원 목적 템플릿" },
        { type: "single", key: "planBasis", label: "오늘 수업 계획 기준", options: sets.planBasis },
        { type: "single", key: "preCondition", label: "오늘 컨디션 체크", options: sets.preCondition },
        { type: "multi", key: "goals", label: "오늘 핵심 목표", options: template.goals, max: 2 },
        { type: "multi", key: "focusAreas", label: "오늘 주요 부위", options: template.focusAreas, max: 2 },
        { type: "multi", key: "equipment", label: "오늘 기구 계획", options: sets.commonEquipment, max: 3 },
        { type: "single", key: "intensity", label: "오늘 강도 계획", options: sets.intensity },
        { type: "multi", key: "preChecks", label: "템플릿별 수업 전 체크", options: template.preChecks, max: 2 },
        { type: "text", key: "memo", label: "수업 전 강사 메모", placeholder: "오늘 특별히 확인할 점이 있다면 짧게 적어주세요. 예: 오른쪽 어깨 긴장 먼저 체크" },
      ];
    }

    function postFieldsFor(templateCode) {
      const template = templateFor(templateCode);
      return [
        { type: "template", key: "templateCode", label: "회원 목적 템플릿" },
        { type: "single", key: "sessionType", label: "오늘 회차 유형", options: sets.sessionType },
        { type: "single", key: "planProgress", label: "계획 대비 진행 상태", options: sets.planProgress },
        { type: "single", key: "condition", label: "오늘 몸 상태 / 수업 반응", options: sets.bodyResponse },
        { type: "single", key: "painChange", label: "불편감 흐름", options: sets.painChange },
        { type: "multi", key: "changes", label: "오늘 관찰된 핵심 변화", options: template.changes, max: 2 },
        { type: "multi", key: "movementObservations", label: "추가 움직임 관찰", options: template.observations, max: 1 },
        { type: "single", key: "memberResponses", label: "회원 체감 / 반응", options: sets.memberResponses },
        { type: "single", key: "nextDirection", label: "다음 수업 방향", options: sets.nextDirection, required: true },
        { type: "text", key: "nextMemo", label: "다음 수업 방향 상세 메모", placeholder: "필요한 경우에만 한 문장으로 적어주세요. 예: 다음 수업에서는 오른쪽 고관절 움직임을 먼저 확인하고 하체 정렬로 연결" },
        { type: "text", key: "internalMemo", label: "강사용 내부 메모", placeholder: "회원에게 노출하지 않을 강사용 참고 메모가 있으면 남겨주세요." },
      ];
    }

    const title = document.getElementById("title");
    const meta = document.getElementById("meta");
    const summary = document.getElementById("summary");
    const referencePanel = document.getElementById("referencePanel");
    const form = document.getElementById("form");
    const sections = document.getElementById("sections");
    const mediaPanel = document.getElementById("mediaPanel");
    const reportPanel = document.getElementById("reportPanel");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    boot();

    async function boot() {
      try {
        if (!state.requestId || !state.token) throw new Error("차트 링크 정보가 부족합니다.");
        const res = await fetch(`${apiBase}?r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&mode=${state.mode}`);
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "차트 정보를 불러오지 못했습니다.");
        }
        render(data);
      } catch (error) {
        meta.textContent = "";
        summary.innerHTML = "";
        referencePanel.innerHTML = "";
        setStatus(error.message || String(error), true);
      }
    }

    function render(data) {
      state.data = data;
      const isPost = data.mode === "post";
      title.textContent = isPost ? "수업 후 기록" : "수업 전 계획";
      submitButton.textContent = isPost ? "수업 후 기록 제출" : "수업 전 계획 제출";
      meta.innerHTML = [
        `<span>${escapeHtml(data.memberName || "-")}님 · ${Number(data.sessionNumber || 1)}회차</span>`,
        `<span>${escapeHtml(data.lessonTime || data.lessonDate || "-")} · 담당 ${escapeHtml(data.staffName || "미정")}</span>`,
      ].join("");
      summary.innerHTML = intakeHtml(data.intakeSummary);
      renderReferencePanel(data);
      sections.innerHTML = fieldsForMode(data.mode, selectedTemplateCode(data)).map(fieldHtml).join("");
      const templateSelect = sections.querySelector("[data-template-select]");
      if (templateSelect) {
        templateSelect.addEventListener("change", () => {
          const nextCode = templateSelect.value;
          const nextData = {
            ...state.data,
            lessonTemplate: { ...(state.data?.lessonTemplate || {}), templateCode: nextCode, label: sets.templateLabels[nextCode] },
            existingAnswers: {
              ...(state.data?.existingAnswers || {}),
              [state.mode]: { ...(state.data?.existingAnswers?.[state.mode] || {}), templateCode: nextCode },
            },
          };
          state.data = nextData;
          render(nextData);
        });
      }
      renderMediaPanel(data);
      applyExistingAnswers(data);
      applyLockedState(data);
      renderReportPanel(data);
      form.classList.remove("hidden");
      if (!state.formBound) {
        form.addEventListener("submit", submit);
        state.formBound = true;
      }
    }

    function templateFor(templateCode) {
      return sets.templates[sets.templateCodes.includes(templateCode) ? templateCode : "posture"];
    }

    function selectedTemplateCode(data) {
      const existing = data.mode === "post" ? data.existingAnswers?.post : data.existingAnswers?.pre;
      const code = String(existing?.templateCode || data.lessonTemplate?.templateCode || "posture");
      return sets.templateCodes.includes(code) ? code : "posture";
    }

    function fieldsForMode(mode, templateCode) {
      return mode === "post" ? postFieldsFor(templateCode) : preFieldsFor(templateCode);
    }

    function renderReferencePanel(data) {
      const templateCode = selectedTemplateCode(data);
      const templateLabel = data.lessonTemplate?.label || sets.templateLabels[templateCode] || "체형교정/정렬";
      const reviewNote = data.lessonTemplate?.reviewDue
        ? `<span class="template-badge">리뷰 회차 권장</span>`
        : "";
      const previous = data.previousRecord || null;
      referencePanel.innerHTML = `
        <article class="reference-card">
          <span class="template-badge">${escapeHtml(templateLabel)} · 자동 분류</span>
          <h2>강사용 참고</h2>
          <p>회원 사전설문과 지난 회차 기록을 참고해 오늘 수업을 설계해 주세요. 필요하면 아래 템플릿 선택을 바꿔 제출할 수 있습니다.</p>
          ${reviewNote}
        </article>
        <article class="reference-card">
          <h3>회원 최초 사전설문 요약</h3>
          ${intakeReferenceHtml(data.intakeSummary)}
        </article>
        <article class="reference-card">
          <h3>지난 회차 수업 리포트</h3>
          ${previous ? previousRecordHtml(previous) : `<p>참고할 지난 회차 기록이 아직 없습니다.</p>`}
        </article>`;
    }

    function intakeReferenceHtml(intake) {
      if (!intake) return `<p>연결된 최초 사전설문이 없습니다.</p>`;
      const rows = [
        ["목적 템플릿", intake.purposeTemplateLabel],
        ["목표", intake.goal],
        ["관심 부위", intake.focusArea],
        ["운동 수준", intake.exerciseLevel],
        ["기대/중요 요소", intake.expectationOrImportantFactor],
        ["고민/어려움", intake.concernOrDifficulty],
        ["생활/이전 이슈", intake.lifestyleOrPreviousIssue],
        ["주의", intake.painOrMedicalNote ? "주의 내용 있음. 강사용 원본에서 상세 확인" : "특별 주의 내용 없음"],
      ].filter(([, value]) => value);
      return `<ul class="reference-list">${rows.map(([label, value]) => `<li><strong>${escapeHtml(label)}</strong> · ${escapeHtml(value)}</li>`).join("")}</ul>`;
    }

    function previousRecordHtml(record) {
      const rows = [
        ["회차", record.sessionLabel],
        ["수업일", record.lessonTime],
        ["목표", joinText(record.goals)],
        ["부위", joinText(record.focusAreas)],
        ["변화", joinText(record.changes)],
        ["다음 방향", record.nextDirection || record.nextMemo],
      ].filter(([, value]) => value);
      const link = record.reportUrl ? `<p><a href="${escapeAttr(record.reportUrl)}" target="_blank" rel="noopener">지난 리포트 열기</a></p>` : "";
      return `<ul class="reference-list">${rows.map(([label, value]) => `<li><strong>${escapeHtml(label)}</strong> · ${escapeHtml(value)}</li>`).join("")}</ul>${link}`;
    }

    function joinText(value) {
      return Array.isArray(value) ? value.filter(Boolean).join(", ") : String(value || "");
    }

    function applyExistingAnswers(data) {
      const answers = data.mode === "post" ? data.existingAnswers?.post : data.existingAnswers?.pre;
      if (!answers || typeof answers !== "object") return;
      for (const [key, value] of Object.entries(answers)) {
        const values = Array.isArray(value) ? value.map(String) : [String(value ?? "")];
        const field = form.elements[key];
        if (!field) continue;
        if (field instanceof RadioNodeList) {
          values.forEach((item) => {
            const input = Array.from(field).find((node) => node.value === item);
            if (input) input.checked = true;
          });
          if ("value" in field && values.length === 1) field.value = values[0];
          continue;
        }
        if (field instanceof HTMLTextAreaElement || field instanceof HTMLInputElement || field instanceof HTMLSelectElement) {
          field.value = values[0] || "";
        }
      }
    }

    function applyLockedState(data) {
      if (!data.locked) return;
      form.querySelectorAll("input, textarea").forEach((input) => {
        input.disabled = true;
      });
      submitButton.disabled = true;
      submitButton.textContent = data.mode === "post" ? "수업 후 기록 제출 완료" : "수업 전 계획 제출 완료";
      const note = document.createElement("p");
      note.className = "locked-note";
      note.textContent = "이미 제출된 기록입니다. 기존 내용 보호를 위해 다시 제출할 수 없습니다.";
      sections.after(note);
    }

    function renderReportPanel(data) {
      if (data.mode !== "post") {
        reportPanel.classList.add("hidden");
        reportPanel.innerHTML = "";
        return;
      }
      const report = data.report || {};
      const approved = ["approved", "queued", "sent"].includes(String(report.status || report.approval?.status || ""));
      const ready = Boolean(report.url);
      const submitted = data.postStatus === "submitted" || Boolean(report.postSubmitted);
      const message = ready
        ? approved
          ? "승인이 반영되었습니다. 회원 알림톡 발송 상태는 운영 큐에서 관리됩니다."
          : "수업 전/후 기록이 반영된 최종 리포트입니다. 내용을 확인한 뒤 발송 승인해 주세요."
        : submitted
          ? "수업 전/후 기록을 회원용 리포트로 변환해 주세요."
          : "수업 후 기록 제출 후 회원용 리포트가 생성됩니다.";
      reportPanel.classList.remove("hidden");
      reportPanel.innerHTML = `
        <h2>회원용 리포트</h2>
        <p>${escapeHtml(message)}</p>
        ${ready ? `<iframe class="report-frame" title="회원용 리포트 미리보기" src="${escapeAttr(report.url)}"></iframe>` : ""}
        <div class="button-row">
          ${submitted ? `<button class="${ready ? "secondary" : ""}" type="button" data-convert-report ${approved ? "disabled" : ""}>${ready ? "리포트 변환 완료" : "수업 전/후 기록으로 리포트 변환"}</button>` : ""}
          ${ready ? `<button class="secondary" type="button" data-open-report>리포트 새 창으로 보기</button>` : `<button class="secondary" type="button" data-refresh-report>리포트 상태 새로고침</button>`}
          ${ready ? `<button type="button" data-approve-report ${approved ? "disabled" : ""}>${approved ? "승인 완료" : "회원 알림톡 발송 승인"}</button>` : ""}
        </div>`;
      const convertButton = reportPanel.querySelector("[data-convert-report]");
      if (convertButton && !ready) convertButton.addEventListener("click", convertReport);
      const openButton = reportPanel.querySelector("[data-open-report]");
      if (openButton) openButton.addEventListener("click", () => window.open(report.url, "_blank", "noopener"));
      const refreshButton = reportPanel.querySelector("[data-refresh-report]");
      if (refreshButton) refreshButton.addEventListener("click", refreshReport);
      const approveButton = reportPanel.querySelector("[data-approve-report]");
      if (approveButton) approveButton.addEventListener("click", approveReport);
    }

    function renderMediaPanel(data) {
      if (data.mode !== "post") {
        mediaPanel.classList.add("hidden");
        mediaPanel.innerHTML = "";
        return;
      }
      const files = Array.isArray(data.media?.files) ? data.media.files : [];
      mediaPanel.classList.remove("hidden");
      mediaPanel.innerHTML = `
        <h2>수업 사진·영상</h2>
        <p>여기에 첨부한 사진과 영상은 같은 회차 회원 리포트에 자동 포함됩니다. 리포트에 넣을 파일만 선택해 주세요.</p>
        <label class="media-input">
          <span>사진/영상 선택</span>
          <input type="file" id="mediaFiles" accept="image/*,video/*" multiple>
        </label>
        <div id="mediaUploadQueue" class="media-list"></div>
        <div class="media-list">
          ${files.length ? files.map(mediaFileHtml).join("") : `<div class="media-file">아직 업로드된 사진/영상이 없습니다.</div>`}
        </div>
        ${data.media?.sessionFolderUrl ? `<a href="${escapeAttr(data.media.sessionFolderUrl)}" target="_blank" rel="noopener">Drive 폴더 열기</a>` : ""}
      `;
      const input = mediaPanel.querySelector("#mediaFiles");
      if (input) input.addEventListener("change", handleMediaFiles);
    }

    function mediaFileHtml(file) {
      const kind = String(file.mimeType || "").startsWith("video/") ? "영상" : "사진";
      return `<div class="media-file"><strong>${escapeHtml(kind)} · ${escapeHtml(file.fileName || "파일")}</strong>` +
        `<span>${formatBytes(Number(file.size || 0))} · 리포트 자동 포함</span>` +
        `<a href="${escapeAttr(file.driveUrl || file.previewUrl || "#")}" target="_blank" rel="noopener">Drive에서 보기</a></div>`;
    }

    async function handleMediaFiles(event) {
      const files = Array.from(event.target.files || []);
      event.target.value = "";
      if (!files.length) return;
      for (const file of files) {
        try {
          await uploadMediaFile(file);
        } catch (error) {
          setStatus(error.message || String(error), true);
        }
      }
      await refreshReport();
    }

    async function uploadMediaFile(file) {
      const queue = mediaPanel.querySelector("#mediaUploadQueue");
      const item = document.createElement("div");
      item.className = "media-file";
      item.innerHTML = `<strong>${escapeHtml(file.name)}</strong><span>업로드 준비 중</span><progress max="100" value="0"></progress>`;
      queue.prepend(item);
      const label = item.querySelector("span");
      const progress = item.querySelector("progress");
      state.uploading += 1;
      submitButton.disabled = true;
      try {
        if (!/^image\/|^video\//.test(file.type || "")) throw new Error("사진 또는 영상 파일만 업로드할 수 있습니다.");
        const init = await postJson({
          action: "initMediaUpload",
          requestId: state.requestId,
          token: state.token,
          fileName: file.name,
          mimeType: file.type,
          size: file.size,
        });
        const chunkSize = Number(init.chunkSize || 1024 * 1024);
        let offset = 0;
        while (offset < file.size) {
          const endExclusive = Math.min(offset + chunkSize, file.size);
          const chunk = file.slice(offset, endExclusive);
          label.textContent = `업로드 중 ${Math.round((offset / file.size) * 100)}% · ${formatBytes(offset)} / ${formatBytes(file.size)}`;
          const chunkBase64 = await blobToBase64(chunk);
          const result = await postJson({
            action: "uploadMediaChunk",
            requestId: state.requestId,
            token: state.token,
            uploadId: init.uploadId,
            start: offset,
            end: endExclusive - 1,
            total: file.size,
            chunkBase64,
          });
          offset = Number(result.bytesUploaded || endExclusive);
          progress.value = Math.round((offset / file.size) * 100);
          label.textContent = `업로드 중 ${progress.value}% · ${formatBytes(offset)} / ${formatBytes(file.size)}`;
        }
        label.textContent = "업로드 완료 · 리포트 자동 포함";
      } catch (error) {
        label.textContent = error.message || String(error);
        item.classList.add("error");
        throw error;
      } finally {
        state.uploading = Math.max(0, state.uploading - 1);
        if (!state.loading && state.uploading === 0 && !state.data?.locked) {
          submitButton.disabled = false;
        }
      }
    }

    function intakeHtml(intake) {
      if (!intake) return `<h2>사전설문 요약</h2><p>연결된 사전설문이 없습니다.</p>`;
      const rows = [
        ["목적 템플릿", intake.purposeTemplateLabel],
        ["목표", intake.goal],
        ["신경 부위", intake.focusArea],
        ["운동 수준", intake.exerciseLevel],
        ["기대/중요 요소", intake.expectationOrImportantFactor],
        ["생활/이전 이슈", intake.lifestyleOrPreviousIssue],
        ["주의", intake.painOrMedicalNote ? "상세 내용은 강사용 기록에서 확인" : "특별 주의 내용 없음"],
      ];
      return `<h2>사전설문 요약</h2><dl>${rows.map(([k, v]) => `<div><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v || "-")}</dd></div>`).join("")}</dl>`;
    }

    function fieldHtml(field) {
      if (field.type === "template") {
        const selected = selectedTemplateCode(state.data || {});
        return `<section><label for="${field.key}"><h2>${escapeHtml(field.label)}</h2></label>` +
          `<select id="${field.key}" name="${field.key}" data-template-select>` +
          sets.templateCodes.map((code) => `<option value="${escapeAttr(code)}" ${code === selected ? "selected" : ""}>${escapeHtml(sets.templateLabels[code])}</option>`).join("") +
          `</select><p class="field-help">최초 사전설문 기준 자동 분류입니다. 오늘 수업 목적이 다르면 강사가 수정할 수 있습니다.</p></section>`;
      }
      if (field.type === "text") {
        const required = field.required ? "required" : "";
        const placeholder = field.placeholder || "필요할 때만 입력";
        const help = field.required ? `<p class="field-help">회원 리포트의 다음 수업 방향 원문으로 사용됩니다.</p>` : "";
        return `<section><label for="${field.key}"><h2>${escapeHtml(field.label)}</h2></label>${help}<textarea id="${field.key}" name="${field.key}" ${required} placeholder="${escapeAttr(placeholder)}"></textarea></section>`;
      }
      if (field.type === "groupedMulti") {
        return `<section><h2>${escapeHtml(field.label)}</h2><div class="purpose-groups">${field.groups.map((group) => `
          <div class="purpose-group">
            <p class="purpose-title">${escapeHtml(group.label)}</p>
            <div class="choices">${group.options.map((option) => `
              <label class="choice">
                <input type="checkbox" name="${field.key}" value="${escapeHtml(option)}">
                <span>${escapeHtml(option)}</span>
              </label>`).join("")}</div>
          </div>`).join("")}</div></section>`;
      }
      const inputType = field.type === "single" ? "radio" : "checkbox";
      const help = field.max ? `<p class="field-help">최대 ${Number(field.max)}개만 선택해 주세요.</p>` : "";
      return `<section><h2>${escapeHtml(field.label)}</h2>${help}<div class="choices">${field.options.map((option) => `
        <label class="choice">
          <input type="${inputType}" name="${field.key}" value="${escapeHtml(option)}">
          <span>${escapeHtml(option)}</span>
        </label>`).join("")}</div></section>`;
    }

    async function submit(event) {
      event.preventDefault();
      if (state.loading) return;
      if (state.data?.locked) {
        setStatus("이미 제출된 기록입니다. 기존 내용 보호를 위해 다시 제출할 수 없습니다.", true);
        return;
      }
      state.loading = true;
      submitButton.disabled = true;
      setStatus("제출 중입니다.", false);
      try {
        if (state.uploading > 0) throw new Error("사진/영상 업로드가 끝난 뒤 제출해 주세요.");
        const answers = readAnswers(new FormData(form));
        if (state.mode === "post" && !String(answers.nextDirection || answers.nextMemo || "").trim()) {
          throw new Error("다음 수업 방향을 선택해 주세요. 회원 리포트에 반영됩니다.");
        }
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, mode: state.mode, answers }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "제출에 실패했습니다.");
        setStatus(state.mode === "post" ? "제출되었습니다. 리포트 생성 상태를 확인합니다." : "제출되었습니다. Notion 차트에 반영됩니다.", false);
        submitButton.textContent = "제출 완료";
        if (state.mode === "post") await refreshReport();
        state.loading = false;
      } catch (error) {
        state.loading = false;
        submitButton.disabled = false;
        setStatus(error.message || String(error), true);
      }
    }

    async function refreshReport() {
      const res = await fetch(`${apiBase}?r=${encodeURIComponent(state.requestId)}&t=${encodeURIComponent(state.token)}&mode=${state.mode}`);
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "리포트 상태를 불러오지 못했습니다.");
      state.data = data;
      renderMediaPanel(data);
      renderReportPanel(data);
      return data;
    }

    async function postJson(payload) {
      const res = await fetch(apiBase, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || "요청 처리에 실패했습니다.");
      return data;
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || "").split(",")[1] || "");
        reader.onerror = () => reject(reader.error || new Error("파일을 읽지 못했습니다."));
        reader.readAsDataURL(blob);
      });
    }

    function formatBytes(value) {
      if (!value) return "크기 미상";
      if (value < 1024 * 1024) return `${Math.round(value / 1024)}KB`;
      return `${(value / 1024 / 1024).toFixed(1)}MB`;
    }

    async function convertReport() {
      if (state.loading) return;
      state.loading = true;
      setStatus("회원용 리포트 변환 요청 중입니다.", false);
      const button = reportPanel.querySelector("[data-convert-report]");
      if (button) button.disabled = true;
      try {
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, action: "convertReport" }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "리포트 변환 요청에 실패했습니다.");
        setStatus(data.message || "리포트 변환 요청이 등록되었습니다.", false);
        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;
      }
    }

    async function approveReport() {
      if (state.loading) return;
      state.loading = true;
      setStatus("발송 승인 처리 중입니다.", false);
      const button = reportPanel.querySelector("[data-approve-report]");
      if (button) button.disabled = true;
      try {
        const res = await fetch(apiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requestId: state.requestId, token: state.token, action: "approveReport" }),
        });
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "승인 처리에 실패했습니다.");
        setStatus(data.message || "승인되었습니다.", false);
        await refreshReport();
      } catch (error) {
        setStatus(error.message || String(error), true);
        if (button) button.disabled = false;
      } finally {
        state.loading = false;
      }
    }

    function readAnswers(formData) {
      const answers = {};
      const activeFields = fieldsForMode(state.mode, String(formData.get("templateCode") || selectedTemplateCode(state.data || {})));
      for (const field of activeFields) {
        if (field.type === "multi" || field.type === "groupedMulti") {
          const values = formData.getAll(field.key).map(String);
          if (field.max && values.length > field.max) throw new Error(`${field.label}은 최대 ${field.max}개까지 선택할 수 있습니다.`);
          answers[field.key] = values;
        }
        if (field.type === "single") answers[field.key] = String(formData.get(field.key) || "");
        if (field.type === "text") answers[field.key] = String(formData.get(field.key) || "");
        if (field.type === "template") answers[field.key] = String(formData.get(field.key) || selectedTemplateCode(state.data || {}));
      }
      return answers;
    }

    function setStatus(message, error) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(error));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
