<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ARCHIVE IN 사전설문</title>
  <style>
    :root { color-scheme: light; --ink:#181512; --muted:#746b62; --line:#e8e0d7; --paper:#fffdf9; --accent:#c9392f; --soft:#f5efe9; --bad:#9d2f24; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#f6f1eb; color:var(--ink); }
    main { width:min(760px,100%); margin:0 auto; padding:18px 14px 36px; }
    .top { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; padding:18px 2px 14px; border-bottom:1px solid rgba(24,21,18,.08); }
    .brand { width:52px; height:52px; border-radius:50%; object-fit:contain; }
    .eyebrow { font-size:12px; font-weight:800; color:var(--accent); }
    h1 { margin:6px 0 10px; font-size:28px; line-height:1.18; letter-spacing:0; }
    .meta { display:flex; flex-wrap:wrap; gap:6px; color:var(--muted); font-size:13px; line-height:1.5; }
    .chip { display:inline-flex; align-items:center; min-height:28px; padding:4px 9px; border:1px solid var(--line); border-radius:999px; background:rgba(255,253,249,.72); }
    .section-title { margin:22px 2px 9px; font-size:13px; font-weight:900; color:#3e3831; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:15px 16px; }
    .match { margin:14px 0 0; background:var(--soft); border-color:#dfd2c5; }
    .warn { background:#fff7f4; border-color:#f0c9c1; color:var(--bad); }
    .label { font-size:12px; color:var(--muted); font-weight:800; margin-bottom:7px; }
    .value { font-size:16px; line-height:1.62; white-space:pre-line; word-break:keep-all; overflow-wrap:break-word; }
    .priority { display:grid; gap:10px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .small { font-size:13px; color:var(--muted); line-height:1.5; }
    .notice { margin-top:16px; padding:12px 14px; background:#fff7f4; border:1px solid #f0c9c1; border-radius:8px; color:var(--bad); font-size:12px; line-height:1.62; word-break:keep-all; overflow-wrap:break-word; }
    .notice strong { display:block; margin-bottom:2px; font-size:12px; color:var(--bad); }
    @media (max-width:560px) {
      main { padding:14px 12px 30px; }
      .top { grid-template-columns:1fr 44px; gap:12px; padding-top:12px; }
      .brand { width:44px; height:44px; }
      h1 { font-size:25px; }
      .grid { grid-template-columns:1fr; }
      .panel { padding:14px; }
      .value { font-size:15px; line-height:1.62; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="top">
      <div class="eyebrow">ARCHIVE IN</div>
      <h1>사전설문을 여는 중입니다</h1>
      <div class="meta">잠시만 기다려주세요.</div>
    </section>
  </main>
  <script src="/firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { doc, getDoc, getFirestore } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const ARCHIVE_LOGO_URL = '/logo120.png';
    const appRoot = document.getElementById('app');
    const params = new URLSearchParams(location.search);
    const id = String(params.get('id') || '').trim();
    const token = String(params.get('token') || '').trim();
    const validId = /^psr-[a-z0-9-]{8,80}$/i.test(id);
    const validToken = /^[a-f0-9]{16,80}$/i.test(token);

    if (!validId || !validToken) {
      renderMessage('설문 링크가 올바르지 않습니다.', '링크를 다시 확인해주세요.');
    } else {
      loadSurvey().catch((err) => renderMessage('설문을 열 수 없습니다.', err && err.message ? err.message : String(err), true));
    }

    async function loadSurvey() {
      const config = window.KANGSAIN_FIREBASE_CONFIG;
      if (!config || !config.apiKey) throw new Error('Firebase 설정을 찾을 수 없습니다.');
      const app = initializeApp(config);
      const db = getFirestore(app);
      const docKey = `${id}-${token}`;
      const snap = await getDoc(doc(db, 'privateSurveyPublic', docKey));
      if (!snap.exists()) throw new Error('아직 설문 상세화면이 준비되지 않았습니다.');
      renderSurvey(snap.data());
    }

    function renderSurvey(data) {
      const summary = data.summary || {};
      const matching = data.matching || {};
      const isGroup = data.surveyType === 'group';
      const priorityRows = [
        [isGroup ? '걱정되는 부분' : '운동 목적', summary.goal],
        [isGroup ? '통증/불편 부위' : '신경 부위', summary.focusArea],
        ['통증/병력', summary.painOrMedicalNote],
      ];
      const detailRows = [
        ['운동 수준', summary.exerciseLevel],
        [isGroup ? '요청사항' : '걱정/어려움', isGroup ? summary.expectationOrImportantFactor : summary.concernOrDifficulty],
        [isGroup ? '' : '기대/중요 요소', isGroup ? '' : summary.expectationOrImportantFactor],
        [isGroup ? '' : '생활/이전 아쉬움', isGroup ? '' : summary.lifestyleOrPreviousIssue],
        [isGroup ? '' : '유입경로', isGroup ? '' : summary.referralSource],
      ].filter(([label]) => label);
      appRoot.innerHTML = `
        <section class="top">
          <div>
            <div class="eyebrow">ARCHIVE IN · ${isGroup ? '그룹 첫 수업 사전확인' : '첫 프라이빗 사전설문'}</div>
            <h1>${escapeHtml(data.memberName || '회원')} 회원</h1>
            <div class="meta">
              <span class="chip">제출 ${escapeHtml(data.submittedAtText || '-')}</span>
              <span class="chip">${isGroup ? '운동경험' : '경험구분'} ${escapeHtml(data.experienceType || '-')}</span>
            </div>
          </div>
          <img class="brand" src="${ARCHIVE_LOGO_URL}" alt="ARCHIVE PILATES">
        </section>
        <section class="panel match">
          <div class="label">담당 수업</div>
          <div class="value">${escapeHtml(matchText(matching))}</div>
        </section>
        <div class="section-title">핵심 확인</div>
        <section class="priority">
          ${priorityRows.map(([label, value]) => answerBlock(label, value)).join('')}
        </section>
        <div class="section-title">상세 답변</div>
        <section class="grid">
          ${detailRows.map(([label, value]) => answerBlock(label, value)).join('')}
        </section>
        <section class="notice">
          <strong>내부 자료 안내</strong>
          설문 내용은 수업 준비 목적의 내부 자료입니다.<br>링크를 외부에 공유하지 마세요.
        </section>
      `;
    }

    function matchText(matching) {
      if (matching.status !== 'matched') return matching.reason || '담당 수업 매칭 대기 중';
      return [
        formatLessonTime(matching),
        matching.staffName ? `담당강사: ${matching.staffName}` : ''
      ].filter(Boolean).join('\n');
    }

    function formatLessonTime(matching) {
      const raw = matching.lectureStartAt;
      const date = raw && typeof raw.toDate === 'function' ? raw.toDate() : (raw ? new Date(raw) : null);
      if (date && !Number.isNaN(date.getTime())) {
        return `수업일시: ${new Intl.DateTimeFormat('ko-KR', {
          timeZone: 'Asia/Seoul',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          weekday: 'short',
          hour: '2-digit',
          minute: '2-digit'
        }).format(date)}`;
      }
      return matching.lectureDate ? `수업일자: ${matching.lectureDate}` : '';
    }

    function answerBlock(label, value) {
      return `<section class="panel"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value || '-')}</div></section>`;
    }

    function renderMessage(title, body, warn = false) {
      appRoot.innerHTML = `<section class="top"><div class="eyebrow">ARCHIVE IN</div><h1>${escapeHtml(title)}</h1></section><section class="panel ${warn ? 'warn' : ''}"><div class="value">${escapeHtml(body)}</div></section>`;
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char] || char);
    }
  </script>
</body>
</html>
