<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="robots" content="noindex, nofollow">
  <title>ARCHIVE IN 운영자 앱 종료 안내</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: clip;
      color: #121826;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(248, 245, 239, 0.72)),
        #f8f5ef;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    a,
    button {
      min-height: 44px;
    }

    a:focus-visible {
      outline: 2px solid #f15f1a;
      outline-offset: 3px;
    }

    main {
      display: grid;
      min-height: 100dvh;
      place-items: center;
      padding: clamp(24px, 6vw, 56px);
    }

    .notice {
      width: min(100%, 720px);
      padding: clamp(28px, 5vw, 48px);
      border: 1px solid rgba(18, 24, 38, 0.08);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 24px 72px rgba(18, 24, 38, 0.12);
    }

    .mark {
      display: inline-grid;
      width: 64px;
      height: 64px;
      place-items: center;
      border-radius: 20px;
      color: #ffffff;
      background: #f15f1a;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 16px 36px rgba(241, 95, 26, 0.28);
    }

    .eyebrow {
      margin: 28px 0 10px;
      color: #f15f1a;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      color: #121826;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 0.98;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .lead {
      max-width: 46rem;
      margin: 22px 0 0;
      color: #667085;
      font-size: clamp(16px, 2.4vw, 20px);
      line-height: 1.65;
      word-break: keep-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(100%, 180px);
      padding: 13px 18px;
      border-radius: 999px;
      color: #121826;
      background: #ffffff;
      border: 1px solid rgba(18, 24, 38, 0.12);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.2;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(18, 24, 38, 0.08);
    }

    .button.primary {
      color: #ffffff;
      background: #121826;
      border-color: #121826;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 10px;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(18, 24, 38, 0.08);
    }

    .link {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      color: #344054;
      background: rgba(248, 250, 252, 0.9);
      border: 1px solid rgba(18, 24, 38, 0.06);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      word-break: keep-all;
    }

    .link span {
      color: #98a2b3;
      font-weight: 800;
    }

    .fineprint {
      margin: 22px 0 0;
      color: #98a2b3;
      font-size: 13px;
      line-height: 1.5;
      word-break: keep-all;
    }

    @media (max-width: 480px) {
      main {
        place-items: stretch;
        padding: 18px;
      }

      .notice {
        border-radius: 24px;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="notice" aria-labelledby="page-title">
      <div class="mark" aria-hidden="true">IN</div>
      <p class="eyebrow">ARCHIVE PILATES</p>
      <h1 id="page-title">운영자 앱 종료 안내</h1>
      <p class="lead">
        ARCHIVE IN 운영자 화면은 ARCHIVE CORE로 역할이 이전되었습니다.
        기존 설문, 회원가입서, 프라이빗 차트, 리포트 링크는 계속 유지됩니다.
      </p>
      <div class="actions" aria-label="주요 이동 링크">
        <a class="button primary" href="https://core.archivepilates.com/">ARCHIVE CORE 열기</a>
        <a class="button" href="https://in.archivepilates.com/onsiteWelcome/">현장 웰컴</a>
      </div>
      <nav class="links" aria-label="유지되는 ARCHIVE IN 링크">
        <a class="link" href="https://in.archivepilates.com/privateSurvey/">프라이빗 사전설문 <span>→</span></a>
        <a class="link" href="https://in.archivepilates.com/private-chart/">강사용 프라이빗 차트 <span>→</span></a>
        <a class="link" href="https://in.archivepilates.com/memberSignup/">회원가입서 <span>→</span></a>
        <a class="link" href="https://in.archivepilates.com/onsiteWelcome/">현장 웰컴 <span>→</span></a>
      </nav>
      <p class="fineprint">
        이 페이지는 구 운영자 앱의 직접 접속을 막기 위한 안내 화면입니다.
        알림톡과 리포트에 포함된 개별 링크는 기존대로 작동합니다.
      </p>
    </section>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
        .catch(() => {});
    }
  </script>
</body>
</html>
