    function subscribeConversations() {
      if (!appState.staff?.studioId || appState.chat.conversationsUnsubscribe) return;
      const filters = [
        where('studioId', '==', appState.staff.studioId)
      ];
      if (appState.mode !== 'manager') filters.push(where('threadStaffId', '==', appState.staff.staffId));
      appState.chat.conversationsUnsubscribe = onSnapshot(
        query(collection(appState.db, 'conversations'), ...filters),
        (snap) => {
          const nextConversations = snap.docs.map((docSnap) => docSnap.data());
          const nextKey = conversationSnapshotKey(nextConversations);
          if (nextKey === appState.chat.lastConversationsKey) return;
          appState.chat.conversations = nextConversations;
          appState.chat.lastConversationsKey = nextKey;
          const activeThread = selectedChatStaffId();
          if ((appState.chat.open || appState.admin.activeTab === 'chat') && shouldMarkConversationRead(activeThread)) {
            markConversationRead(activeThread).catch(() => {});
          }
          if (!appState.loading) renderApp();
        },
        () => {}
      );
    }

    function unsubscribeConversations() {
      if (typeof appState.chat.conversationsUnsubscribe === 'function') appState.chat.conversationsUnsubscribe();
      appState.chat.conversationsUnsubscribe = null;
      appState.chat.conversations = [];
      appState.chat.lastConversationsKey = '';
    }

    function selectedChatStaffId() {
      return appState.mode === 'manager'
        ? appState.chat.selectedStaffId || appState.admin.staffs?.[0]?.staffId || ''
        : appState.staff?.staffId || '';
    }

    function conversationId(threadStaffId) {
      return `staff_${threadStaffId}`;
    }

    function subscribeChat(threadStaffId) {
      if (!threadStaffId) return;
      const convId = conversationId(threadStaffId);
      if (shouldMarkConversationRead(threadStaffId)) markConversationRead(threadStaffId).catch(() => {});
      if (appState.chat.unsubscribe && appState.chat.currentConvId === convId) return;
      unsubscribeChat();
      appState.chat.currentConvId = convId;
      appState.chat.messages = [];
      appState.chat.unsubscribe = onSnapshot(
        query(
          collection(appState.db, 'conversations', convId, 'messages'),
          orderBy('createdAt', 'asc'),
          queryLimit(80)
        ),
        (snap) => {
          const nextMessages = snap.docs.map((docSnap) => docSnap.data());
          const nextKey = messageSnapshotKey(nextMessages);
          if (nextKey === appState.chat.lastMessagesKey) return;
          appState.chat.messages = nextMessages;
          appState.chat.lastMessagesKey = nextKey;
          if (!appState.loading && (appState.chat.open || appState.admin.activeTab === 'chat')) {
            if (shouldMarkConversationRead(threadStaffId)) markConversationRead(threadStaffId).catch(() => {});
            renderApp();
            scrollChatToBottom();
          }
        },
        () => {}
      );
    }

    async function markConversationRead(threadStaffId) {
      const conv = conversationForStaff(threadStaffId);
      if (!conv || !shouldMarkConversationRead(threadStaffId)) return;
      const field = appState.mode === 'manager' ? 'managerReadAt' : 'staffReadAt';
      const lastMessage = timestampMillis(conv.lastMessageAt || conv.updatedAt);
      const markKey = `${field}_${threadStaffId}_${lastMessage}`;
      if (appState.chat.readMarks[markKey]) return;
      appState.chat.readMarks[markKey] = true;
      try {
        await updateDoc(doc(appState.db, 'conversations', conversationId(threadStaffId)), {
          [field]: serverTimestamp()
        });
      } catch (error) {
        delete appState.chat.readMarks[markKey];
        throw error;
      }
    }

    function unsubscribeChat() {
      if (typeof appState.chat.unsubscribe === 'function') appState.chat.unsubscribe();
      appState.chat.unsubscribe = null;
      appState.chat.currentConvId = '';
      appState.chat.messages = [];
      appState.chat.lastMessagesKey = '';
    }

    async function sendChatMessage(threadStaffId, content) {
      const text = String(content || '').trim();
      if (!threadStaffId || !text) return;
      const convId = conversationId(threadStaffId);
      const staffNameForThread = staffName(threadStaffId);
      const now = serverTimestamp();
      const convRef = doc(appState.db, 'conversations', convId);
      const messageRef = doc(collection(convRef, 'messages'));
      const optimisticMessage = {
        messageId: messageRef.id,
        senderStaffId: appState.staff?.staffId || '',
        senderName: appState.staff?.name || '',
        content: text,
        createdAt: new Date().toISOString()
      };
      const input = document.getElementById('chatInput');
      if (input) input.value = '';
      appState.chat.messages = [...appState.chat.messages, optimisticMessage];
      renderApp();
      scrollChatToBottom();
      try {
        await setDoc(convRef, {
          conversationId: convId,
          studioId: appState.staff?.studioId || '',
          threadStaffId,
          threadStaffName: staffNameForThread,
          updatedAt: now,
          lastMessageAt: now,
          lastMessage: text.slice(0, 120),
          lastSenderStaffId: appState.staff?.staffId || '',
          lastSenderName: appState.staff?.name || ''
        }, { merge: true });
        await setDoc(messageRef, {
          messageId: messageRef.id,
          conversationId: convId,
          studioId: appState.staff?.studioId || '',
          threadStaffId,
          threadStaffName: staffNameForThread,
          senderStaffId: appState.staff?.staffId || '',
          senderName: appState.staff?.name || '',
          senderRole: appState.staff?.role || '',
          content: text,
          createdAt: now
        });
      } catch (err) {
        appState.chat.messages = appState.chat.messages.filter((message) => message.messageId !== optimisticMessage.messageId);
        appState.chat.lastMessagesKey = '';
        showToast(`채팅 전송 실패: ${friendlyError(err)}`);
        unsubscribeChat();
        subscribeChat(threadStaffId);
        renderApp();
      }
    }

    function scrollChatToBottom() {
      requestAnimationFrame(() => {
        const box = document.getElementById('chatMessages');
        if (box) box.scrollTop = box.scrollHeight;
      });
    }

    function upsertDay(day) {
      const existing = appState.days.find((item) => item.date === day.date);
      const next = existing
        ? {
          ...day,
          consultations: existing.consultations || day.consultations || [],
          otherSchedules: existing.otherSchedules || day.otherSchedules || []
        }
        : day;
      const index = appState.days.findIndex((item) => item.date === day.date);
      if (index >= 0) appState.days.splice(index, 1, next);
      else appState.days.push(next);
      appState.days.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }

    function attachConsultationsToDays(days, consultations, dates = [], otherSchedules = []) {
      const map = new Map((days || []).map((day) => [day.date, { ...day, consultations: [], otherSchedules: [] }]));
      dates.forEach((date) => {
        if (!map.has(date)) map.set(date, emptyDay(date));
      });
      (consultations || []).forEach((consultation) => {
        if (!consultation?.date) return;
        const day = map.get(consultation.date) || emptyDay(consultation.date);
        day.consultations = [...(day.consultations || []), consultation].filter((item) => item.status !== 'deleted').sort(compareConsultations);
        map.set(consultation.date, day);
      });
      (otherSchedules || []).forEach((schedule) => {
        if (!schedule?.date) return;
        const day = map.get(schedule.date) || emptyDay(schedule.date);
        day.otherSchedules = [...(day.otherSchedules || []), schedule].filter((item) => item.status !== 'deleted').sort(compareConsultations);
        map.set(schedule.date, day);
      });
      return [...map.values()].sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }

    function upsertConsultationsForDate(date, consultations) {
      const active = (consultations || []).filter((item) => item.status !== 'deleted').sort(compareConsultations);
      const existing = appState.days.find((item) => item.date === date) || emptyDay(date);
      const next = { ...existing, consultations: active };
      const index = appState.days.findIndex((item) => item.date === date);
      if (index >= 0) appState.days.splice(index, 1, next);
      else appState.days.push(next);
      appState.days.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }

    function upsertOtherSchedulesForDate(date, otherSchedules) {
      const active = (otherSchedules || []).filter((item) => item.status !== 'deleted').sort(compareConsultations);
      const existing = appState.days.find((item) => item.date === date) || emptyDay(date);
      const next = { ...existing, otherSchedules: active };
      const index = appState.days.findIndex((item) => item.date === date);
      if (index >= 0) appState.days.splice(index, 1, next);
      else appState.days.push(next);
      appState.days.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    }

    function emptyDay(date) {
      return {
        viewId: `${appState.staff?.staffId || 'staff'}_${date}`,
        studioId: appState.staff?.studioId || '',
        staffId: appState.staff?.staffId || '',
        date,
        summary: {
          totalLectures: 0,
          totalBookings: 0,
          uncheckedAttendanceCount: 0,
          reservedCount: 0,
          cancelCount: 0,
          waitCount: 0
        },
        lectures: [],
        consultations: [],
        otherSchedules: []
      };
    }

    async function updateAttendance(bookingId, attendanceStatus) {
      if (!bookingId || !attendanceStatus) return;
      const booking = findBooking(bookingId);
      const context = findBookingContext(bookingId);
      if (!booking || !context || !canUpdateAttendance(context.lecture, booking)) return;
      optimisticAttendance(bookingId, attendanceStatus);
      renderApp();
      try {
        await updateDoc(doc(appState.db, 'bookings', bookingId), {
          attendanceStatus,
          syncStatus: 'pending',
          lastChangedBy: appState.user.uid,
          updatedAt: serverTimestamp()
        });
        await enqueueWriteJob('bookingAttendanceUpdate', {
          bookingId,
          attendanceStatus
        });
        showToast(`${statusLabel({ ...booking, attendanceStatus })} 처리 요청됨`);
      } catch (err) {
        appState.error = friendlyError(err);
        showToast('출결 변경 실패');
        await loadHome();
      }
    }

    function optimisticAttendance(bookingId, attendanceStatus) {
      appState.days.forEach((day) => {
        (day.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (booking.bookingId === bookingId) {
              booking.attendanceStatus = attendanceStatus;
              booking.syncStatus = 'pending';
            }
          });
        });
      });
      (appState.admin.views || []).forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (booking.bookingId === bookingId) {
              booking.attendanceStatus = attendanceStatus;
              booking.syncStatus = 'pending';
            }
          });
        });
      });
    }

    function openMemo(input) {
      appState.activeBooking = input;
      memoTitle.textContent = `${input.memberName || '회원'} 메모`;
      memoInput.value = '';
      memoHistory.innerHTML = '';
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');

    async function runManualSync() {
      if (appState.mode !== 'manager') return;
      const button = document.getElementById('manualSyncButton');
      if (button) {
        button.disabled = true;
        button.textContent = '동기화 중...';
      }
      try {
        const syncResult = await requestManualSync({
          startDate: appState.selectedDate,
          endDate: appState.selectedDate
        });
        const result = syncResult?.result || {};
        if (result.dashboardError || result.noticeError) {
          showToast(`${dateLabel(appState.selectedDate)} 수업 동기화 완료 · 일부 연동 확인 필요`);
        } else {
          showToast(`${dateLabel(appState.selectedDate)} 동기화 완료`);
        }
        await loadHome();
        openSyncInfo();
      } catch (err) {
        showToast(`동기화 실패: ${friendlyError(err)}`);
        if (button) {
          button.disabled = false;
          button.textContent = '선택일/매출 데이터 동기화';
        }
      }
    }

    async function requestManualSync({ startDate, endDate }) {
      const user = appState.auth?.currentUser;
      if (!user) throw new Error('로그인이 필요합니다');
      const requestRef = doc(collection(appState.db, 'adminSyncRequests'));
      await setDoc(requestRef, {
        requestId: requestRef.id,
        studioId: String(appState.staff?.studioId || '5330'),
        startDate,
        endDate,
        createdByUid: user.uid,
        status: 'pending',
        createdAt: serverTimestamp(),
        lastError: null
      });
      const startedAt = Date.now();
      while (Date.now() - startedAt < 90000) {
        await new Promise((resolve) => setTimeout(resolve, 2000));
        const snap = await getDoc(requestRef);
        const data = snap.exists() ? snap.data() : null;
        if (data?.status === 'success') return data;
        if (data?.status === 'error') throw new Error(data.lastError || '동기화 요청 처리 실패');
      }
      throw new Error('동기화 요청 시간이 초과되었습니다');
    }

    function memberRecords(member) {
      const key = member.memberId || member.memberName;
      const matches = [];
      const collect = (date, staffId, lecture) => {
        (lecture.bookings || []).forEach((booking) => {
          if ((member.memberId && booking.memberId === member.memberId) || (!member.memberId && (booking.memberName || '') === key)) {
            matches.push({ date, staffId, lecture, booking });
          }
        });
      };
      appState.days.forEach((day) => (day.lectures || []).forEach((lecture) => collect(day.date, appState.staff?.staffId || '', lecture)));
      (appState.admin.rangeViews || []).forEach((view) => (view.lectures || []).forEach((lecture) => collect(view.date, view.staffId, lecture)));
      return matches;
    }

        jobId: jobRef.id,

    function findBooking(bookingId) {
      return findBookingContext(bookingId)?.booking || null;

    function findBookingContext(bookingId) {
      for (const day of appState.days) {
        for (const lecture of day.lectures || []) {
          const booking = (lecture.bookings || []).find((item) => item.bookingId === bookingId);
          if (booking) return { day, lecture, booking };
        }
      }
      for (const view of appState.admin.views || []) {
        for (const lecture of view.lectures || []) {
          const booking = (lecture.bookings || []).find((item) => item.bookingId === bookingId);
          if (booking) return { day: view, lecture, booking };
        }

      return null;

      if (!config.vapidKey || !(await isSupported())) return;
      const registration = await navigator.serviceWorker.ready;
      const messaging = getMessaging(appState.app);
      const token = await getToken(messaging, {
        vapidKey: config.vapidKey,
        serviceWorkerRegistration: registration
      });
      if (!token) return;
      const fn = httpsCallable(appState.functions, functionNames.registerFcm);
      await fn({
        token,
        platform: 'web',
        deviceLabel: navigator.userAgent.slice(0, 80)
      });
    }

    function weekNewMembers() {
      const start = weekStartDate(appState.selectedDate);
      const end = addDays(start, 6);
      return periodNewMembers(start, end);
    }

    function periodNewMembers(start, end) {
      const rows = new Map();
      (appState.admin.memberProfiles || []).forEach((profile) => {
        const registered = dateOnlyFromValue(profile.registeredAt || profile.firstRegisteredAt || profile.joinedAt || profile.createdAt);
        if (!registered || registered < start || registered > end) return;
        const key = profile.memberId || profile.name;
        if (!key || rows.has(key)) return;
        rows.set(key, {
          memberId: profile.memberId,
          memberName: profile.name,
          registeredAt: registered
        });
      });
      adminViewsForRange(start, end).forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || [])
            .filter((booking) => !['cancel', 'wait_cancel'].includes(booking.appStatus))
            .forEach((booking) => {
              const registered = dateOnlyFromValue(booking.memberRegisteredAt);
              const newTag = (booking.tags || []).find((tag) => /신규회원/.test(tag.label || tag.tagId || ''));
              const sourceDate = registered || newTag?.sourceDate || '';
              const isNewByTag = Boolean(newTag && sourceDate >= start && sourceDate <= end);
              const isNewByRegisteredAt = Boolean(registered && registered >= start && registered <= end);
              if (!isNewByTag && !isNewByRegisteredAt) return;
              const key = booking.memberId || booking.memberName;
              if (!key || rows.has(key)) return;
              rows.set(key, {
                memberId: booking.memberId,
                memberName: booking.memberName,
                registeredAt: sourceDate
              });
            });
        });
      });
      return [...rows.values()].sort((a, b) =>
        String(a.registeredAt || '').localeCompare(String(b.registeredAt || '')) ||
        String(a.memberName || '').localeCompare(String(b.memberName || ''), 'ko')
      );
    }

    function adminViewsForRange(start, end) {
      const selected = appState.admin.selectedStaffId || 'all';
      return (appState.admin.rangeViews || []).filter((view) =>
        view.date >= start &&
        view.date <= end &&
        (selected === 'all' || view.staffId === selected)
      );
    }

    function periodExpiredTickets(start, end) {
      const rows = new Map();
      collectAdminMembers().forEach((row) => {
        (row.bookings || []).forEach((item) => {
          const booking = item.booking || {};
          if (!booking.ticketName) return;
          const expires = dateOnlyFromValue(booking.ticketExpiresAt);
          if (!expires || expires < start || expires > end) return;
          const key = `${row.memberId || row.memberName}_${ticketIdentity(booking)}_${expires}`;
          if (rows.has(key)) return;
          rows.set(key, {
            row,
            booking,
            expires,
            renewedTicket: otherActiveTicketRecord(row.bookings, item, expires)
          });
        });
      });
      return [...rows.values()].sort((a, b) =>
        String(a.expires || '').localeCompare(String(b.expires || '')) ||
        String(a.row.memberName || '').localeCompare(String(b.row.memberName || ''), 'ko')
      );
    }

    function periodRenewedMembers(start, end, expiredTickets = periodExpiredTickets(start, end)) {
      const rows = new Map();
      expiredTickets
        .filter((item) => item.renewedTicket)
        .forEach((item) => {
          const key = item.row.memberId || item.row.memberName;
          if (!key || rows.has(key)) return;
          rows.set(key, item);
        });
      return [...rows.values()];
    }

    function otherActiveTicketRecord(records, targetRecord, date = appState.selectedDate) {
      const targetTicketKey = ticketIdentity(targetRecord?.booking || {});
      return (records || []).find((item) => {
        if (item === targetRecord) return false;
        const booking = item.booking || {};
        if (!booking.ticketName) return false;
        if (ticketIdentity(booking) === targetTicketKey) return false;
        if (booking.ticketExpiryLevel === 'expired' || isTicketExpired(booking.ticketExpiresAt)) return false;
        const expires = dateOnlyFromValue(booking.ticketExpiresAt);
        if (expires && expires < date) return false;
        const remaining = Number(booking.ticketRemainingCount);
        return !Number.isFinite(remaining) || remaining > 0;
      }) || null;
    }

    function isWithinDaysFromEnd(date, endDate, days) {
      if (!date || !endDate) return false;
      const target = new Date(`${date}T00:00:00+09:00`).getTime();
      const end = new Date(`${endDate}T23:59:59+09:00`).getTime();
      const ageDays = (end - target) / (24 * 60 * 60 * 1000);
      return ageDays >= 0 && ageDays <= days;
    }

    function dayStats(date) {
      if (appState.mode === 'manager') {
        const selected = appState.admin.selectedStaffId || 'all';
        const views = (appState.admin.rangeViews || []).filter((view) =>
          view.date === date && (selected === 'all' || view.staffId === selected)
        );
        const summary = adminSummary(views);
        return {
          classes: summary.totalLectures,
          reserved: summary.reserved,
          consultations: (appState.admin.rangeConsultations || []).filter((item) =>
            item.date === date &&
            item.status !== 'deleted' &&
            scheduleBelongsToStaff(item, selected)
          ).length,
          otherSchedules: adminOtherSchedulesForDate(date).length,
          actions: date <= reservationOpenEndDate(today()) ? adminActionItems(views, date).length : 0
        };
      }
      const day = appState.days.find((item) => item.date === date) || emptyDay(date);
      return {
        classes: day.summary?.totalLectures || (day.lectures || []).length || 0,
        consultations: (day.consultations || []).filter((item) => item.status !== 'deleted').length,
        otherSchedules: (day.otherSchedules || []).filter((item) => item.status !== 'deleted').length,
        actions: day.summary?.uncheckedAttendanceCount || 0
      };
    }

    function scheduleStaffIds(item) {
      const ids = Array.isArray(item?.staffIds) ? item.staffIds.map(String).filter(Boolean) : [];
      const primary = String(item?.staffId || '');
      return [...new Set([primary, ...ids].filter(Boolean))];
    }

    function scheduleBelongsToStaff(item, selected = appState.admin.selectedStaffId || 'all') {
      if (selected === 'all') return true;
      const ids = scheduleStaffIds(item);
      return ids.length ? ids.includes(String(selected)) : !item?.staffId;
    }

    function scheduleStaffLabel(item) {
      const names = Array.isArray(item?.staffNames) ? item.staffNames.filter(Boolean) : [];
      const ids = scheduleStaffIds(item);
      const labels = names.length ? names : ids.map((id) => staffName(id)).filter(Boolean);
      return [...new Set(labels)].join(', ') || item?.staffName || '';
    }

    function adminFallbackActionCount(views) {
      const actionEnd = reservationOpenEndDate(today());
      return views.filter((view) => view.date <= actionEnd).reduce((total, view) => {
        return total + (view.lectures || []).reduce((inner, lecture) => {
          const unchecked = (lecture.bookings || []).filter((booking) =>
            booking.appStatus === 'reserved' &&
            booking.attendanceStatus === 'unchecked' &&
            isLectureDone(lecture)
          ).length;
          const noReservation = !(lecture.bookings || []).some((booking) => booking.appStatus === 'reserved') ? 1 : 0;
          return inner + unchecked + noReservation;
        }, 0);
      }, 0);
    }

    function conversationForStaff(staffId) {
      return (appState.chat.conversations || []).find((conv) => conv.threadStaffId === staffId) || null;
    }

    function conversationSnapshotKey(conversations) {
      return (conversations || [])
        .map((conv) => [
          conv.conversationId || '',
          conv.threadStaffId || '',
          timestampMillis(conv.lastMessageAt || conv.updatedAt),
          timestampMillis(conv.managerReadAt),
          timestampMillis(conv.staffReadAt),
          conv.lastSenderStaffId || ''
        ].join(':'))
        .sort()
        .join('|');
    }

    function messageSnapshotKey(messages) {
      return (messages || [])
        .map((message) => [
          message.messageId || '',
          timestampMillis(message.createdAt),
          message.senderStaffId || '',
          message.content || ''
        ].join(':'))
        .join('|');
    }

    function shouldMarkConversationRead(threadStaffId) {
      const conv = conversationForStaff(threadStaffId);
      if (!conv || conv.lastSenderStaffId === appState.staff?.staffId) return false;
      const lastMessage = timestampMillis(conv.lastMessageAt || conv.updatedAt);
      const readAt = timestampMillis(appState.mode === 'manager' ? conv.managerReadAt : conv.staffReadAt);
      return Boolean(lastMessage && lastMessage > readAt);
    }

    function unreadForStaff(staffId) {
      const conv = conversationForStaff(staffId);
      if (!conv || conv.lastSenderStaffId === appState.staff?.staffId) return 0;
      const lastMessage = timestampMillis(conv.lastMessageAt || conv.updatedAt);
      const readAt = timestampMillis(appState.mode === 'manager' ? conv.managerReadAt : conv.staffReadAt);
      return lastMessage && lastMessage > readAt ? 1 : 0;
    }

    function totalUnreadChats() {
      if (appState.mode === 'manager') {
        return (appState.admin.staffs || []).reduce((count, staff) => count + unreadForStaff(staff.staffId), 0);
      }
      return unreadForStaff(appState.staff?.staffId || '');
    }

    function adminSummary(views) {
      return views.reduce((summary, view) => {
        const lectures = view.lectures || [];
        const groupLectures = lectures.filter((lecture) => resolvedLessonType(lecture) === 'group');
        const counts = classTypeCounts(lectures);
        const capacity = lectures.reduce((total, lecture) => total + Math.max(0, Number(lecture.capacity || 0)), 0);
        const bookings = lectures.flatMap((lecture) => lecture.bookings || []);
        const reserved = bookings.filter((booking) => booking.appStatus === 'reserved');
        const attended = reserved.filter((booking) => booking.attendanceStatus === 'attended');
        const groupBookings = groupLectures.flatMap((lecture) => lecture.bookings || []);
        const groupReserved = groupBookings.filter((booking) => booking.appStatus === 'reserved');
        const groupAttended = groupReserved.filter((booking) => booking.attendanceStatus === 'attended');
        summary.activeStaffs += lectures.length ? 1 : 0;
        summary.totalLectures += view.summary?.totalLectures || lectures.length;
        summary.groupLectures += counts.group;
        summary.privateLectures += counts.private;
        summary.reserved += view.summary?.reservedCount || 0;
        summary.wait += view.summary?.waitCount || 0;
        summary.unchecked += view.summary?.uncheckedAttendanceCount || 0;
        summary.capacity += capacity;
        summary.attended += attended.length;
        summary.groupReserved += groupReserved.length;
        summary.groupAttended += groupAttended.length;
        return summary;
      }, {
        activeStaffs: 0,
        totalLectures: 0,
        groupLectures: 0,
        privateLectures: 0,
        reserved: 0,
        wait: 0,
        unchecked: 0,
        capacity: 0,
        attended: 0,
        groupReserved: 0,
        groupAttended: 0
      });
    }

    function adminViewsByRange(daysBack) {
      const start = addDays(appState.selectedDate, -daysBack);
      const end = appState.selectedDate;
      const selected = appState.admin.selectedStaffId || 'all';
      return (appState.admin.rangeViews || []).filter((view) =>
        view.date >= start &&
        view.date <= end &&
        (selected === 'all' || view.staffId === selected)
      );
    }

    function adminViewsForWeek(date) {
      const start = weekStartDate(date);
      const end = addDays(start, 6);
      const selected = appState.admin.selectedStaffId || 'all';
      return (appState.admin.rangeViews || []).filter((view) =>
        view.date >= start &&
        view.date <= end &&
        (selected === 'all' || view.staffId === selected)
      );
    }

    function renderMetricRow(label, value, max) {
      const width = max ? Math.max(6, Math.round((value / max) * 100)) : 0;
      return `
        <div class="admin-meter-row">
          <span>${escapeHtml(label)}</span>
          <div class="admin-meter-track"><div class="admin-meter-fill" style="width:${width}%"></div></div>
          <strong>${value}</strong>

    function renderRateRow(label, summary) {
      const averageReserved = safeRate(summary.groupReserved, summary.groupLectures);
      const attendanceRate = safeRate(summary.groupAttended, summary.groupReserved);
      return `
        <tr>
          <td>${escapeHtml(label)}</td>
          <td>${averageBookingText(averageReserved)}</td>
          <td>${percentText(attendanceRate)}</td>
          <td>${summary.unchecked}</td>
        </tr>
      `;

    function instructorStats(views) {
      const map = new Map();
      views.forEach((view) => {
        const row = map.get(view.staffId) || {
          staffId: view.staffId,
          name: staffName(view.staffId),
          groupClasses: 0,
          reserved: 0,
          attended: 0
        };
        (view.lectures || []).forEach((lecture) => {
          if (resolvedLessonType(lecture) !== 'group') return;
          row.groupClasses += 1;
          const reserved = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved');
          row.reserved += reserved.length;
          row.attended += reserved.filter((booking) => booking.attendanceStatus === 'attended').length;
        });
        map.set(view.staffId, row);
      });
      return [...map.values()]
        .filter((row) => row.groupClasses > 0)
        .map((row) => ({
          ...row,
          averageReserved: safeRate(row.reserved, row.groupClasses),
          attendanceRate: safeRate(row.attended, row.reserved)
        }))
        .sort((a, b) => a.averageReserved - b.averageReserved || b.groupClasses - a.groupClasses);
    }

    function lowClassIssues(views) {
      return views.flatMap((view) => (view.lectures || [])
        .filter((lecture) => resolvedLessonType(lecture) === 'group' && isLectureDone(lecture))
        .map((lecture) => {
        const reservedBookings = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved');
        const reserved = reservedBookings.length;
        const capacity = Math.max(0, Number(lecture.capacity || 0));
        const reservationRate = safeRate(reserved, capacity);
        const lowReservation = capacity >= 3 && reserved <= 3;
        return {
          view,
          lecture,
          staffName: staffName(view.staffId),
          reserved,
          capacity,
          reservationRate,
          issueType: '예약저조',
          isLowClass: lowReservation
        };
      }))
        .filter((item) => item.isLowClass)
        .sort((a, b) => a.reservationRate - b.reservationRate || String(a.view.date).localeCompare(String(b.view.date)));
    }

    function renderLowClassItem(item) {
      return `
        <div class="admin-list-item">

          <p>${escapeHtml(item.staffName)} · ${escapeHtml(item.issueType)} · 예약 ${item.reserved}/${item.capacity}</p>
        </div>
      `;

    function adminIssues(views) {
      const lectureIssues = [];
      const memberMap = new Map();
      views.forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          const bookings = lecture.bookings || [];
          const reserved = bookings.filter((booking) => booking.appStatus === 'reserved');
          if (!reserved.length) {
            lectureIssues.push({
              type: '예약0',
              view,
              lecture,
              body: `${staffName(view.staffId)} · ${lectureTimeText(lecture)} · ${lecture.title || '수업'}`
            });

              type: '출석미체크',
              view,
              lecture,
              body: `${staffName(view.staffId)} · ${lectureTimeText(lecture)} · ${unchecked.length}명`

        ].join(' ')).includes(needle))

    function collectMembers() {
      const map = new Map();
      const seenBookings = new Set();
      const addBooking = (view, lecture, booking) => {
        if (!booking.memberId && !booking.memberName) return;
        const bookingKey = booking.bookingId || `${booking.memberId || booking.memberName}_${view.date || ''}_${lecture.lectureId || lectureTimeText(lecture)}`;
        if (seenBookings.has(bookingKey)) return;
        seenBookings.add(bookingKey);
        const key = booking.memberId || booking.memberName;
        const row = map.get(key) || {
          memberId: booking.memberId,
          memberName: booking.memberName,
          memberPhone: booking.memberPhone,
          tags: [],
          bookings: [],
          memos: []
        };
        row.memberId = row.memberId || booking.memberId;
        row.memberName = row.memberName || booking.memberName;
        row.memberPhone = row.memberPhone || booking.memberPhone;
        row.bookings.push({ view, lecture, booking });
        row.tags.push(...canonicalMemberTags(booking));
        map.set(key, row);
      };
      (appState.days || []).forEach((day) => {
        const view = {
          date: day.date,
          staffId: appState.staff?.staffId || day.staffId || '',
          staffName: appState.staff?.name || day.staffName || ''
        };
        (day.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => addBooking(view, lecture, booking));
        });
      });
      (appState.admin.rangeViews || []).forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => addBooking(view, lecture, booking));
        });
      });
      (appState.admin.memos || []).forEach((memo) => {
        const key = memo.memberId || memo.memberName;
        if (!key) return;
        const row = map.get(key) || {
          memberId: memo.memberId,
          memberName: memo.memberName,
          memberPhone: '',
          tags: [],
          bookings: [],
          memos: []
        };
        row.memberName = row.memberName || memo.memberName;
        row.memos.push(memo);
        map.set(key, row);
      });
      (appState.admin.memberProfiles || []).forEach((profile) => {
        const key = profile.memberId || profile.name;
        if (!key) return;
        const row = map.get(key) || {
          memberId: profile.memberId,
          memberName: profile.name,
          memberPhone: profile.phone,
          tags: [],
          bookings: [],
          memos: []
        };
        row.memberId = row.memberId || profile.memberId;
        row.memberName = row.memberName || profile.name;
        row.memberPhone = profile.phone || row.memberPhone;
        row.profile = profile;
        map.set(key, row);
      });
      (appState.admin.memberContactIndex || []).forEach((contact) => {
        const key = contact.memberId || contact.name;
        if (!key) return;
        const row = map.get(key) || {
          memberId: contact.memberId,
          memberName: contact.name,
          memberPhone: contact.phone,
          tags: [],
          bookings: [],
          memos: []
        };

        row.memberName = row.memberName || contact.name;
        row.memberPhone = contact.phone || row.memberPhone;
        row.contactIndex = contact;
        map.set(key, row);

      return [...map.values()].map((row) => ({
        ...row,
        bookings: row.bookings.sort((a, b) => bookingSortValue(a) - bookingSortValue(b))
      }));
    }

    function renderInstructorMemberCard(row) {

    function renderMemberRecentLessonRow(item) {
      const title = compactText(item.lecture?.title || '수업', 10);
      const main = `${shortDate(item.view.date)} ${lectureStartTimeText(item.lecture)} ${title}`;

    function lectureStartTimeText(lecture) {
      return (lectureTimeText(lecture).split('-')[0] || '').trim();
    }

    function compactText(value, maxLength = 12) {
      const chars = [...String(value || '').trim()];
      return chars.length > maxLength ? `${chars.slice(0, maxLength).join('')}...` : chars.join('');
    }

    function memberMemoPreviews(row, recent = row.bookings.slice().reverse()) {
      return [
        ...row.memos.map((memo) => memo.content || ''),
        ...recent.map((item) => item.booking.lastMemoPreview || '')
      ].filter(Boolean);
    }

    function memberHealthTags(row) {
      return uniqueTagObjects(row.tags).filter((tag) => {
        const label = tag.label || tag.tagId || '';
        if (!label || /^30일 출석/.test(label) || /^30일 결석/.test(label)) return false;
        if (tag.source === 'auto_attendance') return false;
        return ['auto_memo', 'manual'].includes(tag.source) || /주의|통증|불편|임신|산후|강도|컨디션/.test(label);
      });
    }

    function uniqueTagObjects(tags) {
      const seen = new Set();
      return (tags || []).filter((tag) => {
        const key = tag.tagId || `${tag.source || ''}_${tag.label || ''}_${tag.sourceDate || ''}`;
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function canonicalMemberTags(booking) {
      const tags = booking?.tags || [];
      const memberKey = booking?.memberId || booking?.memberName || '';
      if (!memberKey) return tags;
      const cache = appState.memberTagCache || (appState.memberTagCache = buildMemberTagCache());
      const canonical = cache.get(memberKey);
      if (!canonical) return tags;
      const others = tags.filter((tag) => !isAttendanceTag(tag));
      return [...others, ...canonical];
    }

    function buildMemberTagCache() {
      const map = new Map();
      const add = (booking) => {
        const key = booking?.memberId || booking?.memberName || '';
        if (!key) return;
        const current = map.get(key) || { attended: null, absent: null };
        (booking.tags || []).forEach((tag) => {
          const info = attendanceTagInfo(tag);
          if (!info) return;
          if (info.kind === 'attended') current.attended = betterAttendanceTag(current.attended, info);
          if (info.kind === 'absent') current.absent = betterAttendanceTag(current.absent, info);
        });
        if (current.attended || current.absent) {
          map.set(key, current);
        }
      };
      (appState.days || []).forEach((day) => {
        (day.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach(add);
        });
      });
      (appState.admin.rangeViews || []).forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach(add);
        });
      });
      return new Map([...map.entries()].map(([key, value]) => [
        key,
        [value.attended?.tag, value.absent?.tag].filter(Boolean)
      ]));
    }

    function isAttendanceTag(tag) {
      const label = tag?.label || '';
      return tag?.source === 'auto_attendance' || /^30일 출석/.test(label) || /^30일 결석/.test(label);
    }

    function attendanceTagInfo(tag) {
      const label = tag?.label || '';
      const attended = label.match(/^30일\s*출석\s*(\d+)회?/);
      if (attended) return { kind: 'attended', count: Number(attended[1]) || 0, updatedAt: timestampMillis(tag.updatedAt), tag };
      const absent = label.match(/^30일\s*결석\s*(\d+)회?/);
      if (absent) return { kind: 'absent', count: Number(absent[1]) || 0, updatedAt: timestampMillis(tag.updatedAt), tag };
      return null;
    }

    function betterAttendanceTag(current, candidate) {
      if (!current) return candidate;
      if (candidate.updatedAt && current.updatedAt && candidate.updatedAt !== current.updatedAt) {
        return candidate.updatedAt > current.updatedAt ? candidate : current;
      }
      if (candidate.updatedAt && !current.updatedAt) return candidate;
      if (!candidate.updatedAt && current.updatedAt) return current;
      return candidate.count >= current.count ? candidate : current;
    }

    function memberAttendance30(row) {
      const attendanceTags = row.tags.map(attendanceTagInfo).filter(Boolean);
      if (attendanceTags.length) {
        const attended = attendanceTags.filter((tag) => tag.kind === 'attended').reduce(betterAttendanceTag, null);
        const absent = attendanceTags.filter((tag) => tag.kind === 'absent').reduce(betterAttendanceTag, null);
        return {
          attended: attended?.count || 0,
          absent: absent?.count || 0
        };
      }
      const start = addDays(appState.selectedDate, -29);
      const recent = actualAttendanceRecords(row.bookings, start, appState.selectedDate);
      return {
        attended: recent.filter((item) => item.booking.attendanceStatus === 'attended').length,
        absent: recent.filter((item) => ['absent', 'late_cancel'].includes(item.booking.attendanceStatus)).length
      };
    }

    function actualAttendanceRecords(records, startDate, endDate) {
      const endMs = new Date(`${endDate}T23:59:59.999+09:00`).getTime();
      const byClass = new Map();
      (records || [])
        .filter((item) => item.view.date >= startDate && item.view.date <= endDate)
        .filter((item) => isActualAttendanceRecord(item, endMs))
        .forEach((item) => {
          const key = attendanceRecordKey(item);
          const current = byClass.get(key);
          if (!current || attendanceRecordPriority(item) > attendanceRecordPriority(current) || attendanceRecordUpdatedAt(item) > attendanceRecordUpdatedAt(current)) {
            byClass.set(key, item);
          }
        });
      return [...byClass.values()];
    }

    function isActualAttendanceRecord(item, endMs) {
      const booking = item.booking || {};
      if (booking.appStatus === 'wait' || booking.appStatus === 'wait_cancel') return false;
      const classEndMs = timestampMillis(item.lecture?.endAt) || timestampMillis(item.lecture?.startAt);
      if (classEndMs && classEndMs > endMs) return false;
      if (booking.attendanceStatus === 'attended') return booking.appStatus === 'reserved';
      return booking.attendanceStatus === 'absent' || booking.attendanceStatus === 'late_cancel';
    }

    function attendanceRecordKey(item) {
      const booking = item.booking || {};
      const lecture = item.lecture || {};
      const lectureKey = lecture.lectureId || booking.lectureId || `${item.view?.date || ''}_${timestampMillis(lecture.startAt) || ''}_${lecture.staffId || booking.staffId || booking.staffName || ''}`;
      return `${booking.memberId || booking.memberName || ''}_${lectureKey}`;
    }

    function attendanceRecordPriority(item) {
      const status = item.booking?.attendanceStatus;
      if (status === 'attended') return 4;
      if (status === 'absent') return 3;
      if (status === 'late_cancel') return 2;
      return 1;
    }

    function attendanceRecordUpdatedAt(item) {
      return timestampMillis(item.booking?.updatedAt) || timestampMillis(item.booking?.sourceUpdatedAt) || 0;
    }

    function memberRecentPatterns(row) {
      const start = addDays(appState.selectedDate, -29);
      const counts = new Map();
      row.bookings
        .filter((item) => item.view.date >= start && item.view.date <= appState.selectedDate)
        .filter((item) => item.booking.appStatus === 'reserved')
        .forEach((item) => {
          const key = dayHourPattern(item);
          if (key) counts.set(key, (counts.get(key) || 0) + 1);
        });
      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'ko'))
        .slice(0, 4)
        .map(([label, count]) => `${label}${count > 1 ? ` ${count}회` : ''}`);
    }

    function dayHourPattern(item) {
      const date = new Date(`${item.view.date}T00:00:00+09:00`);
      if (Number.isNaN(date.getTime())) return '';
      const weekday = ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];
      const hour = Number(String(lectureTimeText(item.lecture) || '').match(/\d{1,2}/)?.[0]);
      return Number.isFinite(hour) ? `${weekday}요일 ${hour}시` : `${weekday}요일`;
    }

    function memberRevenueText(row) {
      const matched = findMemberSales(row);
      const values = [
        matched?.totalRevenue,
        ...row.bookings.map((item) => item.booking.memberRevenueTotal ?? item.booking.totalRevenue ?? item.booking.revenueTotal)
      ].filter((value) => value != null);
      const amount = values.length ? Number(values[0]) : NaN;
      return Number.isFinite(amount) && amount > 0 ? moneyText(amount) : '연동 필요';
    }

    function findMemberSales(row) {
      const memberSales = appState.admin.dashboard?.회원매출 || [];
      const rowPhone = normalizePhone(row.memberPhone);
      if (row.memberId) {
        const matchedById = memberSales.find((item) => item.memberId === row.memberId);
        if (matchedById) return matchedById;
      }
      if (rowPhone) {
        const matchedByPhone = memberSales.find((item) => normalizePhone(item.memberPhone) === rowPhone);
        if (matchedByPhone) return matchedByPhone;
      }
      if (row.memberName) {
        const matchedByName = memberSales.filter((item) => item.memberName === row.memberName);
        if (matchedByName.length === 1) return matchedByName[0];
      }
      return null;
    }

    function moneyText(value) {
      return `${Math.round(Number(value) || 0).toLocaleString('ko-KR')}원`;
    }

    function formatPhone(value) {
      const digits = normalizePhone(value);
      if (digits.length === 11) return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
      if (digits.length === 10) return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
      return digits;
    }

    function normalizePhone(value) {
      return String(value || '').replace(/\D/g, '');
    }

    function memberTicketSummaries(row) {
      const map = new Map();
      row.bookings.slice().reverse().forEach((item) => {
        const booking = item.booking || {};
        const name = privateTicketLabel(booking.ticketName) || booking.ticketName || '';
        if (!name || map.has(name)) return;
        const remaining = ticketCountLabel(booking.ticketRemainingCount);
        const expiryText = ticketExpiryText(booking);
        const meta = [remaining, expiryText].filter(Boolean).join(' · ') || '정보확인';
        map.set(name, {
          name,
          meta,
          level: booking.ticketExpiryLevel === 'expired' || isTicketExpired(booking.ticketExpiresAt)
            ? 'bad'
            : (booking.ticketExpiryLevel === 'soon' || isTicketExpiringSoon(booking.ticketExpiresAt) ? 'wait' : '')
        });
      });
      return [...map.values()];
    }

    function ticketExpiryText(booking) {
      if (booking.ticketExpiryLevel === 'expired' || isTicketExpired(booking.ticketExpiresAt)) return '만료';
      if (booking.ticketExpiryLevel === 'soon' || isTicketExpiringSoon(booking.ticketExpiresAt)) return '만료임박';
      const expires = dateOnlyLabel(booking.ticketExpiresAt);
      return expires ? `${expires} 만료` : '';
    }

    function memberSearchSummary(row) {
      const dates = row.bookings.map((item) => item.view.date).filter(Boolean).sort();
      return {
        lastDate: dates.at(-1) || '',
        rangeText: dates.length ? `${shortDate(dates[0])}~${shortDate(dates.at(-1))}` : '',
        topStaffs: topValues(row.bookings.map(recordStaffName)).slice(0, 3).join(', '),
        topTimes: topValues(row.bookings.map((item) => timeBand(lectureTimeText(item.lecture)))).slice(0, 3).join(', ')
      };
    }

    function activeAdminStaffs() {
      const sourceViews = appState.viewMode === 'day' ? (appState.admin.views || []) : visibleAdminRangeViews();
      const activeIds = new Set(sourceViews
        .filter((view) => (view.summary?.totalLectures || (view.lectures || []).length) > 0)
        .map((view) => view.staffId));
      return (appState.admin.staffs || []).filter((staff) => activeIds.has(staff.staffId));
    }

    function visibleAdminRangeViews() {
      const dates = new Set(appState.viewMode === 'month' ? monthCalendarDates(appState.selectedDate) : weekDates(appState.selectedDate));
      return (appState.admin.rangeViews || []).filter((view) => dates.has(view.date));
    }

    function topValues(values) {
      const counts = new Map();
      values.filter(Boolean).forEach((value) => counts.set(value, (counts.get(value) || 0) + 1));
      return [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'ko'))
        .map(([value]) => value);
    }

    function timeBand(timeText) {
      const hour = Number(String(timeText || '').match(/\d{1,2}/)?.[0]);
      if (!Number.isFinite(hour)) return '';
      if (hour < 12) return '오전';
      if (hour < 17) return '오후';
      return '저녁';
    }

    function attendanceText(status) {
      if (status === 'attended') return '출석';
      if (status === 'absent' || status === 'late_cancel') return '결석';
      return '미체크';
    }

    function safeRate(value, total) {
      return total > 0 ? value / total : 0;
    }

    function percentText(value) {
      return `${Math.round((Number(value) || 0) * 100)}%`;
    }

    function attendanceRateForRecords(records) {
      const checked = records.filter((item) => ['attended', 'absent', 'late_cancel'].includes(item.booking.attendanceStatus));
      if (!checked.length) return 0;
      return checked.filter((item) => item.booking.attendanceStatus === 'attended').length / checked.length;
    }

    function averageBookingText(value) {
      return Number.isFinite(value) ? value.toFixed(1) : '0.0';
    }

    function shortDate(date) {
      const match = String(date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return match ? `${Number(match[2])}/${Number(match[3])}` : String(date || '');
    }

    function dateOnlyLabel(value) {
      const date = timestampToDate(value);
      if (!date) return '';
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        month: 'numeric',
        day: 'numeric'
      }).format(date);
    }

    function fullDateLabel(value) {
      const date = timestampToDate(value) || parseDateLabel(value);
      if (!date) return String(value || '').trim();
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
      }).format(date);
    }

    function parseDateLabel(value) {
      const text = String(value || '').trim();
      if (!text) return null;
      const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (iso) return new Date(`${iso[1]}-${iso[2]}-${iso[3]}T00:00:00+09:00`);
      const korean = text.match(/(?:(\d{4})\D+)?(\d{1,2})\D+(\d{1,2})\D*$/);
      if (korean) {
        const year = korean[1] || String(appState.selectedDate || today()).slice(0, 4);
        return new Date(`${year}-${String(korean[2]).padStart(2, '0')}-${String(korean[3]).padStart(2, '0')}T00:00:00+09:00`);
      }
      return null;
    }

    function dateOnlyFromValue(value) {
      const date = timestampToDate(value);
      if (date) return new Date(date.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
      const text = String(value || '');
      const match = text.match(/\d{4}-\d{2}-\d{2}/);
      if (match) return match[0];
      const parsed = parseDateLabel(text);
      return parsed ? new Date(parsed.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10) : '';
    }

    function uniqueValues(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function normalizeSearch(value) {
      return String(value || '').replace(/\s/g, '').toLowerCase();
    }

    const STAFF_NAME_ALIASES = {
      '1983525': '배민진'
    };

    function recordStaffName(item) {
      const directName = item?.view?.staffName || item?.booking?.staffName || item?.lecture?.staffName || '';
      const normalizedDirect = STAFF_NAME_ALIASES[String(directName)] || directName;
      return normalizedDirect || staffName(item?.view?.staffId || item?.booking?.staffId || item?.lecture?.staffId);
    }

    function staffName(staffId, staffs = appState.admin.staffs || []) {
      const key = String(staffId || '');
      const staff = (staffs || []).filter(Boolean).find((item) => String(item.staffId || '') === key);
      return staff?.name || STAFF_NAME_ALIASES[key] || key || '강사';
    }

    function staffColor(staffId) {
      const key = String(staffId || '');
      const staff = (appState.admin.staffs || []).find((item) => String(item.staffId || '') === key);
      const raw = staff?.color || staff?.themeColor || staff?.backgroundColor || '';
      const normalized = normalizeHexColor(raw);
      if (normalized) return normalized;
      const palette = ['#E8742F', '#7A8F63', '#A45D49', '#6D7F9F', '#B9864A', '#7E6B8E', '#587C7A', '#C0616A'];
      const seed = String(staff?.name || key || '').split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
      return palette[seed % palette.length];
    }

    function normalizeHexColor(value) {
      const text = String(value || '').trim();
      if (/^#[0-9a-f]{6}$/i.test(text)) return text;
      if (/^#[0-9a-f]{3}$/i.test(text)) {
        return `#${text[1]}${text[1]}${text[2]}${text[2]}${text[3]}${text[3]}`;
      }
      const hex = text.match(/[0-9a-f]{6}/i)?.[0];
      return hex ? `#${hex}` : '';
    }

    function adminSyncText() {
      const state = appState.admin.syncState;
      const last = dateTimeLabel(state?.lastSuccessAt);
      return last ? `전체 운영 현황 · ${last} 갱신` : '전체 운영 현황';
    }

    function formatSyncText(day) {
      if (!day) return '수업 없음';
      return `예약 ${day.summary?.reservedCount || 0} · 미체크 ${day.summary?.uncheckedAttendanceCount || 0}`;
    }

    function today() {
      const now = new Date();
      return new Date(now.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function addDays(date, amount) {
      const base = new Date(`${date}T00:00:00+09:00`);
      base.setDate(base.getDate() + amount);
      return new Date(base.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function daysBetween(startDate, endDate) {
      const start = new Date(`${startDate}T00:00:00+09:00`);
      const end = new Date(`${endDate}T00:00:00+09:00`);
      return Math.floor((end.getTime() - start.getTime()) / (24 * 60 * 60 * 1000));
    }

    function dateLabel(date) {
      const base = new Date(`${date}T00:00:00+09:00`);
      return `${base.getMonth() + 1}/${base.getDate()} (${['일', '월', '화', '수', '목', '금', '토'][base.getDay()]})`;
    }

    function dayName(date) {
      const base = new Date(`${date}T00:00:00+09:00`);
      return ['일', '월', '화', '수', '목', '금', '토'][base.getDay()];
    }

    function dateNavLabel() {
      if (appState.viewMode === 'week') {
        const dates = weekDates(appState.selectedDate);
        return `${shortDate(dates[0])}~${shortDate(dates.at(-1))}`;
      }
      if (appState.viewMode === 'month') return `${appState.selectedDate.slice(0, 7)}`;
      return dateLabel(appState.selectedDate);
    }

    function weekDates(date) {
      const start = weekStartDate(date);
      return Array.from({ length: 7 }, (_, index) => addDays(start, index));
    }

    function monthCalendarDates(date) {
      const month = date.slice(0, 7);
      const first = `${month}-01`;
      const start = weekStartDate(first);
      return Array.from({ length: 42 }, (_, index) => addDays(start, index));
    }

    function periodRangeForMode(mode, date) {
      if (mode === 'month') {
        const month = String(date || appState.selectedDate).slice(0, 7);
        const start = `${month}-01`;
        const next = new Date(`${start}T00:00:00+09:00`);
        next.setMonth(next.getMonth() + 1);
        const nextStart = new Date(next.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
        return { start, end: addDays(nextStart, -1) };
      }
      const start = weekStartDate(date || appState.selectedDate);
      return { start, end: addDays(start, 6) };
    }

    function weekStartDate(date) {
      const base = new Date(`${date}T00:00:00+09:00`);
      const mondayOffset = (base.getDay() + 6) % 7;
      return addDays(date, -mondayOffset);
    }

    function visibleDatesForMode(mode, selectedDate, includeAnalyticsRange) {
      const dates = new Set();
      if (mode === 'month') monthCalendarDates(selectedDate).forEach((date) => dates.add(date));
      else if (mode === 'week') weekDates(selectedDate).forEach((date) => dates.add(date));
      else dates.add(selectedDate);
      if (includeAnalyticsRange) {
        for (let index = 0; index < 28; index += 1) dates.add(addDays(selectedDate, index - 27));
      } else if (mode === 'day') {
        for (let index = 0; index < 14; index += 1) dates.add(addDays(selectedDate, index));
      }
      return [...dates].sort();
    }

    function addMonths(date, amount) {
      const base = new Date(`${date}T00:00:00+09:00`);
      const originalDay = base.getDate();
      base.setDate(1);
      base.setMonth(base.getMonth() + amount);
      const lastDay = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
      base.setDate(Math.min(originalDay, lastDay));
      return new Date(base.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
    }

    function lessonLabel(type) {
      if (type === 'private') return '프라이빗';
      if (type === 'semi_private') return '세미';
      if (type === 'unknown') return '구분확인';
      return '그룹';
    }

    function renderOptionalChip(value) {
      const text = String(value || '').trim();
      return text ? `<span class="chip">${escapeHtml(text)}</span>` : '';
    }

    function privateTicketLabel(value) {
      return String(value || '')
        .trim()
        .replace(/^프라이빗\s*/i, '')
        .trim();
    }

    function renderTagChip(tag) {
      const className = [
        tag.level === 'warning' ? 'wait' : tag.level === 'danger' ? 'bad' : tag.level === 'positive' ? 'good' : '',
        tag.source === 'auto_attendance' ? 'attendance' : '',
        tag.source === 'auto_memo' ? 'memo' : '',
        tag.source === 'auto_profile' ? 'profile' : '',
        tag.source === 'manual' ? 'manual' : ''
      ].filter(Boolean).join(' ');
      const dateLabel = tag.source === 'auto_profile' ? '등록일' : '메모일자';
      const title = [tag.sourceDate ? `${dateLabel} ${tag.sourceDate}` : '', tag.sourceMemoId ? `메모 ${tag.sourceMemoId}` : ''].filter(Boolean).join(' · ');
      return `<span class="chip ${className}" title="${escapeAttr(title)}">${escapeHtml(tag.label || tag.tagId)}</span>`;
    }

    function renderTagField(label, tags) {
      if (!tags.length) return '';
      return `
        <div class="tag-field ${label ? '' : 'no-label'}">
          ${label ? `<span class="tag-label">${escapeHtml(label)}</span>` : ''}
          <div class="tag-list">${tags.map(renderTagChip).join('')}</div>
        </div>
      `;
    }

    function memberTagGroups(tags) {
      const visible = tags.filter((tag) => {
        const label = tag.label || '';
        if (/^30일 결석 0회$/.test(label)) return false;
        return ['auto_attendance', 'auto_memo', 'auto_profile', 'manual'].includes(tag.source) || /^30일 출석/.test(label) || /^30일 결석/.test(label);
      });
      return {
        fixed: visible.filter((tag) => tag.source !== 'manual'),
        manual: visible.filter((tag) => tag.source === 'manual')
      };
    }

    function isLectureDone(lecture) {
      const end = timestampToDate(lecture?.endAt) || timestampToDate(lecture?.startAt);
      return Boolean(end && end.getTime() <= Date.now());
    }

    function canUpdateAttendance(lecture, booking) {
      if (booking?.appStatus !== 'reserved') return false;
      const start = timestampToDate(lecture?.startAt);
      return Boolean(start && start.getTime() <= Date.now());
    }

    function resolvedLessonType(lecture) {
      if (['group', 'private', 'semi_private'].includes(lecture.lessonType)) return lecture.lessonType;
      return 'unknown';
    }

    function classTypeCounts(lectures) {
      return lectures.reduce((counts, lecture) => {
        const type = resolvedLessonType(lecture);
        if (type === 'private' || type === 'semi_private') counts.private += 1;
        else if (type === 'group') counts.group += 1;
        return counts;
      }, { group: 0, private: 0 });
    }

    function lectureTimeText(lecture) {
      const start = timestampToDate(lecture.startAt);
      const end = timestampToDate(lecture.endAt);
      if (!start) return (lecture.timeText || '').split(' ')[0] || '';
      const hhmm = (date) => new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
      return end ? `${hhmm(start)}-${hhmm(end)}` : hhmm(start);
    }

    function consultationTimeText(consultation) {
      return lectureTimeText(consultation || {});
    }

    function compareConsultations(a, b) {
      return (timestampMillis(a?.startAt) || 0) - (timestampMillis(b?.startAt) || 0)
        || String(a?.memberName || '').localeCompare(String(b?.memberName || ''), 'ko');
    }

    function channelLabel(channel) {
      const value = String(channel || '').toLowerCase();
      if (value === 'visit') return '방문';
      if (value === 'phone') return '전화';
      if (value === 'kakao' || value === 'chat') return '채팅';
      return channel || '';
    }

    function timestampToDate(value) {
      if (!value) return null;
      if (typeof value.toDate === 'function') return value.toDate();
      if (typeof value === 'string') {
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }
      const seconds = value.seconds ?? value._seconds;
      if (seconds != null) return new Date(Number(seconds) * 1000);
      return null;
    }

    function timestampMillis(value) {
      return timestampToDate(value)?.getTime() || 0;
    }

    function isTicketExpiringSoon(value) {
      const millis = timestampMillis(value);
      if (!millis) return false;
      const diffDays = (millis - Date.now()) / (24 * 60 * 60 * 1000);
      return diffDays >= 0 && diffDays <= 14;
    }

    function isTicketExpired(value) {
      const millis = timestampMillis(value);
      return Boolean(millis && millis < Date.now());
    }

    function isTicketActionable(booking) {
      const remaining = Number(booking.ticketRemainingCount);
      const lowRemaining = Number.isFinite(remaining) && remaining >= 0 && remaining < 5 && Boolean(booking.ticketName);
      return ['soon', 'expired'].includes(booking.ticketExpiryLevel) || isTicketExpiringSoon(booking.ticketExpiresAt) || lowRemaining;
    }

    function hasOtherActiveTicket(records, targetRecord, date = appState.selectedDate) {
      const targetTicketKey = ticketIdentity(targetRecord?.booking || {});
      return (records || []).some((item) => {
        if (item === targetRecord) return false;
        const booking = item.booking || {};
        if (!booking.ticketName) return false;
        if (ticketIdentity(booking) === targetTicketKey) return false;
        if (booking.ticketExpiryLevel === 'expired' || isTicketExpired(booking.ticketExpiresAt)) return false;
        const expires = dateOnlyFromValue(booking.ticketExpiresAt);
        if (expires && expires < date) return false;
        const remaining = Number(booking.ticketRemainingCount);
        return !Number.isFinite(remaining) || remaining > 0;
      });
    }

    function ticketIdentity(booking) {
      return String(booking.ticketId || booking.ticketName || '').trim();
    }

    function ticketCountLabel(value) {
      if (value == null) return '';
      const remaining = Number(value);
      if (!Number.isFinite(remaining) || remaining < 0 || remaining > 100) return '';
      return `${remaining}회`;
    }

    function hasActiveTicketRecord(records, date) {
      return records.some((item) => {
        const booking = item.booking || {};
        if (!booking.ticketName) return false;
        if (booking.ticketExpiryLevel === 'expired' || isTicketExpired(booking.ticketExpiresAt)) return false;
        const expires = dateOnlyFromValue(booking.ticketExpiresAt);
        if (expires && expires < date) return false;
        const remaining = Number(booking.ticketRemainingCount);
        return !Number.isFinite(remaining) || remaining > 0;
      });
    }

    function ticketRemainingText(value) {
      if (value == null) return '';
      const remaining = Number(value);
      if (!Number.isFinite(remaining) || remaining < 0 || remaining > 100) return '';
      return ` · ${remaining}회`;
    }

    function dateTimeLabel(value) {
      const date = timestampToDate(value);
      if (!date) return '';
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
    }

    function statusLabel(booking) {
      if (booking.appStatus === 'wait') return '대기';
      if (booking.appStatus === 'cancel' || booking.appStatus === 'wait_cancel') return '취소';
      if (booking.attendanceStatus === 'attended') return '출석';
      if (booking.attendanceStatus === 'absent') return '결석';
      if (booking.attendanceStatus === 'late_cancel') return '결석';
      return '예약';
    }

    function statusShort(booking) {
      return statusLabel(booking).slice(0, 1);
    }

    function statusClass(booking) {
      if (booking.syncStatus === 'pending') return 'pending';
      if (booking.appStatus === 'wait') return 'wait';
      if (booking.attendanceStatus === 'attended') return 'good';
      if (booking.attendanceStatus === 'absent' || booking.attendanceStatus === 'late_cancel') return 'bad';
      return '';
    }

    function showToast(message) {
      if (!toast || !message) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(appState.toastTimer);
      appState.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function friendlyError(err) {
      if (err?.code === 'auth/invalid-credential') return '이메일 또는 비밀번호가 맞지 않습니다';
      if (err?.code === 'auth/too-many-requests') return '로그인 시도가 많습니다. 잠시 후 다시 시도하세요';
      return err?.message?.replace(/^Firebase: /, '') || '처리 중 오류가 발생했습니다';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('\n', ' ');
    }

    document.querySelectorAll('[data-close-modal]').forEach((button) => {
      button.addEventListener('click', () => {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        if (!detailModal.classList.contains('open')) document.body.classList.remove('modal-active');
      });
    });
    document.querySelectorAll('[data-close-detail-modal]').forEach((button) => {
      button.addEventListener('click', closeDetailModal);
    });
    saveMemoButton.addEventListener('click', saveMemo);
    loadMemoButton.addEventListener('click', loadMemoHistory);
    document.querySelectorAll('[data-quick-memo]').forEach((button) => {
      button.addEventListener('click', () => appendQuickMemo(button.dataset.quickMemo || ''));
    });
  </script>
</body>
</html>
