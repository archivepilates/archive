            ${renderAdminBody()}
          </div>
        </main>
        ${renderFloatingChatButton()}
      `;
      bindAppEvents();
    }

    function renderBody(day) {
      if (appState.error) return `<section class="error">${escapeHtml(appState.error)}</section>`;
      if (appState.viewMode === 'week') return `${renderWeekView()}${renderInstructorWeekSchedule()}`;
      if (!day) return `<section class="empty">선택한 날짜의 수업이 없습니다</section>`;
      const classCounts = classTypeCounts(day.lectures || []);
      const checkCount = instructorCheckCount(day);
      const careCount = instructorCareCount(day);
      return `
        <section class="summary">
          <button class="summary-item" type="button" data-summary-detail="classes" aria-label="수업만 보기">
            <span class="summary-label">CLASSES</span>
            <span class="summary-value">${day.summary?.totalLectures || 0}</span>
            <span class="summary-note">그룹 ${classCounts.group} · 프라이빗 ${classCounts.private}</span>
          </button>
          <button class="summary-item" type="button" data-summary-detail="check">
            <span class="summary-label">CHECK</span>
            <span class="summary-value">${checkCount}</span>
            <span class="summary-note">출결 미체크</span>
          </button>
          <button class="summary-item" type="button" data-summary-detail="care">
            <span class="summary-label">CARE</span>
            <span class="summary-value">${careCount}</span>
            <span class="summary-note">주의 회원</span>
          </button>
        </section>
        ${renderSummaryDetail(day)}
        ${renderConsultationSection(day.consultations || [])}
        ${renderOtherScheduleSection(day.otherSchedules || [])}
        <h2 class="section-title">${dateLabel(day.date)} 수업</h2>
        ${(day.lectures || []).map(renderLecture).join('') || '<section class="empty">수업이 없습니다</section>'}
      `;
    }

    function renderViewSwitch() {
      const modes = appState.mode === 'manager'
        ? [['day', '일'], ['week', '주'], ['month', '월']]
        : [['day', '일'], ['week', '주']];
      return `
        <div class="view-switch" aria-label="보기 전환">
          ${modes.map(([mode, label]) => `
            <button class="${appState.viewMode === mode ? 'active' : ''}" type="button" data-view-mode="${mode}">${label}</button>
          `).join('')}
        </div>
      `;
    }

    function renderDateControls() {
      return `
        <nav class="datebar" aria-label="날짜 이동">
          <button id="prevDate" class="date-nav-button" type="button" aria-label="이전 기간">‹</button>
          <strong>${dateNavLabel()}</strong>
          <button id="nextDate" class="date-nav-button" type="button" aria-label="다음 기간">›</button>
        </nav>
        ${renderViewSwitch()}
      `;
    }

    function renderConsultationSection(consultations) {
      const active = (consultations || []).filter((item) => item.status !== 'deleted');
      if (!active.length) return '';
      return `
        <h2 class="section-title">상담</h2>
        <div class="consultation-list">
          ${active.slice().sort(compareConsultations).map(renderConsultation).join('')}
        </div>
      `;
    }

    function renderOtherScheduleSection(otherSchedules) {
      const active = (otherSchedules || []).filter((item) => item.status !== 'deleted');
      if (!active.length) return '';
      return `
        <h2 class="section-title">기타일정</h2>
        <div class="consultation-list">
          ${active.slice().sort(compareConsultations).map(renderOtherSchedule).join('')}
        </div>
      `;
    }

    function renderConsultation(consultation) {
      return `
        <article class="consultation">
          <div class="time">${escapeHtml(consultationTimeText(consultation))}</div>
          <div class="consultation-main">
            <h3 class="consultation-title">${escapeHtml(consultation.memberName || '상담')}</h3>
            <div class="chips">
              <span class="chip wait">상담</span>
              ${renderOptionalChip(appState.mode === 'manager' ? scheduleStaffLabel(consultation) : '')}
              ${renderOptionalChip(channelLabel(consultation.channel))}
              ${renderOptionalChip(formatPhone(consultation.memberPhone))}
              ${renderOptionalChip(consultation.memo)}
            </div>
          </div>
        </article>
      `;
    }

    function renderOtherSchedule(schedule) {
      return `
        <article class="consultation">
          <div class="time">${escapeHtml(consultationTimeText(schedule))}</div>
          <div class="consultation-main">
            <h3 class="consultation-title">${escapeHtml(schedule.title || '기타일정')}</h3>
            <div class="chips">
              <span class="chip">기타일정</span>
              ${renderOptionalChip(appState.mode === 'manager' ? scheduleStaffLabel(schedule) : '')}
              ${renderOptionalChip(schedule.category)}
              ${renderOptionalChip(schedule.memo)}
            </div>
          </div>
        </article>
      `;
    }

    function renderInstructorWeekSchedule() {
      const days = weekDates(appState.selectedDate)
        .map((date) => appState.days.find((day) => day.date === date) || emptyDay(date));
      return `
        <section class="admin-panel operation-panel">
          <div class="day-operation-head">
            <h2>이번 주 전체 수업</h2>
            <span>${shortDate(days[0].date)}~${shortDate(days.at(-1).date)}</span>
          </div>
          ${days.map((day) => `
            <div class="admin-staff-block">
              <div class="admin-staff-head">
                <h2>${dateLabel(day.date)}</h2>
                <span>수업 ${day.summary?.totalLectures || (day.lectures || []).length} · 상담 ${(day.consultations || []).length} · 기타 ${(day.otherSchedules || []).length}</span>
              </div>
              ${(day.lectures || []).map(renderLecture).join('') || '<section class="empty">수업이 없습니다</section>'}
              ${renderConsultationSection(day.consultations || [])}
              ${renderOtherScheduleSection(day.otherSchedules || [])}
            </div>
          `).join('')}
        </section>
      `;
    }

    function renderSummaryDetail(day) {
      const panel = appState.detailPanel;
      if (!panel || !day) return '';
      const lectures = day.lectures || [];
      const rows = {
        check: summaryCheckRows(lectures),
        care: summaryCareRows(lectures)
      }[panel] || [];
      const title = panel === 'check' ? '출결 미체크' : '주의 회원';
      return `
        <section class="summary-detail">
          <div class="summary-detail-head">
            <h3>${title}</h3>
            <button class="ghost" type="button" data-summary-detail="">닫기</button>
          </div>
          <div class="detail-list">
            ${rows.join('') || '<div class="empty">상세 데이터가 없습니다</div>'}
          </div>
        </section>
      `;
    }

    function summaryMemberRows(lectures) {
      const bookings = lectures.flatMap((lecture) => (lecture.bookings || [])
        .filter((booking) => !['cancel', 'wait_cancel'].includes(booking.appStatus))
        .map((booking) => ({ lecture, booking })));
      return bookings.map(({ lecture, booking }) => `
        <button class="detail-row" type="button" data-action-member="${escapeAttr(booking.memberId || booking.memberName || '')}">
          <span>${escapeHtml(lectureTimeText(lecture))}</span>
          <strong>${escapeHtml(booking.memberName || '회원')}</strong>
          <span class="chip ${statusClass(booking)}">${statusLabel(booking)}</span>
        </button>
      `);
    }

    function summaryCheckRows(lectures) {
      const rows = [];
      lectures.forEach((lecture) => {
        const reserved = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved');
        if (isLectureDone(lecture) && reserved.length && !reserved.some((booking) => booking.attendanceStatus === 'unchecked')) {
          rows.push(`
            <div class="detail-row">
              <span>${escapeHtml(lectureTimeText(lecture))}</span>
              <strong>${escapeHtml(lecture.title || '수업')}</strong>
              <span class="chip good">체크완료</span>
            </div>
          `);
        }
        (lecture.bookings || [])
          .filter((booking) => booking.appStatus === 'reserved' && booking.attendanceStatus === 'unchecked' && isLectureDone(lecture))
          .forEach((booking) => {
            rows.push(`
              <button class="detail-row" type="button" data-action-member="${escapeAttr(booking.memberId || booking.memberName || '')}">
                <span>${escapeHtml(lectureTimeText(lecture))}</span>
                <strong>${escapeHtml(booking.memberName || '회원')}</strong>
                <span class="chip bad">미체크</span>
              </button>
            `);
          });
      });
      return rows;
    }

    function summaryCareRows(lectures) {
      const rows = [];
      lectures.forEach((lecture) => {
        const reserved = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved');
        reserved.forEach((booking) => {
          const importantTags = (booking.tags || []).filter((tag) =>
            ['warning', 'danger'].includes(tag.level) ||
            ['auto_memo', 'manual'].includes(tag.source)
          );
          if (!importantTags.length) return;
          rows.push(`
            <button class="detail-row" type="button" data-action-member="${escapeAttr(booking.memberId || booking.memberName || '')}">
              <span>${escapeHtml(lectureTimeText(lecture))}</span>
              <strong>${escapeHtml(booking.memberName || '회원')}</strong>
              <span class="chip wait">${escapeHtml((importantTags[0].label || importantTags[0].tagId || '주의'))}</span>
            </button>
          `);
        });
      });
      return rows;
    }

    function instructorCheckCount(day) {
      return (day.lectures || []).reduce((count, lecture) => {
        if (!isLectureDone(lecture)) return count;
        return count + (lecture.bookings || []).filter((booking) =>
          booking.appStatus === 'reserved' && booking.attendanceStatus === 'unchecked'
        ).length;
      }, 0);
    }

    function instructorCareCount(day) {
      const members = new Set();
      (day.lectures || []).forEach((lecture) => {
        (lecture.bookings || [])
          .filter((booking) => booking.appStatus === 'reserved')
          .forEach((booking) => {
            const importantTags = (booking.tags || []).filter((tag) =>
              ['warning', 'danger'].includes(tag.level) ||
              ['auto_memo', 'manual'].includes(tag.source)
            );
            if (importantTags.length) members.add(booking.memberId || booking.memberName);
          });
      });
      return members.size;
    }

    function renderAdminSummaryDetail(views) {
      const panel = appState.detailPanel;
      if (!panel || !views.length) return '';
      const rows = {
        staff: adminSummaryStaffRows(views),
        classes: adminSummaryClassRows(views),
        members: adminSummaryMemberRows(views),
        alerts: adminSummaryAlertRows(views)
      }[panel] || [];
      const title = panel === 'staff' ? '수업 있는 강사' : panel === 'classes' ? '전체 수업 상세' : panel === 'members' ? '예약 회원 상세' : '액션 필요';
      return `
        <section class="summary-detail">
          <div class="summary-detail-head">
            <h3>${title}</h3>
            <button class="ghost" type="button" data-summary-detail="">닫기</button>
          </div>
          <div class="detail-list">
            ${rows.join('') || '<div class="empty">상세 데이터가 없습니다</div>'}
          </div>
        </section>
      `;
    }

    function adminSummaryStaffRows(views) {
      return views.map((view) => `
        <div class="detail-row">
          <span>${escapeHtml(staffName(view.staffId))}</span>
          <strong>수업 ${view.summary?.totalLectures || (view.lectures || []).length} · 예약 ${view.summary?.reservedCount || 0}</strong>
          <span class="chip ${view.summary?.uncheckedAttendanceCount ? 'bad' : 'good'}">미체크 ${view.summary?.uncheckedAttendanceCount || 0}</span>
        </div>
      `);
    }

    function adminSummaryClassRows(views) {
      return views.flatMap((view) => (view.lectures || []).map((lecture) => ({
        view,
        lecture,
        key: adminLectureDetailKey(view, lecture),
        sortTime: timestampMillis(lecture.startAt) || Date.parse(`${view.date || appState.selectedDate}T${lectureTimeText(lecture).slice(0, 5)}:00+09:00`) || 0
      })))
      .sort((a, b) => a.sortTime - b.sortTime || staffName(a.view.staffId).localeCompare(staffName(b.view.staffId), 'ko'))
      .map(({ view, lecture, key }) => {
        const lessonType = resolvedLessonType(lecture);
        const open = appState.detailLectureId === key;
        return `
          <button class="detail-row ${open ? 'active' : ''}" type="button" data-admin-detail-lecture="${escapeAttr(key)}">
            <span>${escapeHtml(staffName(view.staffId))}</span>
            <strong>${escapeHtml(lectureTimeText(lecture))} ${escapeHtml(lecture.title || '수업')}</strong>
            <span class="chip ${lessonType === 'private' ? 'private' : lessonType === 'group' ? 'group' : 'unknown'}">${lessonLabel(lessonType)} · ${lecture.bookingCount || 0}/${lecture.capacity || '-'}</span>
          </button>
          ${open ? renderDetailBookings(lecture) : ''}
        `;
      });
    }

    function adminLectureDetailKey(view, lecture) {
      return `${view.staffId || ''}__${lecture.lectureId || ''}`;
    }

    function renderDetailBookings(lecture) {
      const bookings = (lecture.bookings || []).filter((booking) => !['cancel', 'wait_cancel'].includes(booking.appStatus));
      return `
        <div class="detail-bookings">
          ${bookings.map((booking) => `
            <div class="detail-booking">
              <button class="member-name" type="button" data-action-member="${escapeAttr(booking.memberId || booking.memberName || '')}">${escapeHtml(booking.memberName || '회원')}</button>
              <span class="chip ${statusClass(booking)}">${statusLabel(booking)}</span>
            </div>
          `).join('') || '<div class="empty">예약 회원이 없습니다</div>'}
        </div>
      `;
    }

    function adminSummaryMemberRows(views) {
      return views.flatMap((view) => (view.lectures || []).flatMap((lecture) => (lecture.bookings || [])
        .filter((booking) => !['cancel', 'wait_cancel'].includes(booking.appStatus))
        .map((booking) => `
          <button class="detail-row" type="button" data-action-member="${escapeAttr(booking.memberId || booking.memberName || '')}">
            <span>${escapeHtml(lectureTimeText(lecture))}</span>
            <strong>${escapeHtml(booking.memberName || '회원')}</strong>
            <span class="chip ${statusClass(booking)}">${escapeHtml(staffName(view.staffId))} · ${statusLabel(booking)}</span>
          </button>
        `)));
    }

    function adminSummaryAlertRows(views) {
      return adminActionItems(views, appState.selectedDate).map((item) => renderActionRow(item));
    }

    function renderActionRow(item, options = {}) {
      const messageMeta = actionMessageMeta(item);
      const targetDate = actionDate(item);
      const bodyText = actionDisplayBody(item);
      const sendButton = messageMeta
        ? `<button class="action-send ${escapeAttr(messageMeta.mode)}" type="button" data-action-send="${escapeAttr(item.actionKey || '')}" data-action-type="${escapeAttr(item.type || '')}" data-action-title="${escapeAttr(item.title || '')}" data-action-date="${escapeAttr(targetDate)}" data-action-message-mode="${escapeAttr(messageMeta.mode)}" data-action-message-detail="${escapeAttr(messageMeta.detail || '')}" ${messageMeta.disabled ? 'disabled' : ''}>${escapeHtml(messageMeta.label)}</button>`
        : '';
      return `
        <div class="detail-row action-row">
          <button class="tiny action-complete" type="button" data-action-complete="${escapeAttr(item.actionKey || '')}" data-action-date="${escapeAttr(targetDate)}" aria-label="액션 완료">✓</button>
          ${item.memberKey ? `<button class="action-content" type="button" data-action-member="${escapeAttr(item.memberKey)}">` : '<div class="action-content">'}
            <span>${escapeHtml(item.type)}</span>
            <strong>${escapeHtml(item.title)}</strong>
            <span class="chip ${item.level || 'wait'}">${escapeHtml(bodyText)}</span>
          ${item.memberKey ? '</button>' : '</div>'}
          ${sendButton}
        </div>
      `;
    }

    function actionMessageMeta(item) {
      if (!item?.memberKey) return '';
      const status = String(item?.alimtalkStatus || '');
      const rule = alimtalkRuleMeta(item);
      if (status === 'sent') return { label: '발송완료', mode: 'auto', detail: rule.label || '' };
      if (status === 'queued') return { label: '발송대기', mode: 'auto', detail: rule.label || '' };
      if (status === 'skipped') return { label: '제외', mode: 'review', detail: rule.label || '' };
      if (status === 'failed') return { label: '발송실패', mode: 'review', detail: rule.label || '' };
      if (rule.key) {
        if (rule.status === 'APPROVED') return { label: rule.label, mode: 'auto', detail: rule.detail || '' };
        return { label: `${rule.label} 검수중`, mode: 'pending', detail: rule.detail || '', disabled: true };
      }
      const type = String(item?.type || '');
      if (type === '장기미방문') return { label: '확인필요', mode: 'review' };
      if (type === '출석률' || type === '결석증가') return { label: '확인필요', mode: 'review' };
      if (type === '케어확인') return { label: '메모확인', mode: 'review' };
      return '';
    }

    function actionDisplayBody(item) {
      const body = String(item?.body || '').trim();
      const rule = alimtalkRuleMeta(item);
      const reason = rule.key ? rule : actionReasonMeta(item);
      if (!reason) return body;
      if (body.includes(reason.label)) return body;
      return body ? `${reason.label} · ${body}` : reason.label;
    }

    function actionReasonMeta(item) {
      if (String(item?.type || '') !== '수강권') return null;
      const body = String(item?.body || '');
      const remaining = Number(body.match(/(\d+)\s*회/)?.[1]);
      const lowRemaining = Number.isFinite(remaining) && remaining >= 0 && remaining < 5;
      const expired = body.includes('만료') && !body.includes('만료임박');
      const expiringSoon = body.includes('만료임박');
      if (expired) return { key: 'expired', label: '기간만료' };
      if (lowRemaining && expiringSoon) return { key: 'lowAndSoon', label: '잔여/기간' };
      if (lowRemaining) return { key: 'lowRemaining', label: '잔여부족' };
      if (expiringSoon) return { key: 'expiringSoon', label: '기간임박' };
      return { key: 'ticketCheck', label: '수강권확인' };
    }

    function alimtalkTemplateMeta(code) {
      const map = {
        KA01TP2605131325462341f8ACO2THW6: { key: 'reservationOpen', label: '예약 안내', status: 'APPROVED', detail: '예약 오픈 안내' },
        KA01TP260514081318309wQGfeIJxIAJ: { key: 'newMember', label: '신규회원', status: 'APPROVED', detail: '신규회원 웰컴' },
        KA01TP260514145047261araXgWLVFRs: { key: 'groupPeriod', label: '그룹 기간 임박', status: 'INSPECTING', detail: '그룹 기간권 만료 14일 이내' },
        KA01TP260514145047393VpTbcCZKkCV: { key: 'groupCount', label: '그룹 횟수 부족', status: 'INSPECTING', detail: '그룹 횟수권 잔여 5회 미만' },
        KA01TP260514152235608d9icGOBotnV: { key: 'privateCount', label: '프라이빗 횟수 부족', status: 'INSPECTING', detail: '프라이빗 횟수권 잔여 3회 이하' },
        KA01TP260514153314927WH270IppWQS: { key: 'privatePeriod', label: '프라이빗 기간 임박', status: 'HOLD', detail: '운영 보류' },
        KA01TP260514153632171uiWXYoeiOLS: { key: 'privateSurvey', label: '프라이빗 설문 필요', status: 'INSPECTING', detail: '첫 프라이빗 등록/예약' }
      };
      return map[String(code || '')] || null;
    }

    function alimtalkRuleMeta(item) {
      const template = alimtalkTemplateMeta(item?.alimtalkTemplateCode || item?.templateCode);
      if (template) return template;
      const candidateType = String(item?.alimtalkType || item?.candidateType || '');
      const typeMap = {
        new_member: { key: 'newMember', label: '신규회원', status: 'APPROVED', detail: '신규회원 웰컴' },
        ticket_expiring: { key: 'groupPeriod', label: '그룹 기간 임박', status: 'INSPECTING', detail: '수강권 기간 임박' },
        remaining_low: { key: 'groupCount', label: '그룹 횟수 부족', status: 'INSPECTING', detail: '수강권 잔여횟수 부족' },
        private_count_low: { key: 'privateCount', label: '프라이빗 횟수 부족', status: 'INSPECTING', detail: '프라이빗 잔여횟수 부족' },
        private_survey: { key: 'privateSurvey', label: '프라이빗 설문 필요', status: 'INSPECTING', detail: '프라이빗 사전설문' }
      };
      if (typeMap[candidateType]) return typeMap[candidateType];
      const reason = actionReasonMeta(item);
      if (reason?.key === 'lowRemaining') return { key: 'groupCount', label: '그룹 횟수 부족', status: 'INSPECTING', detail: '잔여횟수 부족' };
      if (reason?.key === 'expiringSoon') return { key: 'groupPeriod', label: '그룹 기간 임박', status: 'INSPECTING', detail: '기간 만료 임박' };
      if (reason?.key === 'lowAndSoon') return { key: 'groupTicketRisk', label: '그룹 수강권 확인', status: 'INSPECTING', detail: '기간/횟수 동시 확인' };
      return {};
    }

    function actionAutomationStats(rows) {
      return (rows || []).reduce((stats, row) => {
        const meta = actionMessageMeta(row);
        const rule = alimtalkRuleMeta(row);
        const reason = rule.key ? rule : actionReasonMeta(row);
        if (meta?.mode === 'auto') {
          stats.auto += 1;
        }
        if (meta?.mode === 'pending') stats.pending += 1;
        if (meta?.mode === 'review') stats.review += 1;
        if (reason && meta) stats.reasons[reason.key] = (stats.reasons[reason.key] || 0) + 1;
        return stats;
      }, { auto: 0, pending: 0, review: 0, reasons: {} });
    }

    function renderActionReasonSummary(stats) {
      const labels = [
        ['newMember', '신규'],
        ['privateSurvey', '설문'],
        ['privateCount', 'P잔여'],
        ['groupCount', 'G잔여'],
        ['groupPeriod', 'G기간'],
        ['groupTicketRisk', 'G확인'],
        ['reservationOpen', '예약'],
        ['lowAndSoon', '잔여/기간'],
        ['lowRemaining', '잔여부족'],
        ['expiringSoon', '기간임박'],
        ['expired', '기간만료'],
        ['ticketCheck', '수강권확인']
      ];
      return labels
        .filter(([key]) => stats?.reasons?.[key])
        .map(([key, label]) => `<span class="chip profile">${escapeHtml(label)} ${stats.reasons[key]}</span>`)
        .join('');
    }

    function alimtalkCandidateByActionKey() {
      const map = new Map();
      (appState.admin.alimtalkCandidates || []).forEach((candidate) => {
        if (candidate.sourceActionKey) map.set(candidate.sourceActionKey, candidate);
      });
      return map;
    }

    function alimtalkCandidateActionItems(date = appState.selectedDate, options = {}) {
      const completed = completedAdminActionKeys(date);
      const includeLinked = Boolean(options.includeLinked);
      return (appState.admin.alimtalkCandidates || [])
        .filter((candidate) => includeLinked || !candidate.sourceActionKey)
        .filter((candidate) => !['sent', 'skipped'].includes(String(candidate.status || '')))
        .filter((candidate) => !date || !candidate.sourceDate || candidate.sourceDate === date)
        .map((candidate) => {
          const rule = alimtalkRuleMeta(candidate);
          const actionKey = `alimtalk_${candidate.candidateId || stableActionCandidateKey(candidate)}`;
          return {
            actionKey,
            type: rule.label || candidate.title || '알림톡',
            title: candidate.memberName || '회원',
            body: candidate.reason || rule.detail || '',
            level: rule.status === 'APPROVED' ? 'good' : 'wait',
            memberKey: candidate.memberId || candidate.memberName || '',
            sort: `0_${candidate.sourceDate || date}_${rule.key || 'alimtalk'}_${candidate.memberName || ''}`,
            sourceDate: candidate.sourceDate || date,
            alimtalkCandidateId: candidate.candidateId || '',
            alimtalkType: candidate.type || '',
            alimtalkStatus: candidate.status || '',
            alimtalkTemplateCode: candidate.templateCode || '',
            alimtalkReason: candidate.reason || ''
          };
        })
        .filter((item) => item.actionKey && !completed.has(item.actionKey));
    }

    function stableActionCandidateKey(candidate) {
      return [
        candidate.memberId || candidate.memberName || 'member',
        candidate.type || 'alimtalk',
        candidate.sourceDate || '',
        candidate.templateCode || ''
      ].join('_');
    }

    function adminActionItemsForViewsByDate(views) {
      const dates = [...new Set([
        ...(views || []).map((view) => view.date).filter(Boolean),
        ...(appState.admin.alimtalkCandidates || []).map((candidate) => candidate.sourceDate).filter(Boolean)
      ])].sort();
      return dedupeAdminActions(dates
        .flatMap((date) => adminActionItems(views.filter((view) => view.date === date), date))
        .sort((a, b) =>
          actionDate(a).localeCompare(actionDate(b)) ||
          String(a.sort || '').localeCompare(String(b.sort || ''), 'ko') ||
          String(a.title || '').localeCompare(String(b.title || ''), 'ko')
        ), { range: true });
    }

    function adminActionItems(views, date = appState.selectedDate) {
      const completed = completedAdminActionKeys(date);
      const actionViews = views.filter((view) => view.date <= reservationOpenEndDate(today()));
      const serverActions = normalizedAdminActions(views, date);
      if (serverActions.length) {
        return dedupeAdminActions([
          ...serverActions.filter((action) => actionDate(action, date) <= reservationOpenEndDate(today())),
          ...alimtalkCandidateActionItems(date)
        ]);
      }
      const rows = [];
      actionViews.forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          const reserved = (lecture.bookings || []).filter((booking) => booking.appStatus === 'reserved');
          const capacity = Math.max(0, Number(lecture.capacity || 0));
          if (resolvedLessonType(lecture) === 'group' && capacity >= 3 && reserved.length <= 3) {
            rows.push({
              type: '예약저조',
              title: `${lectureTimeText(lecture)} ${lecture.title || '수업'}`,
              body: `${staffName(view.staffId)} · 예약 ${reserved.length}/${capacity}`,
              level: 'wait',
              actionKey: `local_low_class_${view.date}_${lecture.lectureId || lectureTimeText(lecture)}`,
              sort: `4_${view.date}_${lectureTimeText(lecture)}`
            });
          }
          reserved
            .filter((booking) => booking.attendanceStatus === 'unchecked' && isLectureDone(lecture))
            .forEach((booking) => {
              rows.push({
                type: '출석미체크',
                title: `${booking.memberName || '회원'} · ${lectureTimeText(lecture)} ${lecture.title || '수업'}`,
                body: staffName(view.staffId),
                level: 'bad',
                memberKey: booking.memberId || booking.memberName,
                actionKey: `local_attendance_unchecked_${booking.bookingId || `${view.date}_${lecture.lectureId}_${booking.memberName || ''}`}`,
                sort: `3_${view.date}_${lectureTimeText(lecture)}_${booking.memberName || ''}`
              });
            });
        });
      });
      rows.push(...memberActionItems(views, date));
      rows.push(...careActionItems(views, date));
      rows.push(...alimtalkCandidateActionItems(date));
      return dedupeAdminActions(rows
        .filter((row) => row.actionKey && !completed.has(row.actionKey))
        .sort((a, b) => String(a.sort || '').localeCompare(String(b.sort || ''), 'ko')))
        .slice(0, 80);
    }

    function normalizedAdminActions(views, date = appState.selectedDate) {
      const completed = completedAdminActionKeys(date);
      const candidateMap = alimtalkCandidateByActionKey();
      return dedupeAdminActions(adminActionsForDate(date).map((action) => ({
        actionKey: action.actionKey || '',
        type: action.label || action.type || '액션',
        title: action.title || '',
        body: action.body || '',
        level: action.level || 'wait',
        memberKey: action.memberId || action.memberName || '',
        sort: action.sort || '',
        alimtalkCandidateId: candidateMap.get(action.actionKey || '')?.candidateId || '',
        alimtalkType: candidateMap.get(action.actionKey || '')?.type || '',
        alimtalkStatus: candidateMap.get(action.actionKey || '')?.status || '',
        alimtalkTemplateCode: candidateMap.get(action.actionKey || '')?.templateCode || '',
        alimtalkReason: candidateMap.get(action.actionKey || '')?.reason || ''
      }))
        .filter((action) => action.actionKey && !completed.has(action.actionKey))
        .filter((action) => action.type !== '출석저조')
        .filter((action) => action.type !== '장기미방문' || hasActiveTicketForMemberKey(views, action.memberKey, date))
        .filter((action) => action.type !== '수강권' || !hasOtherActiveTicketForMemberKey(views, action.memberKey, date))
        .sort((a, b) => String(a.sort || '').localeCompare(String(b.sort || ''), 'ko')));
    }

    function dedupeAdminActions(actions, options = {}) {
      const map = new Map();
      (actions || []).forEach((action) => {
        const key = adminActionDedupeKey(action, options);
        const current = map.get(key);
        if (!current || compareActionImportance(action, current) < 0) map.set(key, action);
      });
      return [...map.values()].sort((a, b) =>
        String(a.sort || '').localeCompare(String(b.sort || ''), 'ko') ||
        String(a.title || '').localeCompare(String(b.title || ''), 'ko')
      );
    }

    function adminActionDedupeKey(action, options = {}) {
      const type = String(action?.type || '');
      const member = String(action?.memberKey || action?.title || '').trim();
      if (['수강권', '장기미방문', '출석률', '결석증가', '케어확인'].includes(type) && member) {
        return `${type}_${member}`;
      }
      if (options.range && type === '예약저조') {
        return `${type}_${actionDate(action)}_${action.title || ''}_${action.body || ''}`;
      }
      return action?.actionKey || `${type}_${action?.title || ''}_${action?.body || ''}`;
    }

    function compareActionImportance(a, b) {
      const rank = (item) => {
        const levelScore = item?.level === 'bad' ? 0 : item?.level === 'wait' ? 1 : 2;
        const typeOrder = {
          '수강권': 0,
          '출석미체크': 1,
          '출석률': 2,
          '결석증가': 3,
          '장기미방문': 4,
          '예약저조': 5,
          '케어확인': 6
        }[item?.type] ?? 9;
        const count = Number(String(item?.body || '').match(/(\d+)회/)?.[1]);
        const countScore = Number.isFinite(count) ? count : 999;
        return [typeOrder, levelScore, countScore, String(item?.sort || '')];
      };
      const left = rank(a);
      const right = rank(b);
      for (let index = 0; index < left.length; index += 1) {
        if (left[index] < right[index]) return -1;
        if (left[index] > right[index]) return 1;
      }
      return 0;
    }

    function actionDate(action, fallbackDate = appState.selectedDate) {
      return action?.sourceDate || action?.date || String(action.sort || action.actionKey || '').match(/\d{4}-\d{2}-\d{2}/)?.[0] || fallbackDate;
    }

    function reservationOpenEndDate(baseDate) {
      const base = new Date(`${baseDate}T00:00:00+09:00`);
      const daysSinceMonday = (base.getDay() + 6) % 7;
      return addDays(baseDate, 13 - daysSinceMonday);
    }

    function hasActiveTicketForMemberKey(views, memberKey, date = appState.selectedDate) {
      if (!memberKey) return false;
      const records = [];
      views.forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (booking.memberId === memberKey || booking.memberName === memberKey) {
              records.push({ view, lecture, booking });
            }
          });
        });
      });
      return hasActiveTicketRecord(records, date);
    }

    function hasOtherActiveTicketForMemberKey(views, memberKey, date = appState.selectedDate) {
      if (!memberKey) return false;
      const records = [];
      views.forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || []).forEach((booking) => {
            if (booking.memberId === memberKey || booking.memberName === memberKey) {
              records.push({ view, lecture, booking });
            }
          });
        });
      });
      const target = records.find((item) =>
        item.booking.appStatus === 'reserved' &&
        item.view.date >= date &&
        isTicketActionable(item.booking)
      );
      return Boolean(target && hasOtherActiveTicket(records, target, date));
    }

    function adminActionStateForDate(date) {
      if (date === appState.selectedDate && appState.admin.actionsState) return appState.admin.actionsState;
      return (appState.admin.rangeActions || []).find((item) => item.date === date) || null;
    }

    function adminActionsForDate(date) {
      const state = adminActionStateForDate(date);
      return state?.actions || [];
    }

    function completedAdminActionKeys(date = appState.selectedDate) {
      return new Set(adminActionStateForDate(date)?.completedActionKeys || []);
    }

    function memberActionItems(views, date = appState.selectedDate) {
      const map = new Map();
      views.forEach((view) => {
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || [])
            .filter((booking) => !['cancel', 'wait_cancel'].includes(booking.appStatus))
            .forEach((booking) => {
              const key = booking.memberId || booking.memberName;
              if (!key) return;
              const row = map.get(key) || { memberId: booking.memberId, memberName: booking.memberName, records: [] };
              row.records.push({ view, lecture, booking });
              row.memberName = row.memberName || booking.memberName;
              map.set(key, row);
            });
        });
      });
      return [...map.values()].flatMap((row) => memberActionRows(row, date));
    }

    function careActionItems(views, date = appState.selectedDate) {
      const map = new Map();
      views.forEach((view) => {
        if (view.date !== date) return;
        (view.lectures || []).forEach((lecture) => {
          (lecture.bookings || [])
            .filter((booking) => booking.appStatus === 'reserved')
            .forEach((booking) => {
              const tags = (booking.tags || []).filter((tag) =>
                ['warning', 'danger'].includes(tag.level) ||
                tag.source === 'auto_memo' ||
                tag.source === 'manual'
              );
              if (!tags.length) return;
              const memberKey = booking.memberId || booking.memberName;
              const label = uniqueValues(tags.map((tag) => tag.label || tag.tagId)).slice(0, 2).join(', ');
              if (!memberKey || map.has(memberKey)) return;
              map.set(memberKey, {
                type: '케어확인',
                title: booking.memberName || '회원',
                body: `${staffName(view.staffId)} · ${lectureTimeText(lecture)} · ${label || '메모 확인'}`,
                level: 'wait',
                memberKey,
                actionKey: `local_care_review_${date}_${memberKey}`,
                sort: `6_${booking.memberName || memberKey}`
              });
            });
        });
      });
      return [...map.values()];
    }

    function memberActionRows(row, date = appState.selectedDate) {
      const records = row.records
        .slice()
        .sort((a, b) => String(a.view.date || '').localeCompare(String(b.view.date || '')) || lectureTimeText(a.lecture).localeCompare(lectureTimeText(b.lecture)));
      const memberName = row.memberName || '회원';
      const actions = [];
      const ticketRisk = records.find((item) =>
        item.booking.appStatus === 'reserved' &&
        item.view.date >= date &&
        isTicketActionable(item.booking) &&
        !hasOtherActiveTicket(records, item, date)
      );
      if (ticketRisk) {
        const remaining = ticketRemainingText(ticketRisk.booking.ticketRemainingCount);
        const expired = ticketRisk.booking.ticketExpiryLevel === 'expired' || isTicketExpired(ticketRisk.booking.ticketExpiresAt);
        actions.push({
          actionKey: `local_ticket_expiring_${row.memberId || row.memberName}`,
          type: '수강권',
          title: memberName,
          body: `${expired ? '만료' : '만료임박'}${remaining}`,
          level: expired ? 'bad' : 'wait',
          memberKey: row.memberId || row.memberName,
          sort: `0_${memberName}`
        });
      }

      const selected = date;
      if (selected <= today()) {
        const recentStart = addDays(selected, -13);
        const previousStart = addDays(selected, -27);
        const previousEnd = addDays(selected, -14);
        const previous = records.filter((item) => item.view.date >= previousStart && item.view.date <= previousEnd && item.booking.appStatus === 'reserved');
        const recent = records.filter((item) => item.view.date >= recentStart && item.view.date <= selected && item.booking.appStatus === 'reserved');
        const previousRate = attendanceRateForRecords(previous);
        const recentRate = attendanceRateForRecords(recent);
        const recentAbsent = recent.filter((item) => ['absent', 'late_cancel'].includes(item.booking.attendanceStatus)).length;
        if (previous.length >= 2 && recent.length >= 2 && previousRate >= 0.7 && (recentRate <= 0.5 || previousRate - recentRate >= 0.35)) {
          actions.push({
            actionKey: `local_attendance_drop_${row.memberId || row.memberName}`,
            type: '출석률',
            title: memberName,
            body: `${percentText(previousRate)} → ${percentText(recentRate)}`,
            level: 'bad',
            memberKey: row.memberId || row.memberName,
            sort: `1_${memberName}`
          });
        } else if (recentAbsent >= 2) {
          actions.push({
            actionKey: `local_attendance_drop_${row.memberId || row.memberName}`,
            type: '결석증가',
            title: memberName,
            body: `최근 결석 ${recentAbsent}회`,
            level: 'bad',
            memberKey: row.memberId || row.memberName,
            sort: `1_${memberName}`
          });
        }

        const attendedRecords = records.filter((item) => item.booking.attendanceStatus === 'attended');
        const lastAttended = attendedRecords.at(-1);
        if (lastAttended && daysBetween(lastAttended.view.date, selected) >= 21 && hasActiveTicketRecord(records, selected)) {
          actions.push({
            actionKey: `local_long_absence_${row.memberId || row.memberName}`,
            type: '장기미방문',
            title: memberName,

    function renderStudioDayTimetable(date, events, title) {
      if (!events.length) return '<section class="empty">선택한 날짜의 일정이 없습니다</section>';
      const layout = layoutTimetableEvents(events);
      const timeMarks = timetableMarks(layout.startMinute, layout.endMinute);
      return `
        <section class="admin-panel timetable-panel">
          <div class="day-operation-head">
            <h2>${escapeHtml(title)}</h2>
          </div>
          <div class="studio-timetable studio-day" style="--range-minutes:${layout.rangeMinutes};">
            <div class="studio-time-axis">
              ${timeMarks.map((minute) => `
                <span class="studio-time-label" style="top:${((minute - layout.startMinute) / layout.rangeMinutes) * 100}%;">${minuteLabel(minute)}</span>
              `).join('')}
            </div>
            <div class="studio-canvas">
              ${timeMarks.map((minute) => `
                <span class="studio-hour-line" style="top:${((minute - layout.startMinute) / layout.rangeMinutes) * 100}%;"></span>
              `).join('')}
              ${layout.events.map((event) => renderTimetableBlock(event, layout.startMinute, layout.rangeMinutes)).join('')}
            </div>
          </div>
        </section>
      `;
    }

    function timetableEventsForDate(views, date) {
      const events = adminTimelineRows(views).map(({ view, lecture }) => {
        const range = lectureMinuteRange(lecture, date);
        const lessonType = resolvedLessonType(lecture);
        const capacity = Number(lecture.capacity || 0) || (lessonType === 'group' ? 5 : Math.max(1, lecture.bookingCount || 1));
        const activeBookings = (lecture.bookings || []).filter((booking) => !['cancel', 'wait_cancel'].includes(booking.appStatus));
        const memberLabel = activeBookings.map((booking) => booking.memberName).filter(Boolean).slice(0, 2).join(', ');
        return range ? {
          kind: lessonType === 'private' ? 'private' : 'class',
          staffId: view.staffId,
          head: lessonType === 'private' ? (memberLabel || lecture.title || '프라이빗') : `${lecture.bookingCount || 0}/${capacity}`,
          title: lessonType === 'private' ? (lecture.title || '프라이빗') : (lecture.title || '수업'),
          time: lectureTimeText(lecture).slice(0, 5),
          meta: `${staffName(view.staffId)} · ${lessonLabel(lessonType)}${lecture.waitCount ? ` · 대기 ${lecture.waitCount}` : ''}`,
          color: staffColor(view.staffId),
          range,
          lectureId: lecture.lectureId
        } : null;
      }).filter(Boolean);
      adminConsultationsForDate(date).forEach((item) => {
        const ids = scheduleStaffIds(item);
        const targetIds = ids.length ? ids : [appState.admin.selectedStaffId || item.staffId || ''];
        targetIds.filter(Boolean).forEach((staffId) => {
          const range = lectureMinuteRange(item, date);
          if (!range) return;
          events.push({
            kind: 'consult',
            staffId,
            head: item.memberName || '상담',
            title: '상담',
            time: consultationTimeText(item).slice(0, 5),
            meta: scheduleStaffLabel(item),
            color: '#6D6882',
            range
          });
        });
      });
      adminOtherSchedulesForDate(date).forEach((item) => {
        const ids = scheduleStaffIds(item);
        const targetIds = ids.length ? ids : [appState.admin.selectedStaffId || item.staffId || ''];
        targetIds.filter(Boolean).forEach((staffId) => {
          const range = lectureMinuteRange(item, date);
          if (!range) return;
          events.push({
            kind: 'other',
            staffId,
            head: item.title || '기타일정',
            title: item.category || '기타',
            time: consultationTimeText(item).slice(0, 5),
            meta: scheduleStaffLabel(item),
            color: '#3B436D',
            range
          });
        });
      });
      return events.sort((a, b) =>
        a.range.start - b.range.start ||
        staffName(a.staffId).localeCompare(staffName(b.staffId), 'ko') ||
        String(a.title || '').localeCompare(String(b.title || ''), 'ko')
      );
    }

    function renderTimetableBlock(event, startMinute, rangeMinutes) {
      const range = event.range;
      if (!range) return '';
      const top = Math.max(0, ((range.start - startMinute) / rangeMinutes) * 100);
      const height = Math.max(4, ((range.end - range.start) / rangeMinutes) * 100);
      const tag = event.lectureId ? 'button' : 'div';
      const attrs = event.lectureId ? `type="button" data-toggle-lecture="${escapeAttr(event.lectureId)}"` : '';
      const laneCount = Math.max(1, Number(event.laneCount) || 1);
      const lane = Math.min(laneCount - 1, Math.max(0, Number(event.lane) || 0));
      const laneGap = laneCount > 1 ? 3 : 4;
      const left = (lane / laneCount) * 100;
      const width = 100 / laneCount;
      return `
        <${tag} class="studio-event ${escapeAttr(event.kind)} staff-tone" ${attrs} style="--staff-color:${escapeAttr(event.color || staffColor(event.staffId))}; --top:${top}%; --height:${height}%; --left:${left.toFixed(3)}%; --width:${width.toFixed(3)}%; --lane-gap:${laneGap}px;">
          <strong>${escapeHtml(event.head || event.title || '일정')}</strong>
          <em>${escapeHtml(event.time || '')}</em>
          <span>${escapeHtml(event.title || '')}</span>
          <small>${escapeHtml(event.meta || '')}</small>
        </${tag}>
      `;
    }

    function layoutTimetableEvents(events, fixedRange = null) {
      const sorted = (events || [])
        .filter((event) => event?.range)
        .map((event) => ({ ...event }))
        .sort((a, b) =>
          a.range.start - b.range.start ||
          a.range.end - b.range.end ||
          String(a.staffId || '').localeCompare(String(b.staffId || ''), 'ko') ||
          String(a.title || '').localeCompare(String(b.title || ''), 'ko')
        );
      const range = fixedRange || timetableRange(sorted);
      overlappingEventGroups(sorted).forEach((group) => {
        const laneEnds = [];
        group.events.forEach((event) => {
          let lane = laneEnds.findIndex((end) => end <= event.range.start);
          if (lane < 0) {
            lane = laneEnds.length;
            laneEnds.push(0);
          }
          laneEnds[lane] = event.range.end;
          event.lane = lane;
        });
        const laneCount = Math.max(1, laneEnds.length);
        group.events.forEach((event) => {
          event.laneCount = laneCount;
        });
      });
      return {
        ...range,
        events: sorted,
        rangeMinutes: Math.max(120, range.endMinute - range.startMinute)
      };
    }

    function overlappingEventGroups(events) {
      const groups = [];
      (events || []).forEach((event) => {
        const last = groups.at(-1);
        if (!last || event.range.start >= last.end) {
          groups.push({ end: event.range.end, events: [event] });
          return;
        }
        last.events.push(event);
        last.end = Math.max(last.end, event.range.end);
      });
      return groups;
    }

    function timetableRange(events) {
      const ranges = (events || []).map((event) => event.range).filter(Boolean);
      if (!ranges.length) {
        return { startMinute: 8 * 60, endMinute: 22 * 60 };
      }
      const minStart = Math.min(...ranges.map((range) => range.start));
      const maxEnd = Math.max(...ranges.map((range) => range.end));
      return {
        startMinute: Math.max(0, Math.min(8 * 60, Math.floor(minStart / 60) * 60)),
        endMinute: Math.min(24 * 60, Math.max(22 * 60, Math.ceil(maxEnd / 60) * 60))
      };
    }

    function timetableMarks(startMinute, endMinute) {
      const marks = [];
      for (let minute = startMinute; minute <= endMinute; minute += 60) marks.push(minute);
      return marks;
    }

    function lectureMinuteRange(lecture, date) {
      const start = timestampToDate(lecture.startAt);
      const end = timestampToDate(lecture.endAt);
      if (start && end) {
        return {
          start: start.getHours() * 60 + start.getMinutes(),
          end: Math.max(start.getHours() * 60 + start.getMinutes() + 30, end.getHours() * 60 + end.getMinutes())
        };
      }
      const match = lectureTimeText(lecture).match(/(\d{2}):(\d{2})-(\d{2}):(\d{2})/);
      if (!match) return null;
      const startMinute = Number(match[1]) * 60 + Number(match[2]);
      const endMinute = Number(match[3]) * 60 + Number(match[4]);
      return { start: startMinute, end: Math.max(startMinute + 30, endMinute) };
    }

    function minuteLabel(minute) {
      const hour = String(Math.floor(minute / 60)).padStart(2, '0');
      return `${hour}:00`;
    }

    function adminTimelineRows(views) {
      return views.flatMap((view) => (view.lectures || []).map((lecture) => ({

    function renderTimelineLecture(view, lecture) {

      const lessonType = resolvedLessonType(lecture);

      const lastYearYtd = dashboardYtdRevenue(dashboardSameMonthLastYear(month));
      const activeMembers = dashboardMonthlyActiveValue(month);
      const prevActiveMembers = dashboardMonthlyActiveValue(previousMonthKey(month));
      const revenueReady = dashboardRowHasAny(row, ['총매출', '수업매출']);
      const classMetricReady = dashboardRowHasAny(row, ['예약률', '출석률', '마진률', '그룹세션', '프라이빗']);
      return `
        <section class="admin-grid">
          <div class="admin-panel">
            <h2>${escapeHtml(month.slice(0, 4))}년 연 누적 총매출</h2>
            <div class="dashboard-kpis compact">
              ${dashboardKpi('연 누적 총매출', dashboardMoneyShort(ytd), dashboardRateDelta(ytd, lastYearYtd, 'vs 작년 동기'), { wide: true })}
              ${dashboardKpi('월 총매출', revenueReady ? dashboardMoneyShort(row.총매출 || 0) : '집계 전', revenueReady ? dashboardRateDelta(row.총매출, prev.총매출, '전월 대비') : null)}
              ${dashboardKpi('월 수업매출', revenueReady ? dashboardMoneyShort(row.수업매출 || 0) : '집계 전', revenueReady ? dashboardRateDelta(row.수업매출, prev.수업매출, '전월 대비') : null)}
            </div>
          </div>
          <div class="admin-panel">
            <h2>${escapeHtml(month)} 핵심지표</h2>
            <div class="dashboard-kpis compact">
              ${dashboardKpi('유효회원', activeMembers || '-', dashboardPlainDelta(activeMembers, prevActiveMembers, '명'))}
              ${dashboardKpi('그룹 예약률', classMetricReady ? dashboardPercentText(row.예약률 || 0) : '집계 전', classMetricReady ? dashboardPointDelta(row.예약률, prev.예약률) : null)}
              ${dashboardKpi('그룹 출석률', classMetricReady ? dashboardPercentText(row.출석률 || 0) : '집계 전', classMetricReady ? dashboardPointDelta(row.출석률, prev.출석률) : null)}
              ${dashboardKpi('수업 마진률', classMetricReady ? dashboardPercentText(row.마진률 || 0) : '집계 전', classMetricReady ? dashboardPointDelta(row.마진률, prev.마진률) : null)}
              ${dashboardKpi('그룹 세션', classMetricReady ? `${Math.round(Number(row.그룹세션) || 0)}회` : '집계 전', classMetricReady ? dashboardPlainDelta(row.그룹세션, prev.그룹세션, '회') : null)}
              ${dashboardKpi('프라이빗', classMetricReady ? `${Math.round(Number(row.프라이빗) || 0)}회` : '집계 전', classMetricReady ? dashboardPlainDelta(row.프라이빗, prev.프라이빗, '회') : null)}
            </div>
          </div>
        </section>
      `;
    }

    function dashboardRowHasAny(row, keys) {
      return Boolean(row && keys.some((key) => Number(row[key]) > 0));
    }

    function dashboardKpi(label, value, delta = null, options = {}) {
      const cls = ['dashboard-kpi', options.wide ? 'wide' : ''].filter(Boolean).join(' ');
      const deltaHtml = delta ? `<em class="${escapeAttr(delta.className || '')}">${escapeHtml(delta.text || '')}</em>` : '';
      return `<div class="${cls}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(String(value || '-'))}</strong>${deltaHtml}</div>`;
    }

    function dashboardSummaryRows() {
      const dashboard = appState.admin.dashboard || {};
      const rows = Array.isArray(dashboard.summary)
        ? dashboard.summary
        : (Array.isArray(dashboard.요약) ? dashboard.요약 : []);
      return rows
        .filter((row) => row && String(row.월 || row.month || '').slice(0, 7))
        .map((row) => ({ ...row, 월: String(row.월 || row.month || '').slice(0, 7) }))
        .sort((a, b) => String(a.월).localeCompare(String(b.월)));
    }

    function dashboardMonthRow(month) {
      return dashboardSummaryRows().find((row) => row.월 === month) || {};
    }

    function dashboardPreviousMonthRow(month) {
      return dashboardMonthRow(previousMonthKey(month));
    }

    function dashboardYtdRevenue(month) {
      const year = String(month || '').slice(0, 4);
      return dashboardSummaryRows()
        .filter((row) => row.월 <= month && row.월.startsWith(year))
        .reduce((total, row) => total + (Number(row.총매출) || 0), 0);
    }

    function dashboardSameMonthLastYear(month) {
      const year = Number(String(month || '').slice(0, 4));
      const suffix = String(month || '').slice(4);
      return Number.isFinite(year) ? `${year - 1}${suffix}` : '';
    }

    function previousMonthKey(month) {
      const date = new Date(`${month}-01T00:00:00+09:00`);
      if (Number.isNaN(date.getTime())) return '';
      date.setMonth(date.getMonth() - 1);
      return new Date(date.getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 7);
    }

    function dashboardMonthlyActiveValue(month) {
      const rows = appState.admin.dashboard?.월별이용회원 || [];
      const row = rows.find((item) => String(item.월 || '').slice(0, 7) === month);
      return row ? Math.round(Number(row.이용회원수) || 0) : '';
    }

    function dashboardMoneyShort(value) {
      const number = Number(value) || 0;
      if (Math.abs(number) >= 100000000) return `${(number / 100000000).toFixed(1)}억`;
      return `${Math.round(number / 10000).toLocaleString('ko-KR')}만`;
    }

    function dashboardPercentText(value) {
      const number = Number(value) || 0;
      return `${number.toFixed(Math.abs(number) >= 10 ? 0 : 1)}%`;
    }

    function dashboardRateDelta(current, previous, label) {
      const cur = Number(current) || 0;
      const prev = Number(previous) || 0;
      if (!prev) return { text: `${label} -`, className: '' };
      const pct = ((cur - prev) / prev) * 100;
      return {
        text: `${pct >= 0 ? '▲ +' : '▼ '}${pct.toFixed(1)}% ${label}`,
        className: pct >= 0 ? 'up' : 'down'
      };
    }

    function dashboardPointDelta(current, previous) {
      const cur = Number(current) || 0;
      const prev = Number(previous) || 0;
      if (!prev) return { text: '전월 대비 -', className: '' };
      const delta = cur - prev;
      return {
        text: `${delta >= 0 ? '▲ +' : '▼ '}${delta.toFixed(1)}%p 전월 대비`,
        className: delta >= 0 ? 'up' : 'down'
      };
    }

    function dashboardPlainDelta(current, previous, unit) {
      const cur = Number(current) || 0;
      const prev = Number(previous) || 0;
      if (!prev) return { text: '전월 대비 -', className: '' };
      const delta = cur - prev;
      return {
        text: `${delta >= 0 ? '▲ +' : '▼ '}${Math.round(delta).toLocaleString('ko-KR')}${unit} 전월 대비`,
        className: delta >= 0 ? 'up' : 'down'
      };
    }

    function readFloatingChatPosition() {
      try {
        const saved = JSON.parse(localStorage.getItem(FLOATING_CHAT_POSITION_KEY) || 'null');
        if (!saved || !Number.isFinite(saved.x) || !Number.isFinite(saved.y)) return null;
        return saved;
      } catch (error) {
        return null;
      }
    }

    function clampFloatingChatPosition(position, size = 96) {
      if (!position) return null;
      const margin = 8;
      const maxX = Math.max(margin, window.innerWidth - size - margin);
      const maxY = Math.max(margin, window.innerHeight - size - margin);
      return {
        x: Math.min(Math.max(margin, position.x), maxX),
        y: Math.min(Math.max(margin, position.y), maxY)
      };
    }

    function floatingChatStyle() {
      const position = clampFloatingChatPosition(appState.chat.floatingPosition);
      if (!position) return '';
      appState.chat.floatingPosition = position;
      return `left:${position.x}px;top:${position.y}px;right:auto;bottom:auto;`;
    }

    function setFloatingChatPosition(button, position) {
      const nextPosition = clampFloatingChatPosition(position, button.offsetWidth || 96);
      if (!nextPosition) return;
      appState.chat.floatingPosition = nextPosition;
      button.style.left = `${nextPosition.x}px`;
      button.style.top = `${nextPosition.y}px`;
      button.style.right = 'auto';
      button.style.bottom = 'auto';
    }

    function bindFloatingChatDrag(button) {
      if (!button) return;
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;
      let moved = false;

      button.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        pointerId = event.pointerId;
        const rect = button.getBoundingClientRect();
        startX = event.clientX;
        startY = event.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        moved = false;
        button.classList.add('dragging');
        button.setPointerCapture?.(pointerId);
      });

      button.addEventListener('pointermove', (event) => {
        if (event.pointerId !== pointerId) return;
        const dx = event.clientX - startX;
        const dy = event.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        if (!moved) return;
        event.preventDefault();
        setFloatingChatPosition(button, {
          x: startLeft + dx,
          y: startTop + dy
        });
      });

      const endDrag = (event) => {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        button.classList.remove('dragging');
        button.releasePointerCapture?.(event.pointerId);
        if (!moved) return;
        button.dataset.dragged = 'true';
        localStorage.setItem(FLOATING_CHAT_POSITION_KEY, JSON.stringify(appState.chat.floatingPosition));
        setTimeout(() => {
          delete button.dataset.dragged;
        }, 0);
      };

      button.addEventListener('pointerup', endDrag);
      button.addEventListener('pointercancel', endDrag);
    }

    function renderClassFlowChart(views) {
      const points = classFlowPoints(views);
      const max = Math.max(1, ...points.map((point) => Math.max(point.group, point.private)));
      const width = 300;
      const height = 132;
      const padX = 24;
      const padTop = 16;
      const padBottom = 28;
      const chartHeight = height - padTop - padBottom;
      const x = (index) => padX + (index * ((width - padX * 2) / Math.max(1, points.length - 1)));
      const y = (value) => padTop + chartHeight - (value / max) * chartHeight;
      const pathFor = (key) => points.map((point, index) => `${index ? 'L' : 'M'} ${x(index).toFixed(1)} ${y(point[key]).toFixed(1)}`).join(' ');
      return `
        <div class="flow-chart">
          <div class="flow-legend">

            <span><i class="flow-dot private"></i>프라이빗</span>

          <svg class="flow-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="최근 4주 수업 흐름">
            <line class="flow-grid" x1="${padX}" y1="${padTop}" x2="${width - padX}" y2="${padTop}"></line>
            <line class="flow-grid" x1="${padX}" y1="${padTop + chartHeight / 2}" x2="${width - padX}" y2="${padTop + chartHeight / 2}"></line>
            <line class="flow-grid" x1="${padX}" y1="${padTop + chartHeight}" x2="${width - padX}" y2="${padTop + chartHeight}"></line>
            <path class="flow-line" d="${pathFor('group')}"></path>
            <path class="flow-line private" d="${pathFor('private')}"></path>
            ${points.map((point, index) => `
              <circle class="flow-point" cx="${x(index).toFixed(1)}" cy="${y(point.group).toFixed(1)}" r="3.8"></circle>
              <circle class="flow-point private" cx="${x(index).toFixed(1)}" cy="${y(point.private).toFixed(1)}" r="3.8"></circle>
              <text class="flow-label" x="${x(index).toFixed(1)}" y="${height - 8}" text-anchor="middle">${escapeHtml(point.label)}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }

    function renderActiveMemberFlowChart() {
      const points = monthlyActiveMemberPoints();
      if (!points.length) {
        return '<div class="empty">월 유효회원 데이터가 없습니다</div>';
      }
      const max = Math.max(1, ...points.map((point) => point.value));
      const width = 300;
      const height = 132;
      const padX = 24;
      const padTop = 16;
      const padBottom = 28;
      const chartHeight = height - padTop - padBottom;
      const x = (index) => padX + (index * ((width - padX * 2) / Math.max(1, points.length - 1)));
      const y = (value) => padTop + chartHeight - (value / max) * chartHeight;
      const path = points.map((point, index) => `${index ? 'L' : 'M'} ${x(index).toFixed(1)} ${y(point.value).toFixed(1)}`).join(' ');
      return `
        <div class="flow-chart">
          <svg class="flow-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="월 유효회원수 흐름">
            <line class="flow-grid" x1="${padX}" y1="${padTop}" x2="${width - padX}" y2="${padTop}"></line>

            <path class="flow-line" d="${path}"></path>
            ${points.map((point, index) => `
              <circle class="flow-point" cx="${x(index).toFixed(1)}" cy="${y(point.value).toFixed(1)}" r="3.8"></circle>

    function monthlyActiveMemberPoints() {
      const rows = appState.admin.dashboard?.월별이용회원 || [];
      const selectedMonth = String(appState.selectedDate || '').slice(0, 7);
      return rows
        .filter((row) => row.월 && Number(row.이용회원수) > 0)
        .filter((row) => !selectedMonth || String(row.월) <= selectedMonth)
        .sort((a, b) => String(a.월).localeCompare(String(b.월)))
        .slice(-6)
        .map((row) => ({
          label: String(row.월).replace(/^20\d{2}-/, ''),
          value: Math.round(Number(row.이용회원수) || 0)
        }));
    }

    function classFlowPoints(views) {
      const currentWeekStart = weekStartDate(appState.selectedDate);
      return [3, 2, 1, 0].map((weekOffset) => {
        const weekStart = addDays(currentWeekStart, -weekOffset * 7);
        const weekEnd = addDays(weekStart, 6);
        const weekViews = views.filter((view) => view.date >= weekStart && view.date <= weekEnd);
        const counts = weekViews.reduce((total, view) => {
          const count = classTypeCounts(view.lectures || []);
          total.group += count.group;
          total.private += count.private;
          return total;
        }, { group: 0, private: 0 });
        return {
          label: weekOffset ? `${weekOffset}주전` : '이번주',
          ...counts
        };
      });
    }

    function prepareActionMessage(actionKey, type, title, date, mode, detail = '') {
      if (!actionKey) return;
      if (mode === 'auto') {
        showToast(`${title || '회원'} ${type || detail || '알림톡'} 후보입니다`);
      } else if (mode === 'pending') {
        showToast(`${type || detail || '알림톡'} 템플릿 검수 완료 후 발송할 수 있습니다`);
      } else {
        showToast(`${title || '회원'} 확인 후 알림 발송 대상입니다`);
      }
    }

    async function completeAdminAction(actionKey, actionDateValue = appState.selectedDate) {
      if (!actionKey || !appState.db || !appState.staff?.studioId) return;
      const targetDate = actionDateValue || appState.selectedDate;
      const previous = appState.admin.actionsState || {};
      const previousRangeActions = appState.admin.rangeActions || [];
      const previousTargetState = adminActionStateForDate(targetDate) || { date: targetDate };
      const completed = new Set(previousTargetState.completedActionKeys || []);
      completed.add(actionKey);
      const nextTargetState = {
        ...previousTargetState,
        date: targetDate,
        completedActionKeys: [...completed]
      };
      if (targetDate === appState.selectedDate) appState.admin.actionsState = nextTargetState;
      appState.admin.rangeActions = [
        ...(appState.admin.rangeActions || []).filter((item) => item.date !== targetDate),
        nextTargetState
      ].sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
      renderApp();
      try {
        await setDoc(doc(appState.db, 'adminActions', `${appState.staff.studioId}_${targetDate}`), {
          studioId: appState.staff.studioId,
          date: targetDate,
          completedActionKeys: arrayUnion(actionKey),
          completedByUid: appState.user?.uid || '',
          completedAt: serverTimestamp()
        }, { merge: true });
        showToast('액션을 완료 처리했습니다');
      } catch (err) {
        appState.admin.actionsState = previous;
        appState.admin.rangeActions = previousRangeActions;
        renderApp();
        showToast(`액션 완료 실패: ${err.message || err}`);
      }
    }

    async function signIn() {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ hd: 'archivepilates.com' });
      try {
        await signInWithPopup(appState.auth, provider);
      } catch (err) {
        if (err && err.code === 'auth/popup-blocked') {
          await signInWithRedirect(appState.auth, provider);
          return;
        }
        throw err;
      }
    }

      const email = document.getElementById('emailInput')?.value.trim();
      const password = document.getElementById('passwordInput')?.value;

        appState.error = '이메일과 비밀번호를 입력하세요';

      }
      try {

        appState.error = friendlyError(err);
        renderLogin(appState.error);

      const phone = document.getElementById('phoneInput')?.value.trim();
      const pin = document.getElementById('pinInput')?.value.trim();
      if (!phone || !pin) {
        appState.error = '휴대폰번호와 비밀번호를 입력하세요';
        renderLogin(appState.error);
        return;
      }
      try {

    async function setupPhonePin() {
      const phone = document.getElementById('setupPhoneInput')?.value.trim();
      const tempCode = document.getElementById('tempCodeInput')?.value.trim();
      const pin = document.getElementById('newPinInput')?.value.trim();
      const confirm = document.getElementById('newPinConfirmInput')?.value.trim();
      if (!phone || !tempCode || !pin || pin !== confirm) {
        appState.error = '휴대폰번호, 임시코드, 새 비밀번호 확인을 입력하세요';
        renderLogin(appState.error);
        return;
      }
      try {
        const userCredential = await signInWithEmailAndPassword(appState.auth, phoneLoginEmail(phone), tempCode);
        await updatePassword(userCredential.user, pin);
        showToast('비밀번호가 변경됐습니다');
      } catch (err) {
        appState.error = friendlyError(err);
        renderLogin(appState.error);

    function phoneLoginEmail(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      if (!digits) throw new Error('휴대폰번호를 입력하세요');
      return `p${digits}@archivepilates.com`;
    }

    async function loadHome() {
      const requestId = appState.loadRequestId + 1;
      appState.loadRequestId = requestId;
      appState.loading = true;
      appState.error = '';
      renderApp();
      try {
        const { manager, result } = await withTimeout((async () => {
          const tokenResult = await appState.user.getIdTokenResult(false);
          const role = tokenResult.claims.role || '';
          const isManager = role === 'owner' || role === 'manager';
          if (!isManager && appState.viewMode === 'month') appState.viewMode = 'day';
          return {
            manager: isManager,
            result: isManager ? await loadAdminHomeFromFirestore(tokenResult) : await loadHomeFromFirestore(tokenResult)
          };
        })(), 45000, '데이터 불러오기 시간이 초과되었습니다');
        if (requestId !== appState.loadRequestId) return;
        appState.mode = manager ? 'manager' : 'instructor';
        appState.staff = result.staff || { name: result.staffId || '' };
        subscribeConversations();
        if (manager) {
          appState.days = [];
          appState.admin = result.admin || appState.admin;
          if (!appState.chat.selectedStaffId) appState.chat.selectedStaffId = appState.admin.staffs?.[0]?.staffId || '';
          subscribeAdminViews();
          if (appState.admin.activeTab === 'chat') subscribeChat(selectedChatStaffId());
        } else {
          appState.days = result.days || [];
          subscribeInstructorViews(result.staffId);
        }
      } catch (err) {
        if (requestId !== appState.loadRequestId) return;
        appState.error = friendlyError(err);
      } finally {
        if (requestId === appState.loadRequestId) {
          appState.loading = false;
          renderApp();
        }
      }
    }

    function withTimeout(promise, timeoutMs, message) {
      let timer = null;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message || '요청 시간이 초과되었습니다')), timeoutMs);
      });
      return Promise.race([promise, timeout]).finally(() => {
        if (timer) clearTimeout(timer);
      });
    }
