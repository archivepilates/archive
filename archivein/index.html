<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>아카이브IN</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="아카이브IN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="아카이브IN">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest?v=24">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=24">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=24">
  <style>
    :root {
      --ink: #1A1A1A;
      --text-2: #454545;
      --muted: #767676;
      --line: #E5E8EB;
      --paper: #FFFFFF;
      --canvas: #F7F7F6;
      --surface: #FFFFFF;
      --soft: #FEF0E6;
      --brand: #F06B1A;
      --brand-dark: #C85510;
      --good: #65764A;
      --bad: #A94D38;
      --wait: #9A753A;
      --sage: #66745B;
      --metric-class: #F06B1A;
      --metric-consultation: #1D7EA6;
      --metric-other: #7A5DB0;
      --metric-action: #C94632;
      --shadow: 0 16px 36px rgba(26, 26, 26, 0.08);
      --soft-shadow: 0 8px 22px rgba(26, 26, 26, 0.055);
      --type-title: 22px;
      --type-body: 15px;
      --type-caption: 13px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body { overflow-x: hidden; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.86)),
        repeating-linear-gradient(135deg, rgba(26, 26, 26, 0.012) 0, rgba(26, 26, 26, 0.012) 1px, transparent 1px, transparent 8px);
      z-index: -1;
    }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    .chip,
    .lecture,
    .member,
    .modal-panel {
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .app {
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 14px max(30px, env(safe-area-inset-bottom));
      background:
        linear-gradient(180deg, var(--paper) 0%, var(--paper) 48%, var(--canvas) 100%);
    }

    .shell {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 9px;
      min-height: 68px;
      padding: 8px 0 12px;
      border-bottom: 1px solid rgba(229, 232, 235, 0.82);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
    }

    .sync-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      overflow: hidden;
      background: transparent;
    }

    .sync-bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: 999px;
      background: var(--brand);
      opacity: 0;
      transform: translateX(-110%);
    }

    .topbar.loading .sync-bar::before {
      opacity: 1;
      animation: syncMove 1.1s ease-in-out infinite;
    }

    .logo {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .identity {
      min-width: 0;
      flex: 1;
    }

    .identity h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.15;
      font-weight: 850;
    }

    .identity p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 8px;
      flex: 0 0 auto;
    }

    .shell.chat-screen {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .shell.chat-screen .view-stage,
    .shell.chat-screen .admin-chat-panel,
    .shell.chat-screen .chat-layout,
    .shell.chat-screen .chat-box {
      min-height: 0;
      height: 100%;
    }

    .shell.chat-screen .chat-layout {
      grid-template-rows: minmax(0, 1fr);
    }

    .shell.chat-screen .admin-chat-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .shell.chat-screen .chat-box {
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .shell.chat-screen .chat-staff-list {
      max-height: none;
    }

    .ghost,
    .primary,
    .soft-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 760;
      font-size: 14px;
      white-space: nowrap;
    }

    .primary {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 8px 16px rgba(240, 107, 26, 0.18);
    }

    .soft-button {
      color: var(--brand-dark);
      background: var(--soft);
      border: 1px solid rgba(240, 107, 26, 0.12);
    }

    .soft-button.compact {
      min-width: 44px;
      padding-inline: 10px;
    }

    .icon-action {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      min-height: 40px;
      border: 1px solid rgba(240, 107, 26, 0.14);
      border-radius: 8px;
      color: var(--brand-dark);
      background: var(--soft);
      font-size: 18px;
      font-weight: 850;
      line-height: 1;
    }

    .icon-action svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .ghost {
      color: var(--muted);
      background: transparent;
    }

    .login {
      display: grid;
      min-height: calc(100dvh - 60px);
      place-items: center;
      text-align: center;
    }

    .login-panel {
      width: min(420px, 100%);
      padding: 28px 18px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .login-mark {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font-size: 28px;
      font-weight: 850;
      box-shadow: 0 14px 28px rgba(240, 107, 26, 0.2);
    }

    .login-brand {
      margin: 0 0 14px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .login h1 {
      margin: 0 0 10px;
      font-size: 29px;
      line-height: 1.15;
    }

    .login p {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .email-login {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .login-fields {
      display: grid;
      gap: 9px;
    }

    .login-setup {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .login-setup-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-align: left;
    }

    .email-login input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      text-align: center;
      font-size: 16px;
    }

    .email-login input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(240, 107, 26, 0.14);
    }

    .config-warning {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border: 1px solid rgba(240, 107, 26, 0.24);
      border-radius: 8px;
      color: var(--brand-dark);
      background: var(--soft);
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
    }

    .datebar {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
      margin: 10px 0 8px;
    }

    .date-nav-button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-size: 22px;
      box-shadow: var(--soft-shadow);
    }

    .datebar strong {
      text-align: center;
      font-size: 20px;
      font-weight: 850;
    }

    .view-switch {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      align-items: center;
      gap: 4px;
      width: 100%;
      margin: 0 0 18px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--soft-shadow);
    }

    .view-switch button {
      height: 34px;
      padding: 0 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .view-switch button.active {
      color: #fff;
      background: var(--brand);
      box-shadow: 0 5px 12px rgba(240, 107, 26, 0.18);
    }

    .calendar-grid {
      display: grid;
      gap: 6px;
      margin-top: 14px;
    }

    .calendar-grid.week,
    .calendar-grid.month {
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekday {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      font-weight: 850;
    }

    .calendar-day {
      position: relative;
      min-width: 0;
      min-height: 88px;
      padding: 8px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
      box-shadow: var(--soft-shadow);
    }

    .calendar-day.muted {
      opacity: 0.45;
      background: var(--canvas);
    }

    .calendar-day.today {
      border-color: rgba(240, 107, 26, 0.55);
      background: var(--soft);
    }

    .calendar-day.selected {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(240, 107, 26, 0.14), var(--soft-shadow);
    }

    .calendar-date {
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
    }

    .calendar-date small {
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
    }

    .calendar-metrics {
      display: grid;
      grid-template-columns: repeat(3, max-content);
      justify-content: center;
      gap: 3px;
      margin-top: 7px;
      min-width: 0;
    }

    .calendar-metric {
      display: inline-grid;
      place-items: center;
      min-width: 14px;
      height: 14px;
      border-radius: 999px;
      padding: 0 4px;
      color: #fff;
      background: var(--muted);
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
    }

    .calendar-metric.class,
    .calendar-legend .class { background: var(--metric-class); }

    .calendar-metric.consult,
    .calendar-legend .consult { background: var(--metric-consultation); }

    .calendar-metric.other,
    .calendar-legend .other { background: var(--metric-other); }

    .calendar-metric.action,
    .calendar-legend .action { background: var(--metric-action); }

    .calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .calendar-legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .calendar-legend i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
    }

    .view-stage {
      animation: viewIn 180ms ease both;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--soft-shadow);
    }

    .summary-item {
      min-width: 0;
      padding: 17px 7px;
      text-align: center;
    }

    button.summary-item {
      display: block;
      width: 100%;
      border-radius: 0;
      background: transparent;
    }

    button.summary-item:focus-visible {
      outline: 2px solid rgba(240, 107, 26, 0.34);
      outline-offset: -2px;
    }

    .summary-item + .summary-item {
      border-left: 1px solid var(--line);
    }

    .summary-label {
      display: block;
      color: var(--brand);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .summary-value {
      display: block;
      margin-top: 7px;
      font-size: 31px;
      line-height: 1;
      font-weight: 850;
    }

    .summary-note {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-detail {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: viewIn 160ms ease both;
    }

    .summary-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .summary-detail-head h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 850;
    }

    .detail-list {
      display: grid;
      gap: 7px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    button.detail-row {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
    }

    button.detail-row:hover,
    button.detail-row.active {
      background: var(--canvas);
    }

    .detail-row:first-child {
      border-top: 0;
    }

    .detail-row strong {
      min-width: 0;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action-row {
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: 7px 0;
    }

    .action-complete {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 999px;
      font-size: 15px;
      color: var(--muted);
    }

    .action-content {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-size: 12px;
    }

    .action-content:hover strong {
      color: var(--brand-dark);
    }

    .action-send {
      width: auto;
      min-width: 64px;
      height: 32px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid rgba(240, 107, 26, 0.28);
      border-radius: 999px;
      background: var(--soft);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .action-send.auto {
      border-color: rgba(99, 122, 73, 0.24);
      background: rgba(99, 122, 73, 0.1);
      color: #4B6237;
    }

    .action-send.review {
      border-color: rgba(180, 81, 54, 0.2);
      background: rgba(180, 81, 54, 0.08);
      color: #9E422B;
    }

    .action-send.pending {
      border-color: rgba(119, 119, 119, 0.2);
      background: rgba(120, 120, 120, 0.08);
      color: var(--muted);
      cursor: default;
    }

    .action-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .detail-bookings {
      display: grid;
      gap: 6px;
      padding: 8px 0 10px 28px;
      border-top: 1px solid var(--line);
    }

    .detail-booking {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-booking strong {
      min-width: 0;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .admin-toolbar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 10px;
      margin-top: 18px;
      scrollbar-width: none;
    }

    .admin-toolbar::-webkit-scrollbar {
      display: none;
    }

    .admin-filter {
      flex: 0 0 auto;
      min-height: 38px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--staff-color, var(--line));
      border-radius: 8px;
      padding: 0 12px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .admin-filter.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .admin-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: 0 0 16px;
    }

    .admin-tab {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .admin-tab.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .schedule-switch {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--soft-shadow);
    }

    .schedule-switch button {
      min-height: 34px;
      border-radius: 6px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .schedule-switch button.active {
      color: #fff;
      background: var(--brand);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .admin-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
      box-shadow: var(--soft-shadow);
    }

    .admin-panel h2,
    .admin-panel h3 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 850;
    }

    .timetable-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .timetable {
      --minute-px: 1.18px;
      display: grid;
      grid-template-columns: 54px repeat(var(--staff-count), minmax(132px, 1fr));
      min-width: max(100%, calc(54px + var(--staff-count) * 132px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }

    .timetable-corner,
    .timetable-staff {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      min-height: 38px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .timetable-corner {
      left: 0;
      z-index: 3;
    }

    .timetable-staff {
      border-left: 1px solid var(--line);
      border-top: 3px solid var(--staff-color, var(--brand));
    }

    .timetable-time-axis,
    .timetable-column {
      position: relative;
      min-height: calc(var(--range-minutes) * var(--minute-px));
    }

    .timetable-time-axis {
      background: var(--canvas);
      border-right: 1px solid var(--line);
    }

    .timetable-time {
      position: absolute;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-align: center;
    }

    .timetable-column {
      border-left: 1px solid var(--line);
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(60 * var(--minute-px) - 1px),
          rgba(229, 232, 235, 0.75) calc(60 * var(--minute-px) - 1px),
          rgba(229, 232, 235, 0.75) calc(60 * var(--minute-px))
        );
    }

    .timetable-block {
      position: absolute;
      left: 8px;
      right: 8px;
      min-height: 48px;
      display: grid;
      align-content: start;
      gap: 4px;
      padding: 8px 9px;
      border: 1px solid rgba(229, 232, 235, 0.95);
      border-left: 5px solid var(--staff-color, var(--brand));
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--soft-shadow);
      text-align: left;
      overflow: hidden;
    }

    .timetable-block strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 850;
    }

    .timetable-block span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      white-space: nowrap;
    }

    .timetable-block.consult {
      border-left-color: var(--metric-consultation);
      background: rgba(33, 137, 174, 0.08);
    }

    .timetable-block.other {
      border-left-color: var(--metric-other);
      background: rgba(112, 126, 91, 0.08);
    }

    .studio-timetable {
      --minute-px: 1.05px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 0;
      min-width: 0;
    }

    .studio-time-axis,
    .studio-canvas,
    .studio-day-column {
      position: relative;
      min-height: calc(var(--range-minutes) * var(--minute-px));
    }

    .studio-time-axis {
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
    }

    .studio-time-label {
      position: absolute;
      right: 10px;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .studio-canvas,
    .studio-day-column {
      border-left: 1px solid var(--line);
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(60 * var(--minute-px) - 1px),
          rgba(229, 232, 235, 0.95) calc(60 * var(--minute-px) - 1px),
          rgba(229, 232, 235, 0.95) calc(60 * var(--minute-px))
        );
    }

    .studio-hour-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(229, 232, 235, 0.9);
      pointer-events: none;
    }

    .studio-event {
      position: absolute;
      box-sizing: border-box;
      top: var(--top);
      left: calc(var(--left) + var(--lane-gap, 4px));
      width: calc(var(--width) - (var(--lane-gap, 4px) * 2));
      height: var(--height);
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto 1fr;
      gap: 1px 5px;
      padding: 7px 8px;
      border: 2px solid var(--staff-color, var(--brand));
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 5px 12px rgba(23, 23, 23, 0.06);
      overflow: hidden;
      text-align: left;
    }

    .studio-event strong,
    .studio-event span,
    .studio-event small,
    .studio-event em {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.16;
    }

    .studio-event strong {
      font-size: 14px;
      font-weight: 900;
    }

    .studio-event em {
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
      font-weight: 850;
    }

    .studio-event span {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .studio-event small {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }

    .studio-event.class {
      background: rgba(169, 138, 243, 0.72);
      border-color: rgba(169, 138, 243, 0.96);
    }

    .studio-event.private {
      color: #fff;
      background: #3D8B6E;
      border-color: #3D8B6E;
    }

    .studio-event.private span,
    .studio-event.private small,
    .studio-event.private em {
      color: rgba(255, 255, 255, 0.86);
    }

    .studio-event.consult {
      background: rgba(241, 241, 244, 0.96);
      border-color: #6D6882;
    }

    .studio-event.other {
      color: #fff;
      background: #3B436D;
      border-color: #3B436D;
    }

    .studio-event.other span,
    .studio-event.other small,
    .studio-event.other em {
      color: rgba(255, 255, 255, 0.84);
    }

    .studio-event.staff-tone {
      border-color: var(--staff-color, var(--brand));
    }

    .studio-event.class.staff-tone,
    .studio-event.private.staff-tone {
      color: var(--ink);
      background: #fff;
      background: color-mix(in srgb, var(--staff-color, var(--brand)) 13%, #fff);
      border-color: var(--staff-color, var(--brand));
      box-shadow:
        inset 5px 0 0 var(--staff-color, var(--brand)),
        0 5px 12px rgba(23, 23, 23, 0.06);
    }

    .studio-event.private.staff-tone span,
    .studio-event.private.staff-tone small,
    .studio-event.private.staff-tone em {
      color: var(--muted);
    }

    .studio-week-head,
    .studio-week-table {
      display: grid;
      grid-template-columns: 42px repeat(7, minmax(0, 1fr));
    }

    .studio-week-head {
      position: sticky;
      top: 0;
      z-index: 3;
      margin-top: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .studio-week-day {
      min-width: 0;
      min-height: 48px;
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }

    .studio-week-day strong,
    .studio-week-day span {
      display: block;
      line-height: 1.2;
    }

    .studio-week-day strong {
      color: var(--ink);
      font-size: 16px;
    }

    .studio-week-day.selected strong {
      color: var(--brand);
    }

    .studio-week-day.selected span {
      color: var(--brand);
    }

    .studio-week-table .studio-time-axis {
      border-right: 1px solid var(--line);
    }

    .studio-week-table .studio-day-column {
      min-width: 0;
    }

    .studio-week-table .studio-event {
      left: calc(var(--left) + 3px);
      width: calc(var(--width) - 6px);
      min-height: 32px;
      padding: 5px 5px;
      gap: 1px 3px;
    }

    .studio-week-table .studio-event strong {
      font-size: 11px;
    }

    .studio-week-table .studio-event em {
      font-size: 10px;
    }

    .studio-week-table .studio-event span {
      font-size: 10px;
    }

    .studio-week-table .studio-event small {
      display: none;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .admin-table th,
    .admin-table td {
      padding: 9px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .admin-table th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .admin-meter {
      display: grid;
      gap: 8px;
    }

    .admin-meter-row {
      display: grid;
      grid-template-columns: 58px 1fr 44px;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .admin-meter-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--canvas);
    }

    .admin-meter-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--brand);
    }

    .flow-chart {
      display: grid;
      gap: 10px;
    }

    .flow-legend {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .flow-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .flow-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--brand);
    }

    .flow-dot.private {
      background: var(--sage);
    }

    .flow-svg {
      width: 100%;
      height: 170px;
      overflow: visible;
    }

    .flow-grid {
      stroke: rgba(118, 118, 118, 0.16);
      stroke-width: 1;
    }

    .flow-line {
      fill: none;
      stroke: var(--brand);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-line.private {
      stroke: var(--sage);
    }

    .flow-point {
      fill: #fff;
      stroke: var(--brand);
      stroke-width: 2.4;
    }

    .flow-point.private {
      stroke: var(--sage);
    }

    .flow-label {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .admin-list {
      display: grid;
      gap: 8px;
    }

    .operation-panel {
      margin-top: 14px;
    }

    .day-operation-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .day-operation-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 850;
    }

    .day-operation-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .timeline-list {
      display: grid;
      gap: 10px;
    }

    .timeline-lecture {
      border: 1px solid var(--line);
      border-left: 6px solid var(--staff-color, var(--brand));
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--soft-shadow);
    }

    .timeline-lecture .lecture-head {
      grid-template-columns: 68px minmax(0, 1fr) auto;
      background: transparent;
    }

    .timeline-staff {
      color: var(--staff-color, var(--brand-dark));
      font-weight: 850;
    }

    .week-insight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .dashboard-kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .dashboard-kpi {
      min-width: 0;
      padding: 10px;
      border-radius: 8px;
      background: var(--canvas);
    }

    .dashboard-kpi span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .dashboard-kpi strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .dashboard-kpis.compact {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .dashboard-kpi.wide {
      grid-column: 1 / -1;
    }

    .dashboard-kpi em {
      display: block;
      margin-top: 4px;
      font-style: normal;
      font-size: 10px;
      font-weight: 850;
      color: var(--muted);
    }

    .dashboard-kpi em.up {
      color: var(--good-ink);
    }

    .dashboard-kpi em.down {
      color: var(--bad-ink);
    }

    .admin-list-item {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .admin-list-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .admin-list-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .member-search-card {
      display: grid;
      gap: 10px;
    }

    .member-search-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .member-search-head strong {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .member-search-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .member-search-stat {
      min-width: 0;
      padding: 8px;
      border-radius: 8px;
      background: var(--canvas);
    }

    .member-search-stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }

    .member-search-stat strong {
      margin: 3px 0 0;
      font-size: 15px;
    }

    .member-search-meta {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .member-search-meta b {
      color: var(--ink);
      font-weight: 850;
    }

    .member-search-section {
      display: grid;
      gap: 7px;
    }

    .member-search-section h3 {
      margin: 0;
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
    }

    .member-mini-list {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .member-mini-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .member-mini-list strong {
      min-width: 0;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-mini-list li > span {
      min-width: 0;
      text-align: right;
    }

    .member-mini-list.recent-lesson-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(74px, max-content);
      align-items: center;
      gap: 8px;
    }

    .member-mini-list.recent-lesson-list span {
      max-width: 106px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .admin-search {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 12px;
    }

    .chat-staff-list {
      display: grid;
      align-content: start;
      gap: 6px;
      max-height: 460px;
      overflow: auto;
    }

    .chat-staff {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      white-space: nowrap;
    }

    .chat-staff.active {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .chat-box {
      display: grid;
      grid-template-rows: auto minmax(260px, 46dvh) auto;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .chat-head strong {
      font-size: 15px;
      font-weight: 850;
    }

    .chat-messages {
      display: grid;
      align-content: end;
      gap: 8px;
      padding: 12px;
      overflow: auto;
      background: var(--canvas);
    }

    .chat-message {
      max-width: 82%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.42;
    }

    .chat-message.mine {
      justify-self: end;
      border-color: rgba(240, 107, 26, 0.22);
      background: var(--soft);
    }

    .chat-message small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
    }

    .chat-form input {
      min-height: 42px;
    }

    .chat-dock {
      position: fixed;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 35;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      margin: 0;
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chat-dock .chat-box {
      min-height: 0;
      height: 100%;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .floating-chat {
      position: fixed;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 34;
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 0;
      padding: 0;
      color: #fff;
      background: transparent;
      box-shadow: none;
      font-weight: 900;
      touch-action: none;
      cursor: grab;
      user-select: none;
      overflow: visible;
    }

    .floating-chat.dragging {
      cursor: grabbing;
      transition: none;
    }

    .floating-chat .chat-bubble-icon {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 10px 14px rgba(26, 26, 26, 0.12));
    }

    .floating-chat.idle .chat-bubble-icon {
      width: 100%;
      height: 100%;
      transform: none;
    }

    .floating-chat .badge {
      position: absolute;
      top: 6px;
      right: 7px;
      margin: 0;
    }

    body.modal-active .floating-chat {
      display: none;
    }

    .admin-staff-block {
      margin-top: 18px;
    }

    .admin-staff-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }

    .admin-staff-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 850;
    }

    .admin-staff-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .section-title {
      margin: 26px 0 12px;
      color: var(--brand);
      font-size: 17px;
      font-weight: 850;
    }

    .lecture {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
      margin-bottom: 13px;
      box-shadow: var(--soft-shadow);
      animation: cardIn 180ms ease both;
    }

    .timeline-list .timeline-lecture {
      margin-bottom: 0;
      border-color: var(--staff-color, var(--brand));
      border-left-width: 6px;
      border-left-style: solid;
      border-left-color: var(--staff-color, var(--brand));
    }

    .lecture:has(.lecture-head:active),
    .member:has(.tiny:active) {
      box-shadow: 0 8px 22px rgba(26, 26, 26, 0.07);
    }

    .lecture-head {
      display: grid;
      grid-template-columns: 68px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 17px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .lecture.collapsed .lecture-head {
      border-bottom: 0;
    }

    .lecture.collapsed .member-list {
      display: none;
    }

    .consultation-list {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .consultation {
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--soft-shadow);
      animation: cardIn 180ms ease both;
    }

    .consultation-main {
      min-width: 0;
    }

    .consultation-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 850;
    }

    .time {
      color: var(--brand-dark);
      font-size: 19px;
      font-weight: 850;
    }

    .lecture-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 850;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 7px;
      padding: 0 8px;
      color: var(--muted);
      background: var(--canvas);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip.group { color: var(--brand-dark); background: var(--soft); }
    .chip.private { color: var(--sage); background: #EEF2EB; }
    .chip.unknown { color: var(--muted); background: var(--canvas); }
    .chip.good { color: var(--good); background: #EEF3E8; }
    .chip.bad { color: var(--bad); background: #FAECE7; }

      },
      selectedDate: today(),
      detailPanel: '',
      detailLectureId: '',
      viewMode: 'day',
      loading: false,
      error: '',
      activeBooking: null,
      openLectures: new Set(),
      viewUnsubscribers: [],
      memberTagCache: null,
      toastTimer: null,
      loadRequestId: 0
    };

    const functionNames = {
      getHome: 'getInstructorHome',
      attendance: 'submitBookingAttendance',
      memo: 'submitMemberMemo',
      registerFcm: 'registerFcmToken',
      adminSyncRange: 'adminSyncLecturesRange',
      adminPollNotices: 'adminPollManagerNotices'
    };

    init();

    function init() {
      if (!config || !config.apiKey) {
        renderLogin('Firebase 설정 파일이 없습니다. archivein/firebase-config.js를 배포 환경에 추가해야 합니다.');
        return;
      }
      appState.app = initializeApp(config);
      appState.auth = getAuth(appState.app);
      appState.db = getFirestore(appState.app);
      appState.functions = getFunctions(appState.app, config.functionsRegion || 'asia-northeast3');
      getRedirectResult(appState.auth).catch((err) => {
        appState.error = friendlyError(err);
        renderLogin(appState.error);
      });
      onAuthStateChanged(appState.auth, async (user) => {
        appState.user = user;
        if (!user) {
          unsubscribeViews();
          appState.staff = null;
          appState.days = [];
          appState.mode = 'instructor';
          appState.admin = {
            staffs: [],
            views: [],
            rangeViews: [],
            consultations: [],
            rangeConsultations: [],
            otherSchedules: [],
            rangeOtherSchedules: [],
            memos: [],
            memberProfiles: [],
            memberContactIndex: [],
            alimtalkCandidates: [],
            actions: [],
            rangeActions: [],
            actionsState: null,
            syncState: null,
            dashboard: null,
            selectedStaffId: 'all',
            activeTab: 'overview',
            scheduleView: 'list',
            searchQuery: ''
          };
          appState.detailPanel = '';
          appState.viewMode = 'day';
          unsubscribeChat();
          unsubscribeConversations();
          appState.chat = {
            open: false,
            selectedStaffId: '',
            messages: [],
            conversations: [],
            conversationsUnsubscribe: null,
            lastConversationsKey: '',
            lastMessagesKey: '',
            floatingPosition: readFloatingChatPosition(),
            readMarks: {},
            unsubscribe: null
          };
          renderLogin();
          return;
        }
        await loadHome();
        registerPushToken().catch(() => {});
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
        });
      }
    }

    function renderLogin(warning = '') {
      root.innerHTML = `
        <main class="login">
          <section class="login-panel">
            <div class="login-mark">IN</div>
            <div class="login-brand">ARCHIVE IN</div>
            <h1>아카이브IN</h1>

              <input id="phoneInput" type="tel" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="tel" placeholder="휴대폰번호">
              <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="current-password" placeholder="비밀번호 또는 임시코드">
              <button id="phoneLoginButton" class="primary" type="button">로그인</button>

              <input id="tempCodeInput" type="password" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" placeholder="운영자 임시코드">
              <input id="newPinInput" type="password" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="new-password" placeholder="새 비밀번호 6자리 이상">
              <input id="newPinConfirmInput" type="password" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="new-password" placeholder="새 비밀번호 확인">

    function renderApp() {
      appState.memberTagCache = null;
      if (appState.loading) {
        renderLoadingApp();
        return;
      }
      if (appState.mode === 'manager') {
        renderAdminApp();
        return;
      }
      const day = currentDay();
      root.innerHTML = `
        <main class="shell">
          <header class="topbar ${appState.loading ? 'loading' : ''}">
            <button id="homeLogoButton" class="logo" type="button" aria-label="오늘 수업으로 이동">IN</button>
            <div class="identity">
              <h1>${escapeHtml(appState.staff?.name || appState.user?.displayName || '강사')}</h1>

            </div>
            <button id="refreshButton" class="soft-button" type="button">새로고침</button>

    function renderLoadingApp() {
      root.innerHTML = `
        <main class="shell">
          <section class="loading only-logo">

            </div>

        </main>

      appState.memberTagCache = null;

      root.innerHTML = `
        <main class="shell ${isChat ? 'chat-screen' : ''}">
          <header class="topbar ${appState.loading ? 'loading' : ''}">

            ${renderDateControls()}
