<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="../favicon.ico?v=20261011" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/archive-pilates-icon-192.png?v=20261011" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png?v=20261011" />
    <link rel="manifest" href="../site.webmanifest?v=20261011" />
    <title>Members · ARCHIVE CORE</title>
    <link rel="stylesheet" href="../assets/styles.css" />
    <link rel="stylesheet" href="../assets/interface.css" />
    <script src="../firebase-config.js"></script>
    <script type="module" src="../assets/app.js"></script>
  </head>
  <body data-firestore-dashboard data-members-dashboard>
    <div class="shell">
      <aside class="sidebar" aria-label="ARCHIVE CORE navigation">
        <div class="brand"><div class="brand-mark" aria-hidden="true">CORE</div><strong>ARCHIVE CORE</strong><span>ARCHIVE PILATES Operations Platform</span></div>
        <nav class="nav">
          <a href="../" data-section="home">Home <small>요약</small></a>
          <a href="../private/" data-section="private">Private <small>차트</small></a>
          <a href="../staff/" data-section="staff">Staff <small>강사</small></a>
          <a href="../messages/" data-section="messages">Messages <small>알림톡</small></a>
          <a href="../automation/" data-section="automation">Automation <small>관제</small></a>
          <a href="../business/" data-section="business">Business <small>지표</small></a>
          <a href="../imports/" data-section="imports">Imports <small>원본</small></a>
          <a href="../rules/" data-section="rules">Rules <small>규칙</small></a>
          <a href="../settings/" data-section="settings">Settings <small>설정</small></a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="title-block">
            <h1>회원 찾기</h1>
          </div>
          <div class="top-actions" aria-label="상태 확인">
            <div class="connection-card" aria-live="polite"><span id="connectionLabel">로딩</span><strong id="connectionDetail">데이터 연결 준비 중</strong></div>
            <button class="refresh-button" id="refreshButton" type="button">새로고침</button>
          </div>
        </header>
        <section class="grid kpis">
          <article class="panel metric"><div class="metric-label">전체 회원</div><div class="metric-value" id="membersVisibleCount">0</div></article>
          <article class="panel metric"><div class="metric-label">수강 중</div><div class="metric-value" id="membersActiveTicketCount">0</div></article>
          <article class="panel metric"><div class="metric-label">최근 방문</div><div class="metric-value" id="membersRecentVisitCount">0</div></article>
          <article class="panel metric"><div class="metric-label">결제 기록</div><div class="metric-value" id="membersRevenueCount">0</div></article>
        </section>
        <section class="panel">
          <div class="panel-header">
            <div><h2>회원 목록</h2></div>
          </div>
          <div class="toolbar">
            <label class="search-field">
              <span>회원 검색</span>
              <input id="memberSearchInput" type="search" autocomplete="off" placeholder="이름, 회원ID, 전화번호 끝자리, 수강권" />
            </label>
            <div class="filter-bar" id="memberFilterBar" aria-label="회원 빠른 필터">
              <button class="filter-button is-active" type="button" data-member-filter="all">전체 <span id="memberFilterAllCount">0</span></button>
              <button class="filter-button" type="button" data-member-filter="active-ticket">수강 중 <span id="memberFilterActiveCount">0</span></button>
              <button class="filter-button" type="button" data-member-filter="recent-visit">최근 방문 <span id="memberFilterRecentCount">0</span></button>
              <button class="filter-button" type="button" data-member-filter="revenue">결제 기록 <span id="memberFilterRevenueCount">0</span></button>
              <button class="filter-button" type="button" data-member-filter="quality">확인 필요 <span id="memberFilterQualityCount">0</span></button>
            </div>
          </div>
          <div class="table-wrap"><table class="core-table members-table"><thead><tr><th>회원</th><th>수강권</th><th>최근 방문</th><th>누적 매출</th></tr></thead><tbody id="membersTable"><tr><td colspan="4">회원 확인 중</td></tr></tbody></table></div>
          <div class="pagination-bar" id="memberPagination" aria-label="회원 목록 페이지"></div>
        </section>
      </main>
    </div>
  </body>
</html>
