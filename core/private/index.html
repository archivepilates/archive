<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f5ef" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=1" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/archive-pilates-icon-192.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest?v=1" />
    <title>Private · ARCHIVE CORE</title>
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../firebase-config.js"></script>
    <script type="module" src="../assets/app.js"></script>
  </head>
  <body data-firestore-dashboard data-private-dashboard>
    <div class="shell">
      <aside class="sidebar" aria-label="ARCHIVE CORE navigation">
        <div class="brand"><div class="brand-mark" aria-hidden="true">CORE</div><strong>ARCHIVE CORE</strong><span>ARCHIVE PILATES Operations Platform</span></div>
        <nav class="nav">
          <a href="../" data-section="home">Home <small>요약</small></a><a href="./" data-section="private">Private <small>차트</small></a><a href="../staff/" data-section="staff">Staff <small>강사</small></a><a href="../messages/" data-section="messages">Messages <small>알림톡</small></a><a href="../automation/" data-section="automation">Automation <small>관제</small></a><a href="../business/" data-section="business">Business <small>지표</small></a><a href="../imports/" data-section="imports">Imports <small>원본</small></a><a href="../rules/" data-section="rules">Rules <small>규칙</small></a><a href="../settings/" data-section="settings">Settings <small>설정</small></a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="title-block"><p class="eyebrow">프라이빗</p><h1>진행 현황</h1></div>
          <div class="top-actions" aria-label="상태 확인"><div class="connection-card" aria-live="polite"><span id="connectionLabel">로딩</span><strong id="connectionDetail">데이터 연결 준비 중</strong></div><button class="refresh-button" id="refreshButton" type="button">새로고침</button></div>
        </header>
        <section class="grid summary-grid">
          <article class="panel detail-card"><span class="pill warn">전체 미진행</span><h2 id="privatePendingCount">0건</h2></article>
          <article class="panel detail-card"><span class="pill">수업 준비</span><h2 id="privatePreStageCount">0건</h2></article>
          <article class="panel detail-card"><span class="pill">수업 기록</span><h2 id="privatePostStageCount">0건</h2></article>
          <article class="panel detail-card"><span class="pill good">전달 완료</span><h2 id="privateCompleteStageCount">0건</h2></article>
        </section>
        <section class="panel">
          <div class="panel-header">
            <div><h2>강사별 다음 작업</h2></div>
            <span class="pill warn" id="privateInstructorPendingStatus">확인 중</span>
          </div>
          <div class="list compact-list" id="privateInstructorPendingList"><div class="empty-state">데이터 연결 후 표시합니다.</div></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <div><h2>단계별 현황</h2></div>
            <span class="pill" id="privateProgressStatus">진행 확인</span>
          </div>
          <div class="stage-board" id="privateProgressList"><div class="empty-state">데이터 연결 후 표시합니다.</div></div>
        </section>
      </main>
    </div>
  </body>
</html>
