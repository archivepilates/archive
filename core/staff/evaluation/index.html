<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" href="../../favicon.ico?v=20261011" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/favicon-16.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png?v=20261011" />
    <link rel="icon" type="image/png" sizes="192x192" href="../../icons/archive-pilates-icon-192.png?v=20261011" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/apple-touch-icon.png?v=20261011" />
    <link rel="manifest" href="../../site.webmanifest?v=20261011" />
    <title>Instructor Evaluation · ARCHIVE CORE</title>
    <link rel="stylesheet" href="../../assets/styles.css" />
    <link rel="stylesheet" href="../../assets/interface.css" />
    <script src="../../firebase-config.js"></script>
    <script type="module" src="../../assets/app.js"></script>
  </head>
  <body data-firestore-dashboard>
    <div class="shell">
      <aside class="sidebar" aria-label="ARCHIVE CORE navigation">
        <div class="brand"><div class="brand-mark" aria-hidden="true">CORE</div><strong>ARCHIVE CORE</strong><span>ARCHIVE PILATES Operations Platform</span></div>
        <nav class="nav">
          <a href="../../" data-section="home">Home <small>요약</small></a><a href="../../private/" data-section="private">Private <small>차트</small></a><a href="../" data-section="staff">Staff <small>강사</small></a><a href="../../messages/" data-section="messages">Messages <small>알림톡</small></a><a href="../../automation/" data-section="automation">Automation <small>관제</small></a><a href="../../business/" data-section="business">Business <small>지표</small></a><a href="../../imports/" data-section="imports">Imports <small>원본</small></a><a href="../../rules/" data-section="rules">Rules <small>규칙</small></a><a href="../../settings/" data-section="settings">Settings <small>설정</small></a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="title-block">
            <h1 id="evaluationQuizTitle">강사 평가 퀴즈</h1>
            <p class="subtitle" id="evaluationQuizDescription">ARCHIVE PILATES 운영 기준을 확인합니다.</p>
          </div>
          <div class="top-actions" aria-label="상태 확인">
            <div class="connection-card" aria-live="polite">
              <span id="connectionLabel">로딩</span>
              <strong id="connectionDetail">데이터 연결 준비 중</strong>
            </div>
            <button class="refresh-button" id="refreshButton" type="button">새로고침</button>
          </div>
        </header>

        <section class="panel quiz-panel">
          <div class="panel-header">
            <div><h2>평가 제출</h2></div>
          </div>
          <form class="quiz-form" id="instructorEvaluationQuizForm">
            <label class="quiz-target">
              <span>대상 강사</span>
              <select id="evaluationTargetStaff" name="staffId" required>
                <option value="">로그인 후 강사 목록을 불러옵니다</option>
              </select>
            </label>
            <div class="quiz-question-list" id="evaluationQuizQuestions">
              <div class="empty-state">퀴즈 문항을 불러오는 중입니다.</div>
            </div>
            <div class="action-form-footer">
              <button class="primary-action" id="evaluationQuizSubmit" type="submit">평가 퀴즈 제출</button>
              <a class="secondary-action" href="../">인사기록카드 보기</a>
              <p class="form-status" id="evaluationQuizStatus" role="status" aria-live="polite">로그인 후 퀴즈를 불러옵니다.</p>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
