<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f5ef" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=1" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/archive-pilates-icon-192.png?v=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest?v=1" />
    <title>Automation · ARCHIVE CORE</title>
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../firebase-config.js"></script>
    <script type="module" src="../assets/app.js"></script>
  </head>
  <body data-firestore-dashboard>
    <div class="shell">
      <aside class="sidebar" aria-label="ARCHIVE CORE navigation">
        <div class="brand"><div class="brand-mark" aria-hidden="true">CORE</div><strong>ARCHIVE CORE</strong><span>ARCHIVE PILATES Operations Platform</span></div>
        <nav class="nav">
          <a href="../" data-section="home">Home <small>요약</small></a><a href="../private/" data-section="private">Private <small>차트</small></a><a href="../staff/" data-section="staff">Staff <small>강사</small></a><a href="../messages/" data-section="messages">Messages <small>알림톡</small></a><a href="./" data-section="automation">Automation <small>관제</small></a><a href="../business/" data-section="business">Business <small>지표</small></a><a href="../imports/" data-section="imports">Imports <small>원본</small></a><a href="../rules/" data-section="rules">Rules <small>규칙</small></a><a href="../settings/" data-section="settings">Settings <small>설정</small></a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="title-block"><p class="eyebrow">관리</p><h1>자동화 상태</h1></div>
          <div class="top-actions"><div class="connection-card" aria-live="polite"><span id="connectionLabel">로딩</span><strong id="connectionDetail">데이터 연결 준비 중</strong></div><button class="refresh-button" id="refreshButton" type="button">새로고침</button></div>
        </header>
        <section class="grid kpis">
          <article class="panel metric"><div class="metric-label">운영 중</div><div class="metric-value" id="automationStatusCount">0건</div></article>
          <article class="panel metric"><div class="metric-label">확인 필요</div><div class="metric-value" id="automationFailedCount">0건</div></article>
          <article class="panel metric"><div class="metric-label">최근 실행</div><div class="metric-value compact" id="automationRecentRun">확인 중</div></article>
        </section>
        <section class="panel">
          <div class="panel-header"><div><h2>확인할 작업</h2></div><span class="pill" id="automationMode">확인 중</span></div>
          <div class="list compact-list" id="automationHealthList"><div class="empty-state">자동화 상태를 확인합니다.</div></div>
        </section>
        <details class="panel diagnostic-panel">
          <summary><span>전체 자동화 기록</span><small>정상 실행과 이전 기록 보기</small></summary>
          <div class="list" id="automationList"><div class="empty-state">기록을 확인합니다.</div></div>
        </details>
      </main>
    </div>
  </body>
</html>
